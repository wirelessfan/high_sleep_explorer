<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridPer" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowPer" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fafdfb" filter="url(#shadowPer)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridPer)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(16, 185, 129, 0.25)" rx="3" transform="rotate(-0.3 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="1">
    ★ 元素周期律 · 「位—构—性」三角互推模型
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <!-- 三角形三顶点 -->
    <!-- 顶点 1: 结构 (顶端) -->
    <g transform="translate(210, 15)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="70" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">【构】微观结构</text>
      <text x="70" y="40" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle">电子层数 / 最外层电子数</text>
    </g>

    <!-- 顶点 2: 位置 (左下) -->
    <g transform="translate(30, 150)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="70" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#92400e" text-anchor="middle">【位】周期表位置</text>
      <text x="70" y="40" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">第 n 周期 / 第 m 主族</text>
    </g>

    <!-- 顶点 3: 性质 (右下) -->
    <g transform="translate(390, 150)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="70" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#991b1b" text-anchor="middle">【性】元素性质</text>
      <text x="70" y="40" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">金属性/非金属性/化合价</text>
    </g>

    <!-- 连线双向关系 -->
    <!-- 构 <-> 位 -->
    <line x1="210" y1="55" x2="150" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="145" y="95" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="700" fill="#475569">层数=周期数</text>
    <text x="145" y="112" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="700" fill="#475569">最外层=主族序</text>

    <!-- 构 <-> 性 -->
    <line x1="350" y1="55" x2="410" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="400" y="95" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="700" fill="#475569">半径小难失得电子强</text>
    <text x="400" y="112" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="700" fill="#475569">最外层多非金属性强</text>

    <!-- 位 <-> 性 (底边) -->
    <line x1="170" y1="175" x2="390" y2="175" stroke="#059669" stroke-width="2.5"/>
    <text x="280" y="170" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">同周期从左往右金属性弱，同主族从上往下金属性强</text>

    <!-- 底部口诀 -->
    <rect x="25" y="215" width="510" height="22" rx="4" fill="#f0fdf4"/>
    <text x="280" y="230" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">
      口诀：看到未知元素，先定结构画原子，由结构定位排布，三位一体推导性质！
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridGalAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowGalAnim" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 滚球 1：左斜面滚下至右侧 45° 陡斜面等高处，来回往复 */
      @keyframes rollSteep {
        0% { transform: translate(58px, 78px); }
        45% { transform: translate(160px, 172px); }
        55% { transform: translate(160px, 172px); }
        100% { transform: translate(264px, 76px); }
      }
      /* 滚球 2：水平面上永远匀速向右运动并循环 */
      @keyframes rollInfinitely {
        0% { transform: translate(160px, 172px); opacity: 0.3; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translate(520px, 172px); opacity: 0; }
      }
      /* 呼吸光斑 */
      @keyframes pulseGal {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .ball-rolling-steep {
        animation: rollSteep 2.5s ease-in-out infinite alternate;
      }
      .ball-rolling-infinite {
        animation: rollInfinitely 2.8s linear infinite;
      }
      .pulse-indicator-gal {
        animation: pulseGal 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="320" rx="14" fill="#fdfbf7" filter="url(#shadowGalAnim)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridGalAnim)"/>

  <!-- 顶部标题标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(245, 158, 11, 0.3)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#92400e" text-anchor="middle" letter-spacing="1">
    ⚡ 动态模拟 · 伽利略理想斜面滚球实验
  </text>

  <!-- 主绘图区域 -->
  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 动态状态指示 -->
    <circle cx="25" cy="22" r="5" fill="#10b981" class="pulse-indicator-gal"/>
    <text x="36" y="26" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#047857">
      动态小球正在沿斜面与水平面匀速滚动
    </text>

    <!-- 地基剖面 -->
    <line x1="30" y1="180" x2="530" y2="180" stroke="#78716c" stroke-width="2.5"/>

    <!-- 等高 h 虚线 (y = 70) -->
    <line x1="40" y1="70" x2="520" y2="70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="490" y="65" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#d97706">等高 h 虚线</text>

    <!-- 左侧固定 45° 斜面 -->
    <path d="M 50 70 L 160 180" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

    <!-- 右侧斜面 1 (陡斜面 45°) -->
    <path d="M 160 180 L 270 70" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="272" y="62" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#475569">① 达等高 h</text>

    <!-- 右侧斜面 2 (缓斜面) -->
    <path d="M 160 180 L 380 70" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
    <text x="368" y="62" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#475569">② 倾角小路程长</text>

    <!-- 右侧水平段 (完全水平极限) -->
    <path d="M 160 180 L 520 180" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 515 176 L 525 180 L 515 184 Z" fill="#dc2626"/>

    <!-- 动态小球 A (在左斜面与右斜面之间往复滚动) -->
    <g class="ball-rolling-steep">
      <circle cx="0" cy="0" r="9" fill="#ef4444" stroke="#991b1b" stroke-width="1.8"/>
      <!-- 小球内部手账反光弧 -->
      <path d="M -4 -4 Q 0 -6, 4 -4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </g>

    <!-- 动态小球 B (在水平面上无休止匀速滚动，动态飞奔) -->
    <g class="ball-rolling-infinite">
      <circle cx="0" cy="0" r="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.8"/>
      <line x1="8" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2"/>
      <path d="M 16 -3 L 22 0 L 16 3 Z" fill="#2563eb"/>
    </g>
    <text x="360" y="202" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#2563eb">
      ③ 水平面动态实况：小球将以恒定速度永远滚向无穷远！
    </text>

    <!-- 底部结论便签 -->
    <rect x="25" y="212" width="510" height="25" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="280" y="229" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#991b1b" text-anchor="middle">
      ★ 核心推论：若无摩擦阻碍，物体的速度将保持恒定不变——动者恒动！
    </text>
  </g>
</svg>

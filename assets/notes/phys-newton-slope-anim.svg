<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridSlopeAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowSlopeAnim" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 总周期 8 秒分步循环 */
      /* Step 1: 重力 G (0s ~ 8s 全程可见，但在 0% 渐现) */
      @keyframes step1Gravity {
        0% { opacity: 0; transform: translateY(-10px); }
        8%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }
      /* Step 2: 弹力支持力 FN (20% 出现) */
      @keyframes step2Normal {
        0%, 18% { opacity: 0; transform: translateY(10px); }
        25%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }
      /* Step 3: 外力推力 F (45% 出现) */
      @keyframes step3Push {
        0%, 42% { opacity: 0; transform: translateX(-15px); }
        50%, 95% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; }
      }
      /* Step 4: 正交分解坐标轴与分力 (70% 出现) */
      @keyframes step4Decomp {
        0%, 67% { opacity: 0; transform: scale(0.9); }
        75%, 95% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; }
      }

      /* 步骤卡高亮联动 */
      @keyframes lightStep1 {
        0%, 22% { background-color: #fee2e2; border-color: #ef4444; }
        23%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes lightStep2 {
        0%, 22% { background-color: #ffffff; border-color: #e2e8f0; }
        23%, 47% { background-color: #dcfce7; border-color: #22c55e; }
        48%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes lightStep3 {
        0%, 47% { background-color: #ffffff; border-color: #e2e8f0; }
        48%, 72% { background-color: #eff6ff; border-color: #3b82f6; }
        73%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes lightStep4 {
        0%, 72% { background-color: #ffffff; border-color: #e2e8f0; }
        73%, 96% { background-color: #fef9c3; border-color: #eab308; }
        97%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }

      .anim-g { animation: step1Gravity 8s infinite ease-out; }
      .anim-n { animation: step2Normal 8s infinite ease-out; }
      .anim-f { animation: step3Push 8s infinite ease-out; }
      .anim-xy { animation: step4Decomp 8s infinite ease-out; }

      .card-s1 { animation: lightStep1 8s infinite; }
      .card-s2 { animation: lightStep2 8s infinite; }
      .card-s3 { animation: lightStep3 8s infinite; }
      .card-s4 { animation: lightStep4 8s infinite; }
    </style>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fdfcf7" filter="url(#shadowSlopeAnim)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridSlopeAnim)"/>

  <!-- 顶部标签胶带 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(59, 130, 246, 0.28)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">
    ⚡ 动态拆解 · 受力分析四步法逐步演练
  </text>

  <!-- 左侧：动态受力演练图区 -->
  <g transform="translate(30, 50)">
    <rect width="280" height="300" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="16" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#1e40af">
      【受力图生成实况】严格逐步作图
    </text>

    <!-- 斜面底座 (30°，精确顶点) -->
    <path d="M 25 215 L 245 215 L 245 88 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="20" y1="215" x2="255" y2="215" stroke="#475569" stroke-width="2"/>
    <text x="65" y="206" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#475569">θ = 30°</text>

    <!-- 斜面上滑块 (严格放置在斜面上表面，底边 y=0，绝不陷进斜面) -->
    <g transform="translate(135, 151.5) rotate(-30)">
      <!-- 滑块矩形：高 38 宽 48，底边严格在 y=0 表面 -->
      <rect x="-24" y="-38" width="48" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="0" y="-14" font-family="sans-serif" font-size="14" font-weight="900" fill="#92400e" text-anchor="middle">m</text>
      <!-- 质心受力点 -->
      <circle cx="0" cy="-19" r="3.5" fill="#dc2626"/>

      <!-- Step 2: 支持力 FN (垂直斜面向上，绿色) -->
      <g class="anim-n">
        <line x1="0" y1="-19" x2="0" y2="-72" stroke="#059669" stroke-width="2.6"/>
        <path d="M -4 -66 L 0 -74 L 4 -66 Z" fill="#059669"/>
        <text x="6" y="-68" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#059669">FN (弹力)</text>
      </g>

      <!-- Step 3: 外力推力 F (沿斜面向下，蓝色) -->
      <g class="anim-f">
        <line x1="-55" y1="-19" x2="-26" y2="-19" stroke="#2563eb" stroke-width="2.6"/>
        <path d="M -32 -23 L -24 -19 L -32 -15 Z" fill="#2563eb"/>
        <text x="-48" y="-25" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#2563eb">推力 F</text>
      </g>

      <!-- Step 4: 正交分解坐标轴与分力 -->
      <g class="anim-xy">
        <!-- x 轴 (平行斜面) -->
        <line x1="-35" y1="-19" x2="65" y2="-19" stroke="#eab308" stroke-width="1.6" stroke-dasharray="3,2"/>
        <text x="70" y="-15" font-family="sans-serif" font-size="11" font-weight="900" fill="#ca8a04">+x</text>

        <!-- y 轴 (垂直斜面) -->
        <line x1="0" y1="-19" x2="0" y2="40" stroke="#eab308" stroke-width="1.6" stroke-dasharray="3,2"/>
        <text x="5" y="38" font-family="sans-serif" font-size="11" font-weight="900" fill="#ca8a04">-y</text>

        <!-- 下滑分力 mg sinθ (沿斜面) -->
        <line x1="0" y1="-19" x2="32" y2="-19" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,2"/>
        <path d="M 26 -22 L 34 -19 L 26 -16 Z" fill="#dc2626"/>
        <text x="22" y="-6" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="800" fill="#dc2626">mg sinθ</text>

        <!-- 正压分力 mg cosθ (垂直斜面压向斜面) -->
        <line x1="0" y1="-19" x2="0" y2="18" stroke="#059669" stroke-width="2" stroke-dasharray="2,2"/>
        <path d="M -3 12 L 0 20 L 3 12 Z" fill="#059669"/>
        <text x="6" y="16" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="800" fill="#059669">mg cosθ</text>
      </g>
    </g>

    <!-- Step 1: 竖直向下的重力 G (全局竖直向下，不受倾角影响) -->
    <g class="anim-g">
      <!-- 质心位于 (135 - 19*sin(30°), 151.5 - 19*cos(30°)) ≈ (125.5, 135) -->
      <line x1="125" y1="135" x2="125" y2="195" stroke="#dc2626" stroke-width="2.6"/>
      <path d="M 121 189 L 125 198 L 129 189 Z" fill="#dc2626"/>
      <text x="133" y="196" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#dc2626">G = mg</text>
    </g>

    <!-- 底部便利贴提示 -->
    <rect x="15" y="255" width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="140" y="275" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      口诀：一重二弹三外力，最后正交分解！
    </text>
  </g>

  <!-- 右侧：逐步展示联动指示卡片 -->
  <g transform="translate(325, 50)">
    <rect width="285" height="300" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="18" y="26" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#0f172a">
      【受力分析标准化四步流程】
    </text>

    <!-- 卡片 1 -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-s1"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#dc2626">① 先画重力 G = mg</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">只要在地球表面，必竖直向下！</text>
    </g>

    <!-- 卡片 2 -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-s2"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#059669">② 次画弹力（支持力 FN）</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">垂直接触面指向受力物体，绝不斜画！</text>
    </g>

    <!-- 卡片 3 -->
    <g transform="translate(16, 154)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-s3"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#2563eb">③ 三画外力与摩擦力</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">看清外力 F 的施加方向，判定相对运动</text>
    </g>

    <!-- 卡片 4 -->
    <g transform="translate(16, 212)">
      <rect x="0" y="0" width="253" height="54" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-s4"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#ca8a04">④ 正交分解列方程</text>
      <text x="12" y="36" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#475569">沿 a 方向建 x 轴，重力分解为</text>
      <text x="12" y="48" font-family="'Courier New',sans-serif" font-size="11" font-weight="800" fill="#854d0e">mg sinθ 与 mg cosθ</text>
    </g>

    <!-- 底部状元总结 -->
    <text x="142" y="286" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">
      ★ 四步按部就班，高中物理大题绝不漏力！
    </text>
  </g>
</svg>

<text x="30" y="38" fill="#1e3a8a" font-size="23" font-weight="800">指数与对数：同一个关系的两种写法</text>
<text x="30" y="64" fill="#50647a" font-size="14" >2³ = 8  ⟺  log₂8 = 3：交换输入与输出，也就是交换横坐标与纵坐标。</text>
<text x="44" y="112" fill="#1d4ed8" font-size="16" font-weight="700">① y = 2ˣ：增长越来越快</text>
<text x="436" y="112" fill="#0f766e" font-size="16" font-weight="700">② y = log₂x：增长越来越慢</text>

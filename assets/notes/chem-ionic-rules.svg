<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">离子方程式：拆分要看物态与条件</title>
  <desc id="description">拆分对象是溶液中实际以离子存在的易溶强电解质。。Al³⁺ 与 AlO₂⁻ 双水解只生成 Al(OH)₃ 沉淀；与 HCO₃⁻ 反应还生成 CO₂。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">离子方程式：拆分要看物态与条件</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">拆分对象是溶液中实际以离子存在的易溶强电解质。</text>
  <rect x="24" y="97" width="752" height="60" rx="10" fill="#ffffff" stroke="#d4e2dc"/>
<text x="38" y="120" font-size="17" fill="#dc2626" text-anchor="start" font-weight="700">保留化学式</text>
<text x="38" y="143" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">难溶物、弱电解质、气体、单质与氧化物</text>
<rect x="24" y="165" width="752" height="60" rx="10" fill="#ffffff" stroke="#d4e2dc"/>
<text x="38" y="188" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700">弱酸酸式根保留</text>
<text x="38" y="211" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">HCO₃⁻、HSO₃⁻、HS⁻ 不继续拆</text>
<rect x="24" y="233" width="752" height="60" rx="10" fill="#ffffff" stroke="#d4e2dc"/>
<text x="38" y="256" font-size="17" fill="#047857" text-anchor="start" font-weight="700">微溶物看存在状态</text>
<text x="38" y="279" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">澄清石灰水拆；石灰乳保留 Ca(OH)₂</text>
<rect x="24" y="301" width="752" height="60" rx="10" fill="#ffffff" stroke="#d4e2dc"/>
<text x="38" y="324" font-size="17" fill="#b45309" text-anchor="start" font-weight="700">酸式盐看溶剂</text>
<text x="38" y="347" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">NaHSO₄ 水溶液中拆为 Na⁺、H⁺、SO₄²⁻</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">Al³⁺ 与 AlO₂⁻ 双水解只生成 Al(OH)₃ 沉淀；与 HCO₃⁻ 反应还生成 CO₂。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridChem2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowChem2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fafdfb" filter="url(#shadowChem2)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridChem2)"/>

  <!-- 顶部胶带 -->
  <rect x="200" y="8" width="240" height="26" fill="rgba(14, 165, 233, 0.28)" rx="3" transform="rotate(0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">
    ★ 状元避坑手卡 · 离子方程式拆分与共存
  </text>

  <!-- 左侧：拆与不拆四大金刚 -->
  <g transform="translate(30, 55)">
    <rect width="270" height="295" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="16" y="24" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#0284c7">
      【拆分黄金法则 · 坚决不拆清单】
    </text>

    <!-- 四类不拆 -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="242" height="130" rx="6" fill="#f0f9ff" stroke="#e0f2fe"/>
      <text x="12" y="22" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">
        ① 单质、氧化物（Cu, Na, CuO, CO₂ 均不拆）
      </text>
      <text x="12" y="46" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">
        ② 难溶物（BaSO₄, AgCl, CaCO₃, Fe(OH)₃）
      </text>
      <text x="12" y="70" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">
        ③ 弱电解质（CH₃COOH, NH₃·H₂O, HF, H₂O）
      </text>
      <text x="12" y="94" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">
        ④ 挥发性气体（CO₂, SO₂, NH₃, H₂S）
      </text>
      <text x="12" y="118" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">
        ⑤ 弱酸酸式根不拆（HCO₃⁻, HSO₃⁻, HS⁻）
      </text>
    </g>

    <!-- 特例陷阱 -->
    <rect x="14" y="180" width="242" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="24" y="202" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">
      ⚠ 高频微溶物陷阱：
    </text>
    <text x="24" y="224" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      • 澄清石灰水：溶质少，<tspan fill="#16a34a" font-weight="800">必须拆成 Ca²⁺+2OH⁻</tspan>
    </text>
    <text x="24" y="244" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      • 悬浊液/石灰乳：<tspan fill="#dc2626" font-weight="800">不拆！写成 Ca(OH)₂</tspan>
    </text>
    <text x="24" y="264" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      • NaHSO₄ 在水中：<tspan fill="#16a34a" font-weight="800">强酸酸式根，拆！(H⁺+SO₄²⁻)</tspan>
    </text>
  </g>

  <!-- 右侧：离子共存四大暗坑 -->
  <g transform="translate(320, 55)">
    <rect width="290" height="295" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>

    <text x="18" y="26" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#0369a1">
      【考场四大隐蔽暗坑 · 离子不能共存】
    </text>

    <!-- 暗坑 1 -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#fee2e2"/>
      <text x="35" y="13" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#991b1b" text-anchor="middle">暗坑① 隐蔽氧化</text>
      <text x="0" y="34" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
        Fe²⁺ 与 NO₃⁻ 在 <tspan fill="#dc2626" font-weight="800">酸性(H⁺)</tspan> 下剧烈反应！
      </text>
      <text x="0" y="50" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#64748b">
        （硝酸根遇 H⁺ 具备强氧化性，不能共存）
      </text>
    </g>

    <line x1="18" y1="102" x2="272" y2="102" stroke="#e0f2fe" stroke-width="1"/>

    <!-- 暗坑 2 -->
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#fef3c7"/>
      <text x="35" y="13" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle">暗坑② 双水解</text>
      <text x="0" y="34" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
        Al³⁺ 与 AlO₂⁻、HCO₃⁻、S²⁻ 会彻底双水解！
      </text>
      <text x="0" y="50" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#64748b">
        生成沉淀 + 气体，绝不能大量共存。
      </text>
    </g>

    <line x1="18" y1="170" x2="272" y2="170" stroke="#e0f2fe" stroke-width="1"/>

    <!-- 暗坑 3 -->
    <g transform="translate(18, 178)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#e0e7ff"/>
      <text x="35" y="13" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#3730a3" text-anchor="middle">暗坑③ 溶液颜色</text>
      <text x="0" y="34" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
        题目说「无色溶液」：
      </text>
      <text x="0" y="50" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#b91c1c">
        秒杀排除：Cu²⁺(蓝)、Fe³⁺(黄)、Fe²⁺(浅绿)、MnO₄⁻(紫)
      </text>
    </g>

    <!-- 底部口诀 -->
    <g transform="translate(18, 240)">
      <rect x="0" y="0" width="254" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="127" y="24" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#15803d" text-anchor="middle">
        状元秘籍：先审题设限定，再看反应冲突！
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">物质的量：连接质量、粒子数和气体体积</title>
  <desc id="description">换算时保持单位一致，并写明研究的是哪一种粒子。。22.4 L/mol 仅用于标况下的气体；液体、固体和其他温压条件不直接套用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">物质的量：连接质量、粒子数和气体体积</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">换算时保持单位一致，并写明研究的是哪一种粒子。</text>
  <rect x="24" y="82" width="360" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<rect x="402" y="82" width="374" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<rect x="151" y="190" width="106" height="66" rx="10" fill="#ddf4e6" stroke="#8dbca2"/>
<text x="204" y="219" font-size="28" fill="#047857" text-anchor="middle" font-weight="800">n</text>
<text x="204" y="244" font-size="16" fill="#047857" text-anchor="middle" font-weight="500">mol</text>
<rect x="135" y="105" width="140" height="50" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="205" y="137" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700">质量 m</text>
<rect x="42" y="263" width="112" height="52" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="98" y="295" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700">粒子数 N</text>
<rect x="254" y="263" width="112" height="52" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="310" y="295" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">气体体积 V</text>
<line x1="204" y1="157" x2="204" y2="188" stroke="#b45309" stroke-width="2"/>
<line x1="151" y1="237" x2="112" y2="260" stroke="#2563eb" stroke-width="2"/>
<line x1="257" y1="237" x2="300" y2="260" stroke="#dc2626" stroke-width="2"/>
<text x="420" y="116" font-size="17" fill="#b45309" text-anchor="start" font-weight="500">n = m / M</text>
<text x="420" y="146" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">M 的单位：g/mol</text>
<text x="420" y="184" font-size="17" fill="#2563eb" text-anchor="start" font-weight="500">n = N / Nₐ</text>
<text x="420" y="214" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">Nₐ = 6.02214076 × 10²³ mol⁻¹</text>
<text x="420" y="252" font-size="17" fill="#dc2626" text-anchor="start" font-weight="500">n = V / Vₘ</text>
<text x="420" y="282" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">标况气体：Vₘ ≈ 22.4 L/mol</text>
<text x="420" y="320" font-size="17" fill="#047857" text-anchor="start" font-weight="500">c = n / V溶液</text>
<text x="420" y="350" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">c：mol/L；V溶液：L</text>
<text x="204" y="352" font-size="15" fill="#50647a" text-anchor="middle" font-weight="500">先明确粒子种类、物态和条件</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">22.4 L/mol 仅用于标况下的气体；液体、固体和其他温压条件不直接套用。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridMol" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowMol" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fafdfb" filter="url(#shadowMol)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridMol)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(16, 185, 129, 0.25)" rx="3" transform="rotate(0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="1">
    ★ 化学计算中枢 · 物质的量三座桥梁网络
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <!-- 中枢核心：物质的量 n (mol) -->
    <g transform="translate(225, 75)">
      <rect x="0" y="0" width="110" height="95" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
      <text x="55" y="30" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">万能枢纽</text>
      <text x="55" y="66" font-family="'Courier New',sans-serif" font-size="34" font-weight="900" fill="#047857" text-anchor="middle">n</text>
      <text x="55" y="86" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">物质的量 (mol)</text>
    </g>

    <!-- 桥梁 1: 微观粒子数 N (左侧) -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="120" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="60" y="24" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">微观粒子数 N</text>
      <text x="60" y="44" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#3b82f6" text-anchor="middle">分子/原子/离子</text>

      <!-- 双向箭头 -->
      <line x1="125" y1="27" x2="200" y2="27" stroke="#2563eb" stroke-width="2"/>
      <path d="M 195 23 L 202 27 L 195 31 Z" fill="#2563eb"/>
      <path d="M 130 23 L 123 27 L 130 31 Z" fill="#2563eb"/>
      <text x="162" y="20" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#2563eb" text-anchor="middle">÷ NA</text>
      <text x="162" y="44" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#2563eb" text-anchor="middle">× NA</text>
    </g>

    <!-- 桥梁 2: 宏观质量 m (顶部) -->
    <g transform="translate(220, 10)">
      <rect x="0" y="0" width="120" height="42" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
      <text x="60" y="18" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">宏观质量 m (g)</text>
      <text x="60" y="34" font-family="sans-serif" font-size="10" fill="#b45309" text-anchor="middle">摩尔质量 M (g/mol)</text>

      <!-- 垂直连线 -->
      <line x1="60" y1="45" x2="60" y2="65" stroke="#d97706" stroke-width="2"/>
      <text x="85" y="58" font-family="sans-serif" font-size="10" font-weight="800" fill="#d97706">n = m/M</text>
    </g>

    <!-- 桥梁 3: 气体体积 V (右侧) -->
    <g transform="translate(420, 95)">
      <rect x="0" y="0" width="120" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="60" y="24" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">气体体积 V (L)</text>
      <text x="60" y="44" font-family="'PingFang SC',sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">标况 Vm = 22.4 L/mol</text>

      <!-- 双向连线 -->
      <line x1="-80" y1="27" x2="-5" y2="27" stroke="#dc2626" stroke-width="2"/>
      <path d="M -75 23 L -82 27 L -75 31 Z" fill="#dc2626"/>
      <path d="M -10 23 L -3 27 L -10 31 Z" fill="#dc2626"/>
      <text x="-42" y="20" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">× Vm</text>
      <text x="-42" y="44" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">÷ Vm</text>
    </g>

    <!-- 桥梁 4: 溶液物质的量浓度 c (底部) -->
    <g transform="translate(200, 185)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <text x="80" y="18" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#6b21a8" text-anchor="middle">溶液浓度 c (mol/L)</text>
      <text x="80" y="34" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#7e22ce" text-anchor="middle">c = n / V_液</text>
    </g>

    <!-- 底部口诀便签 -->
    <text x="280" y="238" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">
      考场解题第一铁律：无论题目给出质量、体积还是微粒数，第一时间全部换算成「n」！
    </text>
  </g>
</svg>

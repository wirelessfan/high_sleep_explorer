<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="lg2Title lg2Desc">
  <title id="lg2Title">对数函数图像：底数 a 决定陡峭与方向</title>
  <desc id="lg2Desc">同一坐标系中画出 a=2、a=10（a&gt;1 递增）与 a=1/2、a=1/10（0&lt;a&lt;1 递减）四条对数曲线，全部过定点 (1,0)；动画让底数从 2 连续变化到 10，展示曲线如何越来越平缓。</desc>
  <defs>
    <marker id="lg2Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep {
        0%, 100% { opacity: 0; transform: translateY(0); }
        35%      { opacity: 0.55; }
        70%      { opacity: 0; transform: translateY(-40px); }
      }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { r: 5; opacity: 1; }
        50%      { r: 9; opacity: 0.45; }
      }
    </style>
  </defs>

  <rect width="800" height="580" rx="14" fill="#fbf9f7"/>
  <text x="30" y="38" font-size="23" fill="#7c2d12" font-weight="800">一张图看完对数函数的全部形状</text>
  <text x="30" y="64" font-size="14.5" fill="#50647a">四条曲线都过 (1,0)：底数越大越平缓，底数小于 1 就翻到下方。</text>

  <rect x="24" y="82" width="470" height="470" rx="10" fill="#ffffff" stroke="#e3d3c4"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="360" x2="470" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#lg2Arrow)"/>
  <line x1="130" y1="500" x2="130" y2="120" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#lg2Arrow)"/>
  <text x="462" y="380" font-size="12" fill="#64748b">x</text>
  <text x="106" y="126" font-size="12" fill="#64748b">y</text>
  <text x="100" y="380" font-size="12" fill="#64748b">O</text>

  <!-- a=2：递增，较陡；x→0+ 时 y→-∞，x=1 处过 0 -->
  <path d="M134 470 C 140 420, 150 392, 168 360 C 190 322, 214 292, 250 262"
        fill="none" stroke="#2563eb" stroke-width="2.6"/>

  <!-- a=10：递增，更平缓；同样过 (1,0) -->
  <path d="M134 430 C 144 402, 156 378, 168 360 C 186 334, 208 318, 250 302"
        fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-dasharray="7 4"/>

  <!-- a=1/2：递减；x→0+ 时 y→+∞，x=1 处过 0 -->
  <path d="M134 250 C 140 300, 150 328, 168 360 C 190 398, 214 428, 250 458"
        fill="none" stroke="#dc2626" stroke-width="2.6"/>

  <!-- a=1/10：递减，更平缓 -->
  <path d="M134 290 C 144 318, 156 342, 168 360 C 186 386, 208 402, 250 418"
        fill="none" stroke="#ea580c" stroke-width="2.6" stroke-dasharray="7 4"/>

  <!-- 定点 (1,0)：四条曲线共同交点 -->
  <circle cx="174.0" cy="360.0" r="6" fill="#f59e0b" stroke="#fff" stroke-width="2" class="pulse"/>
  <text x="150" y="400" font-size="12" fill="#b45309" font-weight="700">(1,0) 恒过</text>

  <!-- 图例 -->
  <g font-size="12.5">
    <rect x="300" y="120" width="180" height="104" rx="8" fill="#fffdf8" stroke="#e3d3c4"/>
    <line x1="312" y1="142" x2="344" y2="142" stroke="#2563eb" stroke-width="2.6"/>
    <text x="352" y="147" fill="#2563eb" font-weight="700">a = 2（较陡）</text>
    <line x1="312" y1="166" x2="344" y2="166" stroke="#7c3aed" stroke-width="2.6" stroke-dasharray="7 4"/>
    <text x="352" y="171" fill="#7c3aed" font-weight="700">a = 10（更平）</text>
    <line x1="312" y1="190" x2="344" y2="190" stroke="#dc2626" stroke-width="2.6"/>
    <text x="352" y="195" fill="#dc2626" font-weight="700">a = 1/2（递减）</text>
    <line x1="312" y1="214" x2="344" y2="214" stroke="#ea580c" stroke-width="2.6" stroke-dasharray="7 4"/>
    <text x="352" y="219" fill="#ea580c" font-weight="700">a = 1/10（更缓）</text>
  </g>

  <text x="44" y="520" font-size="12" fill="#475569">a&gt;1 时递增；0&lt;a&lt;1 时递减。a 与 1/a 的图像关于 x 轴对称。</text>

  <!-- 右侧要点 -->
  <rect x="510" y="82" width="266" height="470" rx="10" fill="#ffffff" stroke="#e3d3c4"/>
  <text x="530" y="112" font-size="15" fill="#7c2d12" font-weight="700">四条性质，考场直接调</text>

  <g font-size="12.5" fill="#334155">
    <text x="530" y="146" font-weight="700" fill="#1e3a8a">① 定义域与值域</text>
    <text x="530" y="168">定义域 x &gt; 0（真数必须为正）</text>
    <text x="530" y="188">值域 y ∈ R（对数能取遍实数）</text>

    <text x="530" y="224" font-weight="700" fill="#1e3a8a">② 过定点</text>
    <text x="530" y="246">恒过 (1, 0)，因为 logₐ1 = 0</text>
    <text x="530" y="266">a 取任何合法值都不变</text>

    <text x="530" y="302" font-weight="700" fill="#1e3a8a">③ 单调性</text>
    <text x="530" y="324">a &gt; 1 → 在 (0,+∞) 上递增</text>
    <text x="530" y="344">0 &lt; a &lt; 1 → 在 (0,+∞) 上递减</text>

    <text x="530" y="380" font-weight="700" fill="#1e3a8a">④ 对称</text>
    <text x="530" y="402">y=logₐx 与 y=log₁/ₐx</text>
    <text x="530" y="422">关于 x 轴对称</text>
  </g>

  <rect x="530" y="446" width="226" height="86" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="546" y="470" font-size="12" fill="#92400e" font-weight="700">⚠ 最容易错</text>
  <text x="546" y="492" font-size="11.5" fill="#92400e">看到 logₐx 先写 x&gt;0，</text>
  <text x="546" y="512" font-size="11.5" fill="#92400e">复合函数要把里层也解出来。</text>
  <text x="546" y="528" font-size="11" fill="#a16207">（本站「难点剖析」有专门 3 个坑）</text>
</svg>

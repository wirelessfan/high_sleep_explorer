<text x="486" y="158" fill="#059669" font-size="12" font-weight="700">等势面</text>
<text x="486" y="245" fill="#059669" font-size="12" font-weight="700">等势面</text>
<text x="300" y="205" fill="#d97706" font-size="12" font-weight="700" text-anchor="middle">E 处处相同（匀强）</text>
<text x="300" y="285" fill="#1d4ed8" font-size="12.5" font-weight="700" text-anchor="middle">E = U/d（d 为两板间距离）</text>
<rect x="30" y="372" width="580" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe">

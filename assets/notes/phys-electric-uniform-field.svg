<text x="320" y="390" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">等势面与电场线处处垂直；沿电场线方向电势逐渐降低</text>
<rect x="20" y="410" width="600" height="21" rx="5" fill="#eff6ff" stroke="#bfdbfe">

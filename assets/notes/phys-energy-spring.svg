<title id="title">弹簧系统 · 压缩状态与机械能</title>
<desc id="desc">同一相位驱动 x、v、F、Ek、Ep；Ek + Ep = E，零能量对应零柱长。。动画与静态图使用相同物理模型；减少动态效果时显示静态示意。</desc>

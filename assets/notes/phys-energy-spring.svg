<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- 稿纸网格 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <!-- 胶带质感 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fdfcf7" filter="url(#shadow)"/>
  <rect width="640" height="380" rx="14" fill="url(#grid)"/>

  <!-- 顶部顶部便签胶带 -->
  <rect x="220" y="8" width="200" height="26" fill="rgba(251, 191, 36, 0.45)" rx="3" transform="rotate(-1 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1">
    ★ 状元错题本 · 弹簧系统能量拆解
  </text>

  <!-- 左侧：草稿手绘图 -->
  <g transform="translate(30, 55)">
    <!-- 边框 -->
    <rect width="260" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#9a3412">
      【考场草稿速画】受力与形变
    </text>

    <!-- 挡板与地面 -->
    <line x1="25" y1="210" x2="235" y2="210" stroke="#78716c" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="120" x2="35" y2="210" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
    <!-- 斜剖面线 -->
    <path d="M25 210 L15 220 M45 210 L35 220 M65 210 L55 220 M85 210 L75 220 M105 210 L95 220 M125 210 L115 220 M145 210 L135 220 M165 210 L155 220 M185 210 L175 220 M205 210 L195 220" stroke="#a8a29e" stroke-width="1.5"/>

    <!-- 弹簧 (手绘波浪形) -->
    <path d="M 35 175 Q 45 160, 55 175 T 75 175 T 95 175 T 115 175 T 135 175" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <!-- 滑块 -->
    <rect x="135" y="145" width="55" height="65" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="162" y="182" font-family="sans-serif" font-size="16" font-weight="900" fill="#92400e" text-anchor="middle">m</text>

    <!-- 力矢量标注 (手写箭头) -->
    <!-- 弹簧弹力 F弹 -->
    <line x1="135" y1="175" x2="190" y2="175" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M 190 171 L 198 175 L 190 179 Z" fill="#dc2626"/>
    <text x="185" y="165" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">F弹</text>

    <!-- 重力与支持力 -->
    <line x1="162" y1="180" x2="162" y2="235" stroke="#475569" stroke-width="2"/>
    <path d="M 158 233 L 162 240 L 166 233 Z" fill="#475569"/>
    <text x="168" y="235" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#475569">G=mg</text>

    <!-- 弹簧压缩量 x 标注 -->
    <line x1="75" y1="130" x2="135" y2="130" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="105" y="125" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">压缩量 Δx</text>

    <!-- 底部红笔圈批注 -->
    <rect x="15" y="248" width="230" height="34" rx="6" fill="#fef2f2" stroke="#f87171" stroke-dasharray="4,3"/>
    <text x="130" y="270" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">
      红笔批注：光滑面上 W弹 = -ΔEp弹
    </text>
  </g>

  <!-- 右侧：状元核心笔记 -->
  <g transform="translate(310, 55)">
    <!-- 边框纸卡 -->
    <rect width="300" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="18" y="28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="900" fill="#1e293b">
      【破题秘籍 · 两个研究对象】
    </text>

    <!-- 第1条 -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="88" height="20" rx="4" fill="#fee2e2"/>
      <text x="44" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">对象① 只有滑块</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155" line-height="1.5">
        弹力 F弹 是<tspan fill="#dc2626" font-weight="800">外力</tspan>，外力做功改变机械能。
      </text>
      <text x="0" y="56" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#dc2626">
        👉 结论：单个滑块的机械能【不守恒】！
      </text>
    </g>

    <line x1="18" y1="125" x2="282" y2="125" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 第2条 -->
    <g transform="translate(18, 138)">
      <rect x="0" y="0" width="105" height="20" rx="4" fill="#dcfce7"/>
      <text x="52" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#166534" text-anchor="middle">对象② 滑块+弹簧系统</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        弹力是<tspan fill="#16a34a" font-weight="800">系统内力</tspan>，动能与弹性势能互换。
      </text>
      <text x="0" y="56" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#15803d">
        👉 结论：系统总机械能【严格守恒】！
      </text>
    </g>

    <!-- 底部公式高亮黄底 -->
    <g transform="translate(18, 222)">
      <rect x="0" y="0" width="264" height="54" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
      <text x="132" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#854d0e" text-anchor="middle">
        黄金方程：ΔEk + ΔEp重 + ΔEp弹 = 0
      </text>
      <text x="132" y="44" font-family="'PingFang SC',sans-serif" font-size="11" fill="#a16207" text-anchor="middle">
        （动能增加了多少，势能总和就必须减少多少）
      </text>
    </g>
  </g>
</svg>

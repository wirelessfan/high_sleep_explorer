<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" role="img" aria-labelledby="title description">
  <title id="title">离子方程式：写、拆、删、查</title>
  <desc id="description">石灰石与稀盐酸反应；四行完整保留，左侧指示条按顺序推进。。最终式：Ca、C、O、H 原子分别守恒；等号两边总电荷均为 +2。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="470" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">离子方程式：写、拆、删、查</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">石灰石与稀盐酸反应；四行完整保留，左侧指示条按顺序推进。</text>
  <g>
<rect x="24" y="86" width="752" height="69" rx="10" fill="#fff" stroke="#cbdcd5"/>
<text x="42" y="110" font-size="17" fill="#047857" text-anchor="start" font-weight="700">① 写：配平化学方程式</text>
<text x="42" y="137" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑</text>
<g class="motion">
<rect x="24" y="86" width="5" height="69" fill="#047857">
<animate attributeName="opacity" values="1;0.08;0.08;0.08;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
</g>
</g>
<g>
<rect x="24" y="164" width="752" height="69" rx="10" fill="#fff" stroke="#cbdcd5"/>
<text x="42" y="188" font-size="17" fill="#047857" text-anchor="start" font-weight="700">② 拆：只拆溶液中易溶强电解质</text>
<text x="42" y="215" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">CaCO₃ + 2H⁺ + 2Cl⁻ = Ca²⁺ + 2Cl⁻ + H₂O + CO₂↑</text>
<g class="motion">
<rect x="24" y="164" width="5" height="69" fill="#047857">
<animate attributeName="opacity" values="0.08;1;0.08;0.08;0.08" keyTimes="0;0.25;0.5;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
</g>
</g>
<g>
<rect x="24" y="242" width="752" height="69" rx="10" fill="#fff" stroke="#cbdcd5"/>
<text x="42" y="266" font-size="17" fill="#047857" text-anchor="start" font-weight="700">③ 删：删除两侧相同旁观离子</text>
<text x="42" y="293" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">两侧各删去 2Cl⁻，CaCO₃ 固体保留</text>
<g class="motion">
<rect x="24" y="242" width="5" height="69" fill="#047857">
<animate attributeName="opacity" values="0.08;0.08;1;0.08;0.08" keyTimes="0;0.25;0.5;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
</g>
</g>
<g>
<rect x="24" y="320" width="752" height="69" rx="10" fill="#fff" stroke="#cbdcd5"/>
<text x="42" y="344" font-size="17" fill="#047857" text-anchor="start" font-weight="700">④ 查：原子守恒、电荷守恒</text>
<text x="42" y="371" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">CaCO₃ + 2H⁺ = Ca²⁺ + H₂O + CO₂↑</text>
<g class="motion">
<rect x="24" y="320" width="5" height="69" fill="#047857">
<animate attributeName="opacity" values="0.08;0.08;0.08;1;0.08" keyTimes="0;0.25;0.5;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
</g>
</g>
  <rect x="24" y="408" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="428" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">最终式：Ca、C、O、H 原子分别守恒；等号两边总电荷均为 +2。</text>
</svg>

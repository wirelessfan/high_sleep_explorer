<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridIonAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowIonAnim" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 8 秒写拆删查四步流程动画 */
      /* Step 1: 写化学方程式 (0% 呈现) */
      @keyframes stage1Write {
        0%, 5% { opacity: 0; transform: translateY(-5px); }
        10%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }
      /* Step 2: 拆强电解质 (25% 展开) */
      @keyframes stage2Split {
        0%, 20% { opacity: 0; transform: scale(0.96); }
        25%, 95% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; }
      }
      /* Step 3: 删旁观离子 (划掉 2Cl-) (50% 划线) */
      @keyframes stage3DeleteLine {
        0%, 46% { width: 0; opacity: 0; }
        52%, 95% { width: 48px; opacity: 1; }
        100% { width: 0; opacity: 0; }
      }
      /* Step 4: 查守恒得到净离子方程式 (75% 最终高光) */
      @keyframes stage4Final {
        0%, 71% { opacity: 0; transform: translateY(8px); }
        76%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }

      /* 联动步骤卡高亮 */
      @keyframes cardI1 {
        0%, 23% { background-color: #fee2e2; border-color: #ef4444; }
        24%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes cardI2 {
        0%, 23% { background-color: #ffffff; border-color: #e2e8f0; }
        24%, 48% { background-color: #eff6ff; border-color: #3b82f6; }
        49%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes cardI3 {
        0%, 48% { background-color: #ffffff; border-color: #e2e8f0; }
        49%, 73% { background-color: #fef2f2; border-color: #dc2626; }
        74%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      @keyframes cardI4 {
        0%, 73% { background-color: #ffffff; border-color: #e2e8f0; }
        74%, 97% { background-color: #dcfce7; border-color: #16a34a; }
        98%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }

      .anim-stage1 { animation: stage1Write 8s infinite; }
      .anim-stage2 { animation: stage2Split 8s infinite; }
      .anim-strike { animation: stage3DeleteLine 8s ease-in-out infinite; }
      .anim-stage4 { animation: stage4Final 8s infinite; }

      .card-i1 { animation: cardI1 8s infinite; }
      .card-i2 { animation: cardI2 8s infinite; }
      .card-i3 { animation: cardI3 8s infinite; }
      .card-i4 { animation: cardI4 8s infinite; }
    </style>
  </defs>

  <rect width="640" height="380" rx="14" fill="#fafdfb" filter="url(#shadowIonAnim)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridIonAnim)"/>

  <!-- 顶部胶带 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(14, 165, 233, 0.28)" rx="3" transform="rotate(0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">
    ⚡ 动态拆解 · 离子方程式「写拆删查」四步演练
  </text>

  <!-- 左侧：演练实况区 -->
  <g transform="translate(30, 50)">
    <rect width="280" height="300" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>

    <text x="16" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#0284c7">
      【案例实况】石灰石与稀盐酸反应
    </text>

    <!-- 演练框 1: 写化学式 -->
    <g class="anim-stage1" transform="translate(14, 40)">
      <rect width="252" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="16" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#64748b">① 写 (完整化学式):</text>
      <text x="10" y="30" font-family="'Courier New',sans-serif" font-size="11" font-weight="700" fill="#0f172a">CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑</text>
    </g>

    <!-- 演练框 2: 拆可溶电解质 (难溶物气体不拆) -->
    <g class="anim-stage2" transform="translate(14, 88)">
      <rect width="252" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="10" y="16" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#1d4ed8">② 拆 (强酸强碱可溶盐拆，沉淀气体水不拆):</text>
      <text x="10" y="32" font-family="'Courier New',sans-serif" font-size="11" font-weight="800" fill="#0284c7">CaCO₃ + 2H⁺ + 2Cl⁻</text>
      <text x="10" y="46" font-family="'Courier New',sans-serif" font-size="11" font-weight="800" fill="#0284c7">= Ca²⁺ + 2Cl⁻ + H₂O + CO₂↑</text>
    </g>

    <!-- 演练框 3: 删旁观离子 (划掉两边 2Cl-) -->
    <g class="anim-stage2" transform="translate(14, 150)">
      <rect width="252" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="10" y="16" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#991b1b">③ 删 (划掉两边不反应的 2Cl⁻):</text>
      <text x="10" y="32" font-family="'Courier New',sans-serif" font-size="11" fill="#334155">CaCO₃ + 2H⁺ + <tspan fill="#dc2626" font-weight="bold">2Cl⁻</tspan></text>
      <!-- 删除线 1 -->
      <line class="anim-strike" x1="128" y1="28" x2="165" y2="28" stroke="#dc2626" stroke-width="2.2"/>

      <text x="10" y="46" font-family="'Courier New',sans-serif" font-size="11" fill="#334155">= Ca²⁺ + <tspan fill="#dc2626" font-weight="bold">2Cl⁻</tspan> + H₂O + CO₂↑</text>
      <!-- 删除线 2 -->
      <line class="anim-strike" x1="72" y1="42" x2="110" y2="42" stroke="#dc2626" stroke-width="2.2"/>
    </g>

    <!-- 演练框 4: 查守恒·净离子反应式 -->
    <g class="anim-stage4" transform="translate(14, 212)">
      <rect width="252" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
      <text x="10" y="16" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#15803d">④ 查 (净离子式 · 原子+电荷双守恒):</text>
      <text x="10" y="36" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#166534">CaCO₃ + 2H⁺ = Ca²⁺ + H₂O + CO₂↑</text>
    </g>

    <!-- 底部口诀 -->
    <rect x="15" y="270" width="250" height="20" rx="4" fill="#fff7ed"/>
    <text x="140" y="284" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#c2410c" text-anchor="middle">
      拆分铁律：沉淀、弱电解质、气体绝不拆！
    </text>
  </g>

  <!-- 右侧：四步法指示卡 -->
  <g transform="translate(325, 50)">
    <rect width="285" height="300" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>

    <text x="18" y="26" font-family="'PingFang SC',sans-serif" font-size="13.5" font-weight="900" fill="#0369a1">
      【离子方程式规范书写原则】
    </text>

    <!-- 步骤 1 -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-i1"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#dc2626">① 写：客观事实</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">写出配平的正确化学方程式</text>
    </g>

    <!-- 步骤 2 -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-i2"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#2563eb">② 拆：易溶易电离</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">强酸/强碱/可溶盐拆；沉淀/水/气体保留</text>
    </g>

    <!-- 步骤 3 -->
    <g transform="translate(16, 154)">
      <rect x="0" y="0" width="253" height="48" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-i3"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#991b1b">③ 删：旁观离子</text>
      <text x="12" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">删去两边未参加反应的相同离子</text>
    </g>

    <!-- 步骤 4 -->
    <g transform="translate(16, 212)">
      <rect x="0" y="0" width="253" height="52" rx="6" stroke="#e2e8f0" stroke-width="1.5" class="card-i4"/>
      <text x="12" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#15803d">④ 查：两查两核验</text>
      <text x="12" y="36" font-family="'PingFang SC',sans-serif" font-size="11" fill="#475569">一查质量（原子）守恒，二查电荷总数守恒！</text>
    </g>

    <!-- 底部状元总结 -->
    <text x="142" y="286" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">
      ★ 高频失分点：电荷不守恒、微溶物澄清石灰水乱拆！
    </text>
  </g>
</svg>

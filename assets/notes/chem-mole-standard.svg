<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="100%" role="img" aria-labelledby="title description">
  <title id="title">气体摩尔体积的两个前提</title>
  <desc id="description">标准状况与气体状态缺一不可，这是 NA 判断题最常见的陷阱。。液体、固体不适用；非标准状况下即使气体也不能直接代入 22.4。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="660" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">气体摩尔体积的两个前提</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">标准状况与气体状态缺一不可，这是 NA 判断题最常见的陷阱。</text>
  <rect x="24" y="82" width="752" height="150" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="40" y="112" font-size="17" fill="#047857" text-anchor="start" font-weight="700">判断能不能用 22.4 L/mol，按顺序过两道关</text>
<rect x="40" y="128" width="200" height="86" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="140" y="154" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">① 条件是不是标准状况</text>
<text x="140" y="178" font-size="12" fill="#50647a" text-anchor="middle" font-weight="500">0 ℃、101 kPa</text>
<text x="254" y="178" font-size="18" fill="#50647a" text-anchor="middle" font-weight="700">→</text>
<rect x="300" y="128" width="200" height="86" rx="10" fill="#ffffff" stroke="#b45309"/>
<text x="400" y="154" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">② 物质是不是气体</text>
<text x="400" y="178" font-size="12" fill="#50647a" text-anchor="middle" font-weight="500">水、苯、酒精在标况下是液体</text>
<text x="514" y="178" font-size="18" fill="#50647a" text-anchor="middle" font-weight="700">→</text>
<rect x="560" y="128" width="200" height="86" rx="10" fill="#ffffff" stroke="#047857"/>
<text x="660" y="154" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">两关都过才成立</text>
<text x="660" y="178" font-size="12" fill="#50647a" text-anchor="middle" font-weight="500">Vₘ ≈ 22.4 L/mol</text>
<rect x="24" y="258" width="752" height="82" rx="10" fill="#ffffff" stroke="#86efac"/>
<text x="44" y="286" font-size="16" fill="#047857" text-anchor="start" font-weight="700">✓ 标况下 11.2 L O₂</text>
<text x="44" y="310" font-size="14" fill="#50647a" text-anchor="start" font-weight="500">0 ℃、101 kPa，氧气是气体</text>
<text x="44" y="332" font-size="14" fill="#172b42" text-anchor="start" font-weight="500">n = 11.2 / 22.4 = 0.5 mol</text>
<text x="736" y="290" font-size="14" fill="#047857" text-anchor="end" font-weight="700">可用</text>
<rect x="24" y="354" width="752" height="82" rx="10" fill="#ffffff" stroke="#dc2626"/>
<text x="44" y="382" font-size="16" fill="#dc2626" text-anchor="start" font-weight="700">✗ 标况下 11.2 L H₂O</text>
<text x="44" y="406" font-size="14" fill="#50647a" text-anchor="start" font-weight="500">标况下水是液体，不能用气体摩尔体积</text>
<text x="44" y="428" font-size="14" fill="#172b42" text-anchor="start" font-weight="500">应改用 n = m / M</text>
<text x="736" y="386" font-size="14" fill="#dc2626" text-anchor="end" font-weight="700">不可用</text>
<rect x="24" y="450" width="752" height="82" rx="10" fill="#ffffff" stroke="#dc2626"/>
<text x="44" y="478" font-size="16" fill="#dc2626" text-anchor="start" font-weight="700">✗ 常温常压 11.2 L O₂</text>
<text x="44" y="502" font-size="14" fill="#50647a" text-anchor="start" font-weight="500">不是标况，Vₘ 不是 22.4 L/mol</text>
<text x="44" y="524" font-size="14" fill="#172b42" text-anchor="start" font-weight="500">Vₘ 约 24.5 L/mol，n ≈ 0.46 mol</text>
<text x="736" y="482" font-size="14" fill="#dc2626" text-anchor="end" font-weight="700">不可用</text>
<text x="24" y="590" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700">口诀：先看条件，再看物态；22.4 只属于「标况 + 气体」。</text>
  <rect x="24" y="598" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="618" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">液体、固体不适用；非标准状况下即使气体也不能直接代入 22.4。</text>
</svg>

<text x="590" y="158" fill="#1d4ed8" font-size="15" font-weight="700">y = log₂x</text>
<circle cx="146" cy="360" r="4.5" fill="#0d9488"/>
<text x="154" y="352" fill="#0d9488" font-size="12" >(1, 0)</text>
<circle cx="182" cy="314" r="4.5" fill="#0d9488"/>
<text x="190" y="306" fill="#0d9488" font-size="12" >(2, 1)</text>
<circle cx="254" cy="268" r="4.5" fill="#0d9488"/>
<text x="262" y="260" fill="#0d9488" font-size="12" >(4, 2)</text>
<circle cx="398" cy="222" r="4.5" fill="#0d9488"/>
<text x="406" y="214" fill="#0d9488" font-size="12" >(8, 3)</text>
<circle cx="686" cy="176" r="4.5" fill="#0d9488"/>
<text x="694" y="168" fill="#0d9488" font-size="12" >(16, 4)</text>
<g class="motion">
<circle id="intro-moving-point" cx="146" cy="360" r="8" fill="#f59e0b" stroke="#fff" stroke-width="2">
      <animate attributeName="cx" values="146;182;254;398;686;146" keyTimes="0;.2;.4;.6;.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;314;268;222;176;360" keyTimes="0;.2;.4;.6;.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>

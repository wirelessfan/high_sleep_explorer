<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="100%" role="img" aria-labelledby="lgIntroTitle lgIntroDesc">
  <title id="lgIntroTitle">对数函数面面观：x 翻倍一次，log₂x 就加 1</title>
  <desc id="lgIntroDesc">上方是对数曲线 y=log₂x，下方是与它同步的「翻倍次数」刻度条。当 x 依次取 1、2、4、8、16，对数值依次是 0、1、2、3、4——每一次翻倍，对数只加 1。这就是对数把乘法变成加法的直观含义。</desc>
  <defs>
    <marker id="lgIArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
      /* 动点沿对数曲线滑动：x 从 1 到 16 */
      .walk { animation: walk 8s ease-in-out infinite; }
      @keyframes walk {
        0%, 8%   { transform: translate(0, 0); opacity: 1; }
        25%      { transform: translate(36px, -46px); }
        42%      { transform: translate(72px, -92px); }
        59%      { transform: translate(144px, -138px); }
        76%, 92% { transform: translate(216px, -184px); }
        100%     { transform: translate(0, 0); }
      }
      /* 下方的刻度条逐个点亮 */
      .tick1 { animation: lit 8s ease-in-out infinite; }
      .tick2 { animation: lit 8s ease-in-out infinite .9s; }
      .tick3 { animation: lit 8s ease-in-out infinite 1.8s; }
      .tick4 { animation: lit 8s ease-in-out infinite 2.7s; }
      .tick5 { animation: lit 8s ease-in-out infinite 3.6s; }
      @keyframes lit {
        0%, 10%   { opacity: .18; }
        22%, 88%  { opacity: 1; }
        100%      { opacity: .18; }
      }
      .glow { animation: glowPulse 3s ease-in-out infinite; }
      @keyframes glowPulse {
        0%, 100% { opacity: .25; }
        50%      { opacity: .65; }
      }
    </style>
  </defs>

  <rect width="800" height="780" rx="14" fill="#f7f9fd"/>
  <text x="30" y="35" font-size="23" fill="#1e3a8a" font-weight="800">对数：x 翻倍一次，log₂x 就加 1</text>
  <text x="30" y="62" font-size="15" fill="#50647a" font-weight="500">这是对数最本质的一句话 —— 它数的是「翻了几次倍」，所以把乘法变成了加法。</text>

  <!-- ============ 上半：对数曲线 ============ -->
  <rect x="24" y="82" width="752" height="330" rx="10" fill="#ffffff" stroke="#c7d2e8"/>
  <text x="44" y="110" font-size="17" fill="#1d4ed8" font-weight="700">y = log₂x 的图像</text>

  <!-- 坐标轴：原点 (110,360)，x 1单位=48px，y 1单位=46px -->
  <line x1="110" y1="360" x2="720" y2="360" stroke="#50647a" stroke-width="2" marker-end="url(#lgIArrow)"/>
  <line x1="110" y1="360" x2="110" y2="130" stroke="#50647a" stroke-width="2" marker-end="url(#lgIArrow)"/>
  <text x="710" y="382" font-size="14" fill="#172b42" font-weight="500">x</text>
  <text x="92" y="136" font-size="14" fill="#172b42" font-weight="500">y</text>
  <text x="98" y="378" font-size="13" fill="#50647a" font-weight="500">O</text>

  <!-- x 轴刻度 1,2,4,8,16 -->
  <g font-size="13" fill="#50647a" text-anchor="middle">
    <line x1="146" y1="355" x2="146" y2="365" stroke="#50647a" stroke-width="1.5"/>
    <text x="146" y="384">1</text>
    <line x1="182" y1="355" x2="182" y2="365" stroke="#50647a" stroke-width="1.5"/>
    <text x="182" y="384">2</text>
    <line x1="254" y1="355" x2="254" y2="365" stroke="#50647a" stroke-width="1.5"/>
    <text x="254" y="384">4</text>
    <line x1="398" y1="355" x2="398" y2="365" stroke="#50647a" stroke-width="1.5"/>
    <text x="398" y="384">8</text>
    <line x1="686" y1="355" x2="686" y2="365" stroke="#50647a" stroke-width="1.5"/>
    <text x="686" y="384">16</text>
  </g>

  <!-- y 轴刻度 1..4 -->
  <g font-size="13" fill="#50647a" text-anchor="end">
    <line x1="105" y1="314" x2="115" y2="314" stroke="#50647a" stroke-width="1.5"/>
    <text x="100" y="319">1</text>
    <line x1="105" y1="268" x2="115" y2="268" stroke="#50647a" stroke-width="1.5"/>
    <text x="100" y="273">2</text>
    <line x1="105" y1="222" x2="115" y2="222" stroke="#50647a" stroke-width="1.5"/>
    <text x="100" y="227">3</text>
    <line x1="105" y1="176" x2="115" y2="176" stroke="#50647a" stroke-width="1.5"/>
    <text x="100" y="181">4</text>
  </g>

  <!-- 对数曲线：逐点生成，x 从 0.55 到 18（对数坐标相对 x 压缩，呈现真实形状） -->
  <path d="M131.6 393.9 L142.0 367.7 L152.5 349.0 L162.9 334.4 L173.4 322.5 L183.8 312.4 L194.2 303.6 L204.7 295.8 L215.1 288.9 L225.6 282.6 L236.0 276.9 L246.4 271.6 L256.9 266.7 L267.3 262.1 L277.8 257.9 L288.2 253.9 L298.6 250.1 L309.1 246.5 L319.5 243.1 L330.0 239.9 L340.4 236.8 L350.8 233.9 L361.3 231.1 L371.7 228.4 L382.2 225.8 L392.6 223.3 L403.0 220.8 L413.5 218.5 L423.9 216.3 L434.4 214.1 L444.8 212.0 L455.2 210.0 L465.7 208.0 L476.1 206.1 L486.6 204.2 L497.0 202.4 L507.4 200.6 L517.9 198.9 L528.3 197.2 L538.8 195.6 L549.2 194.0 L559.6 192.4 L570.1 190.9 L580.5 189.4 L591.0 188.0 L601.4 186.5 L611.8 185.1 L622.3 183.8 L632.7 182.4 L643.2 181.1 L653.6 179.8 L664.0 178.6 L674.5 177.3 L684.9 176.1 L695.4 174.9 L705.8 173.8 L716.2 172.6 L726.7 171.5 L737.1 170.4 L747.6 169.3 L758.0 168.2"
        fill="none" stroke="#2563eb" stroke-width="3.2"/>
  <text x="590" y="158" font-size="15" fill="#1d4ed8" font-weight="700">y = log₂x</text>

  <!-- 五个关键点 -->
  <g>
    <circle cx="146" cy="360" r="5" fill="#0d9488"/>
    <text x="154" y="352" font-size="13" fill="#0f766e" font-weight="700">(1, 0)</text>

    <circle cx="182" cy="314" r="5" fill="#0d9488"/>
    <text x="190" y="306" font-size="13" fill="#0f766e" font-weight="700">(2, 1)</text>

    <circle cx="254" cy="268" r="5" fill="#0d9488"/>
    <text x="262" y="260" font-size="13" fill="#0f766e" font-weight="700">(4, 2)</text>

    <circle cx="398" cy="222" r="5" fill="#0d9488"/>
    <text x="406" y="214" font-size="13" fill="#0f766e" font-weight="700">(8, 3)</text>

    <circle cx="686" cy="176" r="5" fill="#0d9488"/>
    <text x="694" y="168" font-size="13" fill="#0f766e" font-weight="700">(16, 4)</text>
  </g>

  <!-- 动点（沿关键点跳跃） -->
  <g class="motion">
    <circle class="walk" cx="146" cy="360" r="9" fill="#f59e0b" opacity=".85"/>
  </g>
  <circle class="still" cx="350" cy="268" r="8" fill="#f59e0b" opacity=".85"/>

  <!-- 横向虚线，强调「翻倍 → +1」 -->
  <g stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 5" opacity=".28">
    <line x1="146" y1="360" x2="182" y2="314"/>
    <line x1="182" y1="314" x2="254" y2="268"/>
    <line x1="254" y1="268" x2="398" y2="222"/>
    <line x1="398" y1="222" x2="686" y2="176"/>
  </g>

  <text x="44" y="404" font-size="12.5" fill="#475569">x 每乘 2，y 就加 1 —— 图像上表现为「横跨一段、上升一格」的台阶感。</text>

  <!-- ============ 下半：翻倍次数刻度条 ============ -->
  <rect x="24" y="424" width="752" height="336" rx="10" fill="#ffffff" stroke="#c7d2e8"/>
  <text x="44" y="452" font-size="17" fill="#7c2d12" font-weight="700">换个说法：数一数「翻了几次倍」</text>
  <text x="44" y="474" font-size="13" fill="#50647a">把 1 不断乘 2，得到 2、4、8、16；对数就是记录你乘了几次。</text>

  <!-- 刻度条：5 格 -->
  <g>
    <!-- 格 1 -->
    <rect x="60" y="510" width="128" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" class="tick1"/>
    <text x="124" y="534" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">第 0 次</text>
    <text x="124" y="562" font-size="22" fill="#065f46" text-anchor="middle" font-weight="800">1</text>
    <text x="124" y="584" font-size="12" fill="#0f766e" text-anchor="middle">log₂1 = 0</text>

    <!-- 格 2 -->
    <rect x="202" y="510" width="128" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" class="tick2"/>
    <text x="266" y="534" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">第 1 次</text>
    <text x="266" y="562" font-size="22" fill="#065f46" text-anchor="middle" font-weight="800">2</text>
    <text x="266" y="584" font-size="12" fill="#0f766e" text-anchor="middle">log₂2 = 1</text>

    <!-- 格 3 -->
    <rect x="344" y="510" width="128" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" class="tick3"/>
    <text x="408" y="534" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">第 2 次</text>
    <text x="408" y="562" font-size="22" fill="#065f46" text-anchor="middle" font-weight="800">4</text>
    <text x="408" y="584" font-size="12" fill="#0f766e" text-anchor="middle">log₂4 = 2</text>

    <!-- 格 4 -->
    <rect x="486" y="510" width="128" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" class="tick4"/>
    <text x="550" y="534" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">第 3 次</text>
    <text x="550" y="562" font-size="22" fill="#065f46" text-anchor="middle" font-weight="800">8</text>
    <text x="550" y="584" font-size="12" fill="#0f766e" text-anchor="middle">log₂8 = 3</text>

    <!-- 格 5 -->
    <rect x="628" y="510" width="128" height="86" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2" class="tick5"/>
    <text x="692" y="534" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">第 4 次</text>
    <text x="692" y="562" font-size="22" fill="#9a3412" text-anchor="middle" font-weight="800">16</text>
    <text x="692" y="584" font-size="12" fill="#c2410c" text-anchor="middle">log₂16 = 4</text>
  </g>

  <!-- 箭头：每格之间 ×2 -->
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="195" y="560">×2 →</text>
    <text x="337" y="560">×2 →</text>
    <text x="479" y="560">×2 →</text>
    <text x="621" y="560">×2 →</text>
  </g>

  <!-- 结论条 -->
  <rect x="60" y="620" width="696" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="408" y="644" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">乘法（×2 一次又一次）  ←→  加法（对数 +1 一格一格）</text>
  <text x="408" y="666" font-size="12.5" fill="#3b5b7a" text-anchor="middle">这就是对数存在的理由：它把「翻倍」这种乘法过程，翻译成了「加了几」这种加法过程。</text>

  <!-- 三条提醒 -->
  <g font-size="12" fill="#7c2d12">
    <text x="60" y="704">① 真数必须 &gt; 0：图上 x 只能取正半轴，这是硬约束。</text>
    <text x="60" y="726">② 恒过 (1, 0)：不管底数换成几，logₐ1 永远等于 0。</text>
    <text x="60" y="748">③ 底数决定方向：a &gt; 1 递增，0 &lt; a &lt; 1 递减（把曲线上下翻）。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">导数：割线逼近切线</title>
  <desc id="description">固定 P，移动 Q；曲线、割线、切线由同一函数计算。。数学坐标的斜率为正；SVG 纵坐标向下，因此屏幕斜率符号相反。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">导数：割线逼近切线</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">固定 P，移动 Q；曲线、割线、切线由同一函数计算。</text>
  <rect x="24" y="82" width="752" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<line x1="65" y1="327" x2="470" y2="327" stroke="#50647a" stroke-width="2"/>
<line x1="65" y1="327" x2="65" y2="103" stroke="#50647a" stroke-width="2"/>
<text x="465" y="349" font-size="15" fill="#172b42" text-anchor="start" font-weight="500">x</text>
<text x="50" y="108" font-size="15" fill="#172b42" text-anchor="start" font-weight="500">y</text>
<path d="M 80 295.1 Q 270 137.4 460 88" fill="none" stroke="#2563eb" stroke-width="3" />
<text x="390" y="121" font-size="16" fill="#2563eb" text-anchor="start" font-weight="500">y = f(x)</text>
<line x1="125" y1="252.5" x2="400" y2="82" stroke="#dc2626" stroke-width="2.8"/>
<text x="132" y="286" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">切线 T</text>
<circle cx="220" cy="193.6" r="5.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="200" y="181.6" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">P</text>
<line x1="220" y1="193.6" x2="220" y2="327" stroke="#9aafbd" stroke-width="1" stroke-dasharray="4 4"/>
<text x="220" y="352" font-size="16" fill="#50647a" text-anchor="middle" font-weight="500">x₀</text>
<line x1="100" y1="256.3" x2="440" y2="78.65" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="350" cy="125.675" r="6" fill="#b45309" stroke="white" stroke-width="1.5"/>
<text x="358" y="114.675" font-size="16" fill="#b45309" text-anchor="start" font-weight="500">Q</text>
<rect x="493" y="117" width="260" height="222" rx="10" fill="#fff9e7" stroke="#ead8a2"/>
<text x="508" y="147" font-size="16" fill="#b45309" text-anchor="start" font-weight="500">割线始终通过 P、Q</text>
<text x="508" y="184" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">kPQ = Δy / Δx</text>
<text x="508" y="221" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">Δx → 0 时</text>
<text x="508" y="252" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">kPQ → f′(x₀)</text>
<text x="508" y="290" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">Q 沿函数曲线靠近 P</text>
<text x="508" y="319" font-size="16" fill="#50647a" text-anchor="start" font-weight="500">极限不等于取 Δx = 0</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">数学坐标的斜率为正；SVG 纵坐标向下，因此屏幕斜率符号相反。</text>
</svg>

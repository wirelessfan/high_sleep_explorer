<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridMath" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#fef3c7" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowMath" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fffdfa" filter="url(#shadowMath)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridMath)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(245, 158, 11, 0.28)" rx="3" transform="rotate(-0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#92400e" text-anchor="middle" letter-spacing="1">
    ★ 导数几何直观 · 割线逼近切线的极限过程
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>

    <!-- 坐标系 -->
    <line x1="50" y1="205" x2="50" y2="35" stroke="#64748b" stroke-width="2"/>
    <path d="M 47 40 L 50 30 L 53 40 Z" fill="#64748b"/>
    <text x="35" y="42" font-family="sans-serif" font-size="13" font-weight="800" fill="#334155">y</text>

    <line x1="50" y1="205" x2="510" y2="205" stroke="#64748b" stroke-width="2"/>
    <path d="M 505 202 L 515 205 L 505 208 Z" fill="#64748b"/>
    <text x="515" y="210" font-family="sans-serif" font-size="13" font-weight="800" fill="#334155">x</text>

    <!-- 函数曲线 y = f(x) (抛物线平滑曲线) -->
    <path d="M 60 190 Q 200 170, 320 100 T 480 30" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="470" y="25" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#2563eb">y = f(x)</text>

    <!-- 固定切点 P(x₀, f(x₀)) -->
    <circle cx="200" cy="155" r="5" fill="#dc2626"/>
    <text x="190" y="145" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#dc2626">P(x₀, y₀)</text>
    <line x1="200" y1="155" x2="200" y2="205" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="200" y="220" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">x₀</text>

    <!-- 邻近点 Q(x₀+Δx, y₀+Δy) -->
    <circle cx="340" cy="90" r="5" fill="#f59e0b"/>
    <text x="350" y="90" font-family="'Courier New',sans-serif" font-size="12" font-weight="800" fill="#d97706">Q(x₀+Δx, y₀+Δy)</text>
    <line x1="340" y1="90" x2="340" y2="205" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="340" y="220" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">x₀ + Δx</text>

    <!-- 割线 PQ (虚线) -->
    <line x1="130" y1="185" x2="410" y2="60" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="390" y="60" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#d97706">割线 PQ (平均变化率)</text>

    <!-- 极限切线 (红色实线，点 P 处的切线) -->
    <line x1="100" y1="205" x2="330" y2="90" stroke="#dc2626" stroke-width="2.5"/>
    <text x="110" y="195" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#dc2626">切线 T (瞬时变化率)</text>

    <!-- 逼近箭头 Q -> P -->
    <path d="M 320 100 C 270 120, 230 140, 215 150" fill="none" stroke="#ef4444" stroke-width="1.8"/>
    <path d="M 221 143 L 213 151 L 223 152 Z" fill="#ef4444"/>
    <text x="270" y="140" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">Δx → 0 (极限逼近)</text>

    <!-- 右侧核心公式卡片 -->
    <g transform="translate(370, 110)">
      <rect width="175" height="85" rx="6" fill="#fef9c3" stroke="#fde047"/>
      <text x="87" y="22" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#854d0e" text-anchor="middle">★ 导数的几何意义</text>
      <text x="87" y="44" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#713f12" text-anchor="middle">k = f′(x₀) = tanα</text>
      <text x="87" y="62" font-family="'Courier New',sans-serif" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">切线方程：</text>
      <text x="87" y="76" font-family="'Courier New',sans-serif" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">y − y₀ = f′(x₀)(x − x₀)</text>
    </g>
  </g>
</svg>

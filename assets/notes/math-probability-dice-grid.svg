<text x="90" y="516" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">横：第一枚骰子　纵：第二枚骰子　格中数字 = 点数之和</text>
<text x="90" y="542" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">黄色对角线：和为 7，共 6 格 → P = 6/36 = 1/6</text>
<rect x="514" y="82" width="262" height="430" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="534" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">为什么画网格</text>
<text x="534" y="146" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">① 36 个样本点一目了然，不会漏数</text>
<text x="534" y="176" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">② 任意事件的概率 = 数格子 ÷ 36</text>
<text x="534" y="206" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">③ 和为 7 的组合最多（6 种），所以最常见</text>
<text x="534" y="236" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">④ 和为 2 或 12 只有 1 种，最罕见</text>
<text x="534" y="282" font-size="15" fill="#047857" text-anchor="start" font-weight="700">其他事件的用法</text>
<text x="534" y="312" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">• 和为偶数：对角线一半，18 格 → 1/2</text>
<text x="534" y="340" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">• 第一枚为 6：整行 6 格 → 1/6</text>
<text x="534" y="368" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">• 至少一个 6：36 − 25 = 11 格 → 11/36</text>
<text x="534" y="428" font-size="12" fill="#dc2626" text-anchor="start" font-weight="500">数格子之前，先确认两枚骰子互相独立</text>

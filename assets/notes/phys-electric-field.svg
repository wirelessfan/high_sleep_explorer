<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridEF" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowEF" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fdfbf7" filter="url(#shadowEF)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridEF)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(14, 165, 233, 0.25)" rx="3" transform="rotate(-0.3 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">
    ★ 静电场全景 · 电场线与等势面分布规律
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 等量异种点电荷示意 -->
    <g transform="translate(40, 20)">
      <!-- 正电荷 -->
      <circle cx="80" cy="80" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <text x="80" y="86" font-family="sans-serif" font-size="18" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>
      <text x="80" y="112" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">+Q (高电势)</text>

      <!-- 负电荷 -->
      <circle cx="280" cy="80" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="280" y="86" font-family="sans-serif" font-size="18" font-weight="900" fill="#2563eb" text-anchor="middle">−</text>
      <text x="280" y="112" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">−Q (低电势)</text>

      <!-- 电场线 (带箭头实线) -->
      <!-- 直线连接 -->
      <line x1="96" y1="80" x2="264" y2="80" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 185 76 L 195 80 L 185 84 Z" fill="#f59e0b"/>

      <!-- 上弧线 1 -->
      <path d="M 88 66 C 130 15, 230 15, 272 66" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
      <path d="M 175 25 L 185 27 L 178 33 Z" fill="#f59e0b"/>

      <!-- 下弧线 1 -->
      <path d="M 88 94 C 130 145, 230 145, 272 94" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
      <path d="M 175 133 L 185 131 L 178 125 Z" fill="#f59e0b"/>

      <!-- 等势面虚线 (中垂面为零势面) -->
      <line x1="180" y1="20" x2="180" y2="140" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="180" y="15" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#047857" text-anchor="middle">中垂面 (φ = 0)</text>
    </g>

    <!-- 右侧法则卡片 -->
    <g transform="translate(390, 20)">
      <rect width="150" height="185" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="75" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#166534" text-anchor="middle">★ 四大判断铁律</text>

      <text x="10" y="50" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#14532d">① 始于正，终于负</text>
      <text x="10" y="66" font-family="'PingFang SC',sans-serif" font-size="10" fill="#475569">（电场线不闭合不相交）</text>

      <text x="10" y="90" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#14532d">② 密则强，疏则弱</text>
      <text x="10" y="106" font-family="'PingFang SC',sans-serif" font-size="10" fill="#475569">（线密度代表场强 E）</text>

      <text x="10" y="130" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#14532d">③ 顺线电势降</text>
      <text x="10" y="146" font-family="'PingFang SC',sans-serif" font-size="10" fill="#475569">（沿电场线方向 φ 越来越低）</text>

      <text x="10" y="170" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#b91c1c">④ 场线 ⊥ 等势面</text>
    </g>

    <!-- 底部口诀便签 -->
    <rect x="25" y="215" width="510" height="22" rx="4" fill="#eff6ff"/>
    <text x="280" y="230" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">
      口诀：电场线指向电势降落最快的方向，垂直等势面且由高电势指向低电势！
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridElecDeflect" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowElecDeflect" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 粒子在平行板偏转电场中飞行并向下偏转 */
      @keyframes particleFly {
        0% { transform: translate(45px, 120px); opacity: 0; }
        15% { opacity: 1; }
        40% { transform: translate(110px, 122px); }
        70% { transform: translate(210px, 145px); }
        90% { transform: translate(300px, 185px); opacity: 1; }
        100% { transform: translate(320px, 195px); opacity: 0; }
      }
      /* 呼吸光斑 */
      @keyframes pulseElec {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      .anim-particle {
        animation: particleFly 2.6s linear infinite;
      }
      .pulse-tag-elec {
        animation: pulseElec 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="320" rx="14" fill="#fdfbf7" filter="url(#shadowElecDeflect)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridElecDeflect)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(14, 165, 233, 0.28)" rx="3" transform="rotate(-0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">
    ⚡ 动态模拟 · 带电粒子在偏转电场中的轨迹
  </text>

  <!-- 左侧：动态偏转模拟区 -->
  <g transform="translate(35, 50)">
    <rect width="320" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 状态指示 -->
    <circle cx="25" cy="22" r="5" fill="#0284c7" class="pulse-tag-elec"/>
    <text x="36" y="26" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">
      正电荷粒子连续偏转飞行实况
    </text>

    <!-- 上极板 (带正电) -->
    <rect x="100" y="70" width="160" height="10" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="65" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">+ + + + + + + (正极板)</text>

    <!-- 下极板 (带负电) -->
    <rect x="100" y="170" width="160" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="195" font-family="sans-serif" font-size="11" font-weight="900" fill="#2563eb" text-anchor="middle">− − − − − − − (负极板)</text>

    <!-- 匀强电场线 (竖直向下，橙色虚线) -->
    <line x1="130" y1="82" x2="130" y2="168" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="180" y1="82" x2="180" y2="168" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="230" y1="82" x2="230" y2="168" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="245" y="125" font-family="sans-serif" font-size="11" font-weight="900" fill="#d97706">E</text>

    <!-- 类平抛轨迹参考虚线 -->
    <path d="M 100 120 Q 210 120, 260 165 T 310 205" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- 动态飞行粒子 (连续发光正电荷) -->
    <g class="anim-particle">
      <circle cx="0" cy="0" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <text x="0" y="3" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">+</text>
      <!-- 速度箭头 -->
      <line x1="6" y1="0" x2="16" y2="4" stroke="#dc2626" stroke-width="1.8"/>
    </g>

    <!-- 侧移量 y 标注 -->
    <line x1="265" y1="120" x2="265" y2="165" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="272" y="145" font-family="sans-serif" font-size="11" font-weight="900" fill="#7c3aed">侧移 y</text>

    <!-- 极板长 L 与板间距 d -->
    <text x="180" y="145" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">板长 L，间距 d</text>

    <!-- 底部便利贴 -->
    <rect x="15" y="212" width="290" height="22" rx="4" fill="#eff6ff"/>
    <text x="160" y="227" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      类平抛运动：水平匀速 (L = v₀t)，竖直匀加速 (y = ½at²)
    </text>
  </g>

  <!-- 右侧：高考秒杀偏转公式卡 -->
  <g transform="translate(370, 50)">
    <rect width="240" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <text x="18" y="26" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#0f172a">
      【带电粒子偏转核心公式】
    </text>

    <!-- 加速度 -->
    <g transform="translate(18, 42)">
      <text x="0" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#475569">① 竖直加速度 a：</text>
      <text x="0" y="34" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#dc2626">a = qE/m = qU / (md)</text>
    </g>

    <line x1="18" y1="88" x2="222" y2="88" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 侧移量 y -->
    <g transform="translate(18, 98)">
      <text x="0" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#475569">② 飞出电场侧移量 y：</text>
      <text x="0" y="34" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#2563eb">y = ½at² = qUL² / (2mdv₀²)</text>
    </g>

    <line x1="18" y1="144" x2="222" y2="144" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 偏转角 tanθ -->
    <g transform="translate(18, 154)">
      <text x="0" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#475569">③ 偏转角 tanθ：</text>
      <text x="0" y="34" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#059669">tanθ = vy / v₀ = qUL / (mdv₀²)</text>
    </g>

    <!-- 底部秒杀口诀 -->
    <g transform="translate(18, 198)">
      <rect x="0" y="0" width="204" height="34" rx="5" fill="#fef9c3" stroke="#facc15"/>
      <text x="102" y="21" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#854d0e" text-anchor="middle">
        反向延长线必过水平位移中点 L/2！
      </text>
    </g>
  </g>
</svg>

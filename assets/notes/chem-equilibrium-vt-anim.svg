<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridEqAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowEqAnim" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 扫描线动画：模拟示波器沿时间轴扫描移动过程 */
      @keyframes scanTimeLine {
        0% { transform: translateX(60px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(480px); opacity: 0; }
      }
      /* 正逆速率曲线动态绘制 (通过 stroke-dashoffset 实现绘制流动) */
      @keyframes drawVfwd {
        0% { stroke-dashoffset: 350; }
        100% { stroke-dashoffset: 0; }
      }
      /* 呼吸光斑 */
      @keyframes pulseChem {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      .anim-trace {
        stroke-dasharray: 350;
        animation: drawVfwd 3.6s ease-in-out infinite;
      }
      .anim-scanner {
        animation: scanTimeLine 3.6s linear infinite;
      }
      .pulse-tag-chem {
        animation: pulseChem 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fafdfb" filter="url(#shadowEqAnim)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridEqAnim)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(16, 185, 129, 0.28)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="1">
    ⚡ 动态模拟 · 化学平衡移动速率动态追赶 (v-t)
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <!-- 顶部状态指示 -->
    <circle cx="25" cy="22" r="5" fill="#10b981" class="pulse-tag-chem"/>
    <text x="36" y="26" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#047857">
      动态生成：外力扰动后正逆速率动态自适应
    </text>

    <!-- 坐标系 -->
    <!-- y 轴 (v) -->
    <line x1="60" y1="210" x2="60" y2="35" stroke="#475569" stroke-width="2.5"/>
    <path d="M 56 40 L 60 30 L 64 40 Z" fill="#475569"/>
    <text x="45" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#1e293b">v</text>

    <!-- x 轴 (t) -->
    <line x1="60" y1="210" x2="520" y2="210" stroke="#475569" stroke-width="2.5"/>
    <path d="M 515 206 L 525 210 L 515 214 Z" fill="#475569"/>
    <text x="525" y="215" font-family="sans-serif" font-size="13" font-weight="800" fill="#1e293b">t</text>

    <!-- t1 时刻扰动线 -->
    <line x1="220" y1="40" x2="220" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="220" y="226" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" text-anchor="middle">t₁ (增大反应物浓度)</text>

    <!-- t2 时刻新平衡线 -->
    <line x1="420" y1="40" x2="420" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="420" y="226" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" text-anchor="middle">t₂ (达新平衡)</text>

    <!-- 动态扫描时间线 -->
    <line class="anim-scanner" x1="0" y1="40" x2="0" y2="210" stroke="#10b981" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- 动态绘制的 v正 曲线 (红色) -->
    <!-- 0~t1 平衡态；t1 突增至高点；随后随消耗渐降至新平衡点 -->
    <path class="anim-trace" d="M 60 135 L 220 135 M 220 65 Q 310 85, 420 95 L 500 95" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="275" y="60" font-family="sans-serif" font-size="12" font-weight="900" fill="#dc2626">v'正 (瞬时突增)</text>

    <!-- 动态绘制的 v逆 曲线 (蓝色) -->
    <!-- 0~t1 平衡态；t1 瞬时不变；随后随生成物增加逐渐增大追赶 -->
    <path class="anim-trace" d="M 60 135 L 220 135 Q 310 120, 420 95 L 500 95" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="275" y="140" font-family="sans-serif" font-size="12" font-weight="900" fill="#2563eb">v'逆 (逐渐增大追赶)</text>

    <!-- 阶段状态标注 -->
    <text x="140" y="125" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">旧平衡 (v正=v逆)</text>
    <text x="460" y="85" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669">新平衡 (v'正=v'逆)</text>

    <!-- 右上角法则便利贴 -->
    <g transform="translate(365, 12)">
      <rect width="180" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="90" y="18" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#166534" text-anchor="middle">★ 勒夏特列动态规律：</text>
      <text x="90" y="34" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">改变条件打破原平衡，</text>
      <text x="90" y="47" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">正逆速率自适应追赶建立新稳态！</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" role="img" aria-labelledby="title description">
  <title id="title">欧拉恒等式：五个常数的一次相遇</title>
  <desc id="description">e^(iπ) 表示从 1 出发转半圈，落点正好是 −1，再移项就得到恒等式。。这个式子被称为「最美公式」，因为它把增长、旋转、圆、单位与零连在了一起。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="560" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">欧拉恒等式：五个常数的一次相遇</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">e^(iπ) 表示从 1 出发转半圈，落点正好是 −1，再移项就得到恒等式。</text>
  <rect x="24" y="82" width="430" height="400" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="44" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">从 1 出发，转半圈到 −1</text>
<line x1="70" y1="300" x2="408" y2="300" stroke="#50647a" stroke-width="1.6"/>
<line x1="239" y1="150" x2="239" y2="450" stroke="#50647a" stroke-width="1.6"/>
<circle cx="239" cy="300" r="145" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<circle cx="384" cy="300" r="5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="394" y="290" font-size="14" fill="#dc2626" text-anchor="start" font-weight="700">1</text>
<circle cx="94" cy="300" r="5" fill="#047857" stroke="white" stroke-width="1.5"/>
<text x="76" y="290" font-size="14" fill="#047857" text-anchor="start" font-weight="700">−1</text>
<path d="M 384 300 A 145 145 0 0 0 94 300" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="239" y="128" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">旋转 π（半圈）</text>
<text x="239" y="326" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">O</text>
<rect x="474" y="82" width="302" height="400" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="494" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">五个常数，一个式子</text>
<text x="494" y="150" font-size="19" fill="#dc2626" text-anchor="start" font-weight="800">e^(iπ) + 1 = 0</text>
<text x="494" y="192" font-size="15" fill="#172b42" text-anchor="start" font-weight="800">e</text>
<text x="520" y="192" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">自然常数 ≈2.718</text>
<text x="700" y="192" font-size="11" fill="#047857" text-anchor="end" font-weight="500">增长的底</text>
<text x="494" y="240" font-size="15" fill="#172b42" text-anchor="start" font-weight="800">i</text>
<text x="520" y="240" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">虚数单位，i²=−1</text>
<text x="700" y="240" font-size="11" fill="#047857" text-anchor="end" font-weight="500">旋转 90°</text>
<text x="494" y="288" font-size="15" fill="#172b42" text-anchor="start" font-weight="800">π</text>
<text x="520" y="288" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">圆周率 ≈3.14159</text>
<text x="700" y="288" font-size="11" fill="#047857" text-anchor="end" font-weight="500">转半圈</text>
<text x="494" y="336" font-size="15" fill="#172b42" text-anchor="start" font-weight="800">1</text>
<text x="520" y="336" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">乘法单位元</text>
<text x="700" y="336" font-size="11" fill="#047857" text-anchor="end" font-weight="500">起点</text>
<text x="494" y="384" font-size="15" fill="#172b42" text-anchor="start" font-weight="800">0</text>
<text x="520" y="384" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">加法单位元</text>
<text x="700" y="384" font-size="11" fill="#047857" text-anchor="end" font-weight="500">回到原点</text>
<text x="494" y="458" font-size="11" fill="#50647a" text-anchor="start" font-weight="500">五个常数来自完全不同的领域，却在这一个等式里相遇。</text>
  <rect x="24" y="498" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="518" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">这个式子被称为「最美公式」，因为它把增长、旋转、圆、单位与零连在了一起。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" role="img" aria-labelledby="title description">
  <title id="title">四象限符号：一句话记住</title>
  <desc id="description">符号由坐标正负决定：x 看余弦，y 看正弦，商看正切。。判断符号时先确定终边所在象限，再看坐标或比值的正负。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="600" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">四象限符号：一句话记住</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">符号由坐标正负决定：x 看余弦，y 看正弦，商看正切。</text>
  <rect x="24" y="82" width="752" height="430" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="44" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">四个象限，谁为正？</text>
<line x1="120" y1="300" x2="680" y2="300" stroke="#50647a" stroke-width="2"/>
<line x1="400" y1="140" x2="400" y2="460" stroke="#50647a" stroke-width="2"/>
<circle cx="400" cy="300" r="150" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<text x="465.76093" y="234.23907" font-size="22" fill="#047857" text-anchor="middle" font-weight="800">Ⅰ</text>
<text x="465.76093" y="260.23907" font-size="12" fill="#172b42" text-anchor="middle" font-weight="500">sin +  cos +  tan +</text>
<text x="334.23907" y="234.23907" font-size="22" fill="#047857" text-anchor="middle" font-weight="800">Ⅱ</text>
<text x="334.23907" y="260.23907" font-size="12" fill="#172b42" text-anchor="middle" font-weight="500">sin +  cos −  tan −</text>
<text x="334.23907" y="365.76093" font-size="22" fill="#047857" text-anchor="middle" font-weight="800">Ⅲ</text>
<text x="334.23907" y="391.76093" font-size="12" fill="#172b42" text-anchor="middle" font-weight="500">sin −  cos −  tan +</text>
<text x="465.76093" y="365.76093" font-size="22" fill="#047857" text-anchor="middle" font-weight="800">Ⅳ</text>
<text x="465.76093" y="391.76093" font-size="12" fill="#172b42" text-anchor="middle" font-weight="500">sin −  cos +  tan −</text>
<text x="400" y="326" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">O</text>
<text x="44" y="486" font-size="17" fill="#dc2626" text-anchor="start" font-weight="800">口诀：一全正、二正弦、三正切、四余弦</text>
<text x="44" y="520" font-size="13" fill="#50647a" text-anchor="start" font-weight="500">记忆法：把「全、正弦、正切、余弦」按 Ⅰ→Ⅳ 顺序念三遍，再对照单位圆坐标。</text>
  <rect x="24" y="538" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="558" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">判断符号时先确定终边所在象限，再看坐标或比值的正负。</text>
</svg>

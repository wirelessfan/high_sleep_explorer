<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroChemEq" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <style>
      /* 平衡天平倾斜与回摆动画 */
      @keyframes balanceRock {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-6deg); }
        50% { transform: rotate(4deg); }
        75% { transform: rotate(-2deg); }
      }
      .anim-balance-beam {
        transform-origin: 150px 105px;
        animation: balanceRock 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fafdfb"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroChemEq)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(16, 185, 129, 0.25)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#065f46" text-anchor="middle">
    ⚡ 化学平衡动态引导 · 勒夏特列动态天平
  </text>

  <!-- 左侧：动态平衡天平模型 -->
  <g transform="translate(10, 10)">
    <!-- 天平立柱底座 -->
    <line x1="150" y1="105" x2="150" y2="175" stroke="#475569" stroke-width="3.5"/>
    <polygon points="135,175 165,175 150,160" fill="#64748b"/>
    <circle cx="150" cy="105" r="4.5" fill="#1e293b"/>

    <!-- 动态晃动天平横梁组件 -->
    <g class="anim-balance-beam">
      <line x1="60" y1="105" x2="240" y2="105" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

      <!-- 左盘：反应物分子 (A + B) -->
      <line x1="60" y1="105" x2="60" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <ellipse cx="60" cy="135" rx="28" ry="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
      <!-- 分子球 -->
      <circle cx="52" cy="128" r="6" fill="#3b82f6"/>
      <circle cx="68" cy="128" r="6" fill="#10b981"/>
      <text x="60" y="152" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#065f46" text-anchor="middle">反应物 (正向)</text>

      <!-- 右盘：生成物分子 (C + D) -->
      <line x1="240" y1="105" x2="240" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <ellipse cx="240" cy="135" rx="28" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <!-- 分子球 -->
      <circle cx="232" cy="128" r="6" fill="#ef4444"/>
      <circle cx="248" cy="128" r="6" fill="#f59e0b"/>
      <text x="240" y="152" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#991b1b" text-anchor="middle">生成物 (逆向)</text>
    </g>
  </g>

  <!-- 右侧：勒夏特列法则卡 -->
  <g transform="translate(320, 42)">
    <rect width="290" height="135" rx="8" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#065f46">
      【勒夏特列原理核心要义】
    </text>

    <text x="14" y="48" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#1e293b">
      • 改变一个条件，平衡向「减弱改变」方向移动
    </text>
    <text x="14" y="70" font-family="'PingFang SC',sans-serif" font-size="11" fill="#334155">
      增反应物 → 平衡正移 ｜ 升温 → 向吸热移动
    </text>
    <text x="14" y="92" font-family="'PingFang SC',sans-serif" font-size="11" fill="#334155">
      增压强 → 向气体分子数减小的方向移动
    </text>
    <text x="14" y="116" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#dc2626">
      铁律：只能「减弱改变」，永远不能「抵消改变」！
    </text>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#15803d" text-anchor="middle">
    动态平衡特征：逆、等、动、定、变（v正 = v逆 ≠ 0，各组分浓度保持不变）
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroDeriv" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#fef3c7" stroke-width="0.8"/>
    </pattern>
    <style>
      /* 动点在曲线上往复滑行 */
      @keyframes pointGlide {
        0% { transform: translate(70px, 140px); }
        30% { transform: translate(140px, 80px); }
        70% { transform: translate(210px, 140px); }
        100% { transform: translate(70px, 140px); }
      }
      /* 切线随动点旋转变斜率 */
      @keyframes tangentSpin {
        0% { transform: rotate(-35deg); }
        30% { transform: rotate(0deg); }
        70% { transform: rotate(35deg); }
        100% { transform: rotate(-35deg); }
      }
      .anim-tangent-slider {
        animation: pointGlide 4.2s ease-in-out infinite;
      }
      .anim-tangent-rot {
        transform-origin: 0 0;
        animation: tangentSpin 4.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fffdfa"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroDeriv)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(245, 158, 11, 0.28)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#92400e" text-anchor="middle">
    ⚡ 导数几何动态引导 · 切线斜率与单调性
  </text>

  <!-- 左侧：平滑起伏曲线与随动切线模型 -->
  <g transform="translate(40, 20)">
    <!-- 坐标轴 -->
    <line x1="30" y1="165" x2="30" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="165" x2="270" y2="165" stroke="#64748b" stroke-width="2"/>

    <!-- 起伏平滑函数曲线 y = f(x) -->
    <path d="M 40 160 Q 140 30, 140 80 T 260 160" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="250" y="70" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#2563eb">y = f(x)</text>

    <!-- 动态随动切点与切线组件 -->
    <g class="anim-tangent-slider">
      <!-- 动态旋转的红色切线 -->
      <g class="anim-tangent-rot">
        <line x1="-40" y1="0" x2="40" y2="0" stroke="#dc2626" stroke-width="2.6"/>
      </g>
      <!-- 切点红珠 -->
      <circle cx="0" cy="0" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- 极值点驻点提示 -->
    <line x1="140" y1="75" x2="140" y2="165" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="140" y="178" font-family="'PingFang SC',sans-serif" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle">驻点 (f′(x)=0, 切线水平)</text>
  </g>

  <!-- 右侧：导数几何意义核心要点卡 -->
  <g transform="translate(340, 42)">
    <rect width="270" height="135" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>

    <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#92400e">
      【导数几何意义三大定理】
    </text>

    <text x="14" y="48" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#dc2626">
      • k = f′(x₀) = tanα ｜ 导数就是切线斜率
    </text>
    <text x="14" y="72" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#059669">
      • f′(x) &gt; 0 时单调递增 ｜ f′(x) &lt; 0 单调递减
    </text>
    <text x="14" y="94" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#2563eb">
      • 切线方程：y − y₀ = f′(x₀)(x − x₀)
    </text>
    <text x="14" y="118" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#854d0e">
      核心：差商的极限等于导数，瞬时变化率是切线斜率！
    </text>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#fef9c3" stroke="#fde047"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#854d0e" text-anchor="middle">
    微积分之门：先看切线图象直观，再算代数求导公式；求导判单调，求极值找变号点！
  </text>
</svg>

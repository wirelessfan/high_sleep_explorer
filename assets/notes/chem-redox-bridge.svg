<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">氧化还原：同元素对应的双线桥</title>
  <desc id="description">先标化合价，再对应元素、标得失电子，最后核对电子总数。。此反应 Fe 是还原剂，Cl₂ 是氧化剂；强弱比较须在相同反应条件下进行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">氧化还原：同元素对应的双线桥</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">先标化合价，再对应元素、标得失电子，最后核对电子总数。</text>
  <rect x="24" y="82" width="752" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="100" y="207" font-size="29" fill="#172b42" text-anchor="middle" font-weight="700">2Fe</text>
<text x="220" y="207" font-size="29" fill="#172b42" text-anchor="middle" font-weight="700">+</text>
<text x="310" y="207" font-size="29" fill="#172b42" text-anchor="middle" font-weight="700">3Cl₂</text>
<text x="425" y="207" font-size="29" fill="#172b42" text-anchor="middle" font-weight="700">→</text>
<text x="575" y="207" font-size="29" fill="#172b42" text-anchor="middle" font-weight="700">2FeCl₃</text>
<text x="425" y="180" font-size="15" fill="#50647a" text-anchor="middle" font-weight="500">点燃</text>
<text x="100" y="166" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">0</text>
<text x="310" y="166" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">0</text>
<text x="550" y="166" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">+3</text>
<text x="604" y="166" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">−1</text>
<text x="550" y="233" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="500">Fe</text>
<text x="604" y="233" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="500">Cl</text>
<path d="M 100 143 L100 112 L550 112 L550 143" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
<text x="325" y="102" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="500">Fe：升 0→+3，失 2×3e⁻，被氧化</text>
<path d="M 310 246 L310 279 L604 279 L604 246" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="458" y="307" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="500">Cl：降 0→−1，得 6×1e⁻，被还原</text>
<text x="400" y="350" font-size="20" fill="#047857" text-anchor="middle" font-weight="700">失电子总数 = 得电子总数 = 6e⁻</text>
<text x="400" y="377" font-size="16" fill="#50647a" text-anchor="middle" font-weight="500">双线桥：反应物中的元素 → 生成物中的同种元素</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">此反应 Fe 是还原剂，Cl₂ 是氧化剂；强弱比较须在相同反应条件下进行。</text>
</svg>

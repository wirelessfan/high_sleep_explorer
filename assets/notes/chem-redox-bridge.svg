<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridChem" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowChem" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fafdfb" filter="url(#shadowChem)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridChem)"/>

  <!-- 顶部胶带 -->
  <rect x="200" y="8" width="240" height="26" fill="rgba(16, 185, 129, 0.28)" rx="3" transform="rotate(-0.6 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="1">
    ★ 状元手卡 · 氧化还原反应破题秘籍
  </text>

  <!-- 左侧：双线桥手写拆解 -->
  <g transform="translate(30, 55)">
    <rect width="270" height="295" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>
    <text x="16" y="24" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#047857">
      【考场速画】双线桥标准规范
    </text>

    <!-- 化学方程式 -->
    <g transform="translate(15, 60)">
      <text x="0" y="20" font-family="'Courier New',monospace,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
        2Fe + 3Cl₂ <tspan fill="#64748b">点燃</tspan> 2FeCl₃
      </text>

      <!-- 双线桥：铁升价 -->
      <path d="M 16 0 C 16 -30, 195 -30, 195 0" fill="none" stroke="#dc2626" stroke-width="2"/>
      <path d="M 191 -4 L 195 2 L 199 -4 Z" fill="#dc2626"/>
      <text x="105" y="-22" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">
        化合价升高 (0→+3)，失 2×3e⁻，被氧化
      </text>

      <!-- 双线桥：氯降价 -->
      <path d="M 85 35 C 85 65, 220 65, 220 35" fill="none" stroke="#2563eb" stroke-width="2"/>
      <path d="M 216 38 L 220 32 L 224 38 Z" fill="#2563eb"/>
      <text x="155" y="62" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#2563eb" text-anchor="middle">
        化合价降低 (0→-1)，得 6×1e⁻，被还原
      </text>
    </g>

    <!-- 下方红笔规范警示 -->
    <rect x="14" y="165" width="242" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="24" y="188" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">
      ✎ 状元双线桥四步口诀：
    </text>
    <text x="24" y="210" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      1. 箭头起点指向「同种反应物元素」
    </text>
    <text x="24" y="230" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      2. 终点必须对准「生成物中的对应元素」
    </text>
    <text x="24" y="250" font-family="'PingFang SC',sans-serif" font-size="11" fill="#7f1d1d">
      3. 必须标清「得/失、电子总数、氧化/还原」
    </text>
    <text x="24" y="270" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">
      4. 铁遇强氧化剂（Cl₂）必生成 +3 价！
    </text>
  </g>

  <!-- 右侧：强弱规律思维导图 -->
  <g transform="translate(320, 55)">
    <rect width="290" height="295" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <text x="18" y="26" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#065f46">
      【秒杀规律 · 氧化性还原性比强弱】
    </text>

    <!-- 规律卡 1 -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="84" height="20" rx="4" fill="#d1fae5"/>
      <text x="42" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">万能黄金律</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="800" fill="#1e293b">
        氧化性：氧化剂 > 氧化产物
      </text>
      <text x="0" y="58" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="800" fill="#1e293b">
        还原性：还原剂 > 还原产物
      </text>
      <text x="0" y="78" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#059669">
        （强氧化剂生弱氧化产物，强还原剂生弱还原）
      </text>
    </g>

    <line x1="18" y1="135" x2="272" y2="135" stroke="#e8f3ee" stroke-width="1"/>

    <!-- 规律卡 2 -->
    <g transform="translate(18, 148)">
      <rect x="0" y="0" width="84" height="20" rx="4" fill="#fef3c7"/>
      <text x="42" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">得失电子守恒</text>
      <text x="0" y="36" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        计算大题核心：<tspan fill="#dc2626" font-weight="800">Σ n(失e⁻) = Σ n(得e⁻)</tspan>
      </text>
      <text x="0" y="56" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#475569">
        不必配平复杂方程式，直接找初态末态！
      </text>
    </g>

    <!-- 底部口诀 -->
    <g transform="translate(18, 228)">
      <rect x="0" y="0" width="254" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
      <text x="127" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">
        六字真言：「升失氧、降得还」
      </text>
      <text x="127" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#059669" text-anchor="middle">
        剂性相反：还原剂有还原性，被氧化！
      </text>
    </g>
  </g>
</svg>

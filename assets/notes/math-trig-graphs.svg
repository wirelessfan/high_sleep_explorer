<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" role="img" aria-labelledby="title description">
  <title id="title">三角函数图像：把性质画出来</title>
  <desc id="description">sin 与 cos 的图像可以互相平移得到；tan 有渐近线。。记不住性质时，先画草图再看图：最高点、零点、渐近线，一目了然。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="470" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">三角函数图像：把性质画出来</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">sin 与 cos 的图像可以互相平移得到；tan 有渐近线。</text>
  <rect x="24" y="82" width="752" height="300" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="44" y="112" font-size="15" fill="#172b42" text-anchor="start" font-weight="700">y = sinx 与 y = cosx（周期 2π）</text>
<line x1="90" y1="210" x2="615" y2="210" stroke="#50647a" stroke-width="1.6"/>
<line x1="90" y1="270" x2="90" y2="150" stroke="#50647a" stroke-width="1.6"/>
<line x1="90" y1="206" x2="90" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="90" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">-π</text>
<line x1="165" y1="206" x2="165" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="165" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">0</text>
<line x1="240" y1="206" x2="240" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="240" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">π/2</text>
<line x1="315" y1="206" x2="315" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="315" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">π</text>
<line x1="390" y1="206" x2="390" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="390" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">3π/2</text>
<line x1="465" y1="206" x2="465" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="465" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">2π</text>
<line x1="540" y1="206" x2="540" y2="214" stroke="#50647a" stroke-width="1"/>
<text x="540" y="228" font-size="10" fill="#50647a" text-anchor="middle" font-weight="500">5π/2</text>
<path d="M 90 270 L 106.40625 268.84712 L 122.8125 265.43277 L 139.21875 259.88818 L 155.625 252.42641 L 172.03125 243.33421 L 188.4375 232.96101 L 204.84375 221.70542 L 221.25 210 L 237.65625 198.29458 L 254.0625 187.03899 L 270.46875 176.66579 L 286.875 167.57359 L 303.28125 160.11182 L 319.6875 154.56723 L 336.09375 151.15288 L 352.5 150 L 368.90625 151.15288 L 385.3125 154.56723 L 401.71875 160.11182 L 418.125 167.57359 L 434.53125 176.66579 L 450.9375 187.03899 L 467.34375 198.29458 L 483.75 210 L 500.15625 221.70542 L 516.5625 232.96101 L 532.96875 243.33421 L 549.375 252.42641 L 565.78125 259.88818 L 582.1875 265.43277 L 598.59375 268.84712 L 615 270" fill="none" stroke="#dc2626" stroke-width="2.2" />
<path d="M 90 210 L 106.40625 198.29458 L 122.8125 187.03899 L 139.21875 176.66579 L 155.625 167.57359 L 172.03125 160.11182 L 188.4375 154.56723 L 204.84375 151.15288 L 221.25 150 L 237.65625 151.15288 L 254.0625 154.56723 L 270.46875 160.11182 L 286.875 167.57359 L 303.28125 176.66579 L 319.6875 187.03899 L 336.09375 198.29458 L 352.5 210 L 368.90625 221.70542 L 385.3125 232.96101 L 401.71875 243.33421 L 418.125 252.42641 L 434.53125 259.88818 L 450.9375 265.43277 L 467.34375 268.84712 L 483.75 270 L 500.15625 268.84712 L 516.5625 265.43277 L 532.96875 259.88818 L 549.375 252.42641 L 565.78125 243.33421 L 582.1875 232.96101 L 598.59375 221.70542 L 615 210" fill="none" stroke="#047857" stroke-width="2.2" />
<text x="565" y="140" font-size="#dc2626" fill="12" text-anchor="700" font-weight="500">sin（红）</text>
<text x="565" y="124" font-size="#047857" fill="12" text-anchor="700" font-weight="500">cos（绿）</text>
<text x="44" y="328" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">sin 奇函数，cos 偶函数；递增区间 [−π/2+2kπ, π/2+2kπ]</text>
<text x="44" y="356" font-size="12.5" fill="#172b42" text-anchor="start" font-weight="500">y = tanx：周期 π，在 (−π/2+kπ, π/2+kπ) 内递增，有渐近线</text>
<rect x="24" y="380" width="752" height="60" rx="10" fill="#fef9c3" stroke="#cbdcd5"/>
<text x="400" y="406" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">图像上读性质：最高点→最大值；过零点→sin 的零点与单调分界</text>
  <rect x="24" y="408" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="428" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">记不住性质时，先画草图再看图：最高点、零点、渐近线，一目了然。</text>
</svg>

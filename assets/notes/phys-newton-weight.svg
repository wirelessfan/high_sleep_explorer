<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridW" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowW" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fdfbf7" filter="url(#shadowW)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridW)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(239, 68, 68, 0.22)" rx="3" transform="rotate(-0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1">
    ★ 视重对比图解 · 超重与失重核心口诀
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 左半区：超重模型 -->
    <g transform="translate(25, 20)">
      <rect width="240" height="185" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="120" y="25" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">
        ▲ 超重（示数 > mg）
      </text>

      <!-- 电梯框与人 -->
      <g transform="translate(30, 45)">
        <rect x="0" y="0" width="80" height="90" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/>
        <line x1="40" y1="0" x2="40" y2="-15" stroke="#78716c" stroke-width="2"/>
        <!-- 体重秤 -->
        <rect x="15" y="76" width="50" height="8" rx="2" fill="#fca5a5"/>
        <!-- 人小人简笔 -->
        <circle cx="40" cy="30" r="10" fill="#f87171"/>
        <line x1="40" y1="40" x2="40" y2="65" stroke="#ef4444" stroke-width="3"/>
        <line x1="40" y1="65" x2="28" y2="76" stroke="#ef4444" stroke-width="2.5"/>
        <line x1="40" y1="65" x2="52" y2="76" stroke="#ef4444" stroke-width="2.5"/>
        <line x1="28" y1="50" x2="52" y2="50" stroke="#ef4444" stroke-width="2.5"/>

        <!-- 加速度向上箭头 -->
        <line x1="95" y1="65" x2="95" y2="25" stroke="#dc2626" stroke-width="3.5"/>
        <path d="M 91 29 L 95 20 L 99 29 Z" fill="#dc2626"/>
        <text x="110" y="48" font-family="sans-serif" font-size="14" font-weight="900" fill="#dc2626">a 向上</text>
      </g>

      <!-- 判别条件 -->
      <text x="25" y="152" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">
        • 加速上升 或 减速下降
      </text>
      <text x="25" y="172" font-family="'Courier New',sans-serif" font-size="12" font-weight="800" fill="#b91c1c">
        方程：N − mg = ma ⇒ N = m(g+a)
      </text>
    </g>

    <!-- 右半区：失重模型 -->
    <g transform="translate(295, 20)">
      <rect width="240" height="185" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="120" y="25" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">
        ▼ 失重（示数 &lt; mg）
      </text>

      <!-- 电梯框与人 -->
      <g transform="translate(30, 45)">
        <rect x="0" y="0" width="80" height="90" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
        <line x1="40" y1="0" x2="40" y2="-15" stroke="#78716c" stroke-width="2"/>
        <!-- 体重秤 -->
        <rect x="15" y="76" width="50" height="8" rx="2" fill="#93c5fd"/>
        <!-- 人小人简笔 -->
        <circle cx="40" cy="30" r="10" fill="#60a5fa"/>
        <line x1="40" y1="40" x2="40" y2="65" stroke="#3b82f6" stroke-width="3"/>
        <line x1="40" y1="65" x2="28" y2="76" stroke="#3b82f6" stroke-width="2.5"/>
        <line x1="40" y1="65" x2="52" y2="76" stroke="#3b82f6" stroke-width="2.5"/>
        <line x1="28" y1="50" x2="52" y2="50" stroke="#3b82f6" stroke-width="2.5"/>

        <!-- 加速度向下箭头 -->
        <line x1="95" y1="25" x2="95" y2="65" stroke="#2563eb" stroke-width="3.5"/>
        <path d="M 91 61 L 95 70 L 99 61 Z" fill="#2563eb"/>
        <text x="110" y="48" font-family="sans-serif" font-size="14" font-weight="900" fill="#2563eb">a 向下</text>
      </g>

      <!-- 判别条件 -->
      <text x="25" y="152" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
        • 加速下降 或 减速上升
      </text>
      <text x="25" y="172" font-family="'Courier New',sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">
        方程：mg − N = ma ⇒ N = m(g−a)
      </text>
    </g>

    <!-- 底部口诀高亮条 -->
    <rect x="25" y="215" width="510" height="24" rx="5" fill="#fef9c3" stroke="#facc15"/>
    <text x="280" y="232" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#854d0e" text-anchor="middle">
      ★ 秒杀口诀：「上超下失」！永远只看加速度 a 的方向，绝不看速度 v 的方向！
    </text>
  </g>
</svg>

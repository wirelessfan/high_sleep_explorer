<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 574" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">超重与失重 · 运动和支持力同步</title>
<desc id="desc">红绿力箭头同尺度；N = m(g+a)。蓝色 a 由电梯位置的二阶导数给出。。动画与静态图使用相同物理模型；减少动态效果时显示静态示意。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style>
<g transform="scale(1.4)">
<rect x="0" y="0" width="640" height="410" rx="12" fill="#fdfcf7" stroke="#e7d8c4">
</rect>
<text x="24" y="28" fill="#1e293b" font-size="15" font-weight="800">超重与失重 · 运动和支持力同步</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#e7d8c4" stroke-width="1">
</line>
<rect x="370" y="55" width="246" height="307" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="384" y="77" fill="#475569" font-size="12" font-weight="600">取竖直向上为正方向</text>
<text x="384" y="103" fill="#475569" font-size="12" font-weight="600">N − mg = ma</text>
<text x="384" y="129" fill="#475569" font-size="12" font-weight="600">a 向上：N &gt; mg（超重）</text>
<text x="384" y="155" fill="#475569" font-size="12" font-weight="600">a 向下：N &lt; mg（失重）</text>
<text x="384" y="181" fill="#475569" font-size="12" font-weight="600">a = 0：N = mg</text>
<text x="384" y="207" fill="#475569" font-size="12" font-weight="600">仅与加速度有关，与速度无关</text>
<text x="384" y="233" fill="#475569" font-size="12" font-weight="600">支持力 N（同一比例尺）：</text>
<line x1="70" y1="65" x2="70" y2="295" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3">
</line>
<line x1="300" y1="65" x2="300" y2="295" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3">
</line>
<rect x="105" y="122" width="150" height="145" rx="6" fill="#fff" stroke="#475569" stroke-width="2">
</rect>
<rect x="140" y="252" width="80" height="10" rx="2" fill="#cbd5e1">
</rect>
<circle cx="180" cy="164" r="12" fill="#fbbf24">
</circle>
<path d="M 180 176 L 180 227 L 165 252 M 180 227 L 195 252" fill="none" stroke="#475569" stroke-width="3">
</path>
<path d="M 180 202 L 180 157.8 M 183 163.8 L 180 157.8 L 177 163.8" fill="none" stroke="#059669" stroke-width="2.2">
</path>
<path d="M 180 202 L 180 236 M 177 230 L 180 236 L 183 230" fill="none" stroke="#dc2626" stroke-width="2.2">
</path>
<path d="M 280 202 L 280 178 M 283 184 L 280 178 L 277 184" fill="none" stroke="#2563eb" stroke-width="2.2">
</path>
<rect x="395" y="310" width="182" height="12" fill="#059669" rx="2">
</rect>
<text x="105" y="320" fill="#475569" font-size="12" font-weight="500">红 G = mg；绿 N；蓝 a</text>
<rect x="395" y="310" width="196" height="12" rx="5" fill="none" stroke="#94a3b8">
</rect>
<line x1="535" y1="305" x2="535" y2="327" stroke="#475569" stroke-width="1">
</line>
<text x="535" y="340" fill="#475569" font-size="12" font-weight="500" text-anchor="middle">mg</text>
<rect x="20" y="370" width="600" height="21" rx="5" fill="#eff6ff" stroke="#bfdbfe">
</rect>
<text x="320" y="383" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">红绿力箭头同尺度；N = m(g+a)。蓝色 a 由电梯位置的二阶导数给出。</text>
</g>
</svg>

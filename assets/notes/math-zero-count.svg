<text x="556" y="344" font-size="16" fill="#dc2626" text-anchor="start" font-weight="800">零点个数：1 个</text>
<text x="556" y="372" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">极小值 = −5</text>

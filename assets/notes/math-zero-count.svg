<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="title description">
  <title id="title">零点个数与极值符号</title>
  <desc id="description">三次函数上下平移，极值同号时 1 个零点，异号时 3 个零点。。不要只画草图数交点：把极值算出来，用符号判断才可靠。</desc>

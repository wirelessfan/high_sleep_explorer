<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">元素周期律：位置、结构与性质</title>
  <desc id="description">比较趋势需在对应周期或主族内；原子半径比较需采用一致口径。。非金属性强不等于氢化物酸性强：HF 是弱酸；通常比较最高价氧化物对应水化物。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">元素周期律：位置、结构与性质</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">比较趋势需在对应周期或主族内；原子半径比较需采用一致口径。</text>
  <rect x="24" y="82" width="752" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<circle cx="163" cy="207" r="61" fill="none" stroke="#8dbca2" stroke-width="2"/>
<circle cx="163" cy="207" r="32" fill="none" stroke="#93b9e1" stroke-width="2"/>
<circle cx="163" cy="207" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="163" y="213" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">+6</text>
<circle cx="163" cy="175" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
<circle cx="163" cy="239" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
<circle cx="163" cy="146" r="5" fill="#047857" stroke="white" stroke-width="1.5"/>
<circle cx="163" cy="268" r="5" fill="#047857" stroke="white" stroke-width="1.5"/>
<circle cx="102" cy="207" r="5" fill="#047857" stroke="white" stroke-width="1.5"/>
<circle cx="224" cy="207" r="5" fill="#047857" stroke="white" stroke-width="1.5"/>
<text x="163" y="313" font-size="18" fill="#172b42" text-anchor="middle" font-weight="700">碳原子：2、4</text>
<text x="163" y="343" font-size="15" fill="#50647a" text-anchor="middle" font-weight="500">点仅表示各层电子数</text>
<text x="163" y="367" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="500">不表示电子的运动轨迹</text>
<text x="390" y="117" font-size="16" fill="#047857" text-anchor="start" font-weight="700">位—构—性：注意适用范围</text>
<text x="390" y="155" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">主族元素：电子层数 = 周期数</text>
<text x="390" y="189" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">IA—VIIA：最外层电子数 = 族序数</text>
<text x="390" y="223" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">He 最外层 2 个电子，属于第18族</text>
<text x="390" y="267" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">同周期主族：一般半径减小</text>
<text x="390" y="300" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">金属性减弱，非金属性增强</text>
<text x="390" y="340" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">同主族向下：一般半径增大</text>
<text x="390" y="372" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">金属性增强，非金属性减弱</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">非金属性强不等于氢化物酸性强：HF 是弱酸；通常比较最高价氧化物对应水化物。</text>
</svg>

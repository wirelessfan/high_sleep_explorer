<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="title description">
  <title id="title">切线方程与法线方程</title>
  <desc id="description">同一个切点处，切线与法线互相垂直，斜率互为负倒数。。求“过某点的切线”要先设切点，再解方程；求“在某点的切线”可直接代点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="580" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">切线方程与法线方程</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">同一个切点处，切线与法线互相垂直，斜率互为负倒数。</text>

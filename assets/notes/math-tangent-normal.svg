<text x="637.14286" y="247.80061" font-size="16" fill="#2563eb" text-anchor="start" font-weight="500">y = f(x)</text>
<line x1="277.67857" y1="416.81818" x2="611.60714" y2="267.42424" stroke="#dc2626" stroke-width="2.8"/>
<line x1="297.32143" y1="276.21212" x2="591.96429" y2="408.0303" stroke="#b45309" stroke-width="2.4"/>
<circle cx="444.64286" cy="342.12121" r="5.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<path d="M 457.42224 336.40393 L 463.13952 349.18332 L 450.36014 354.9006" fill="none" stroke="#50647a" stroke-width="1.6" />
<text x="271.67857" y="421.81818" font-size="14" fill="#dc2626" text-anchor="end" font-weight="500">切线  k = f′(x₀) = 1</text>
<text x="599.96429" y="414.0303" font-size="14" fill="#b45309" text-anchor="start" font-weight="500">法线  k⊥ = −1/k = −1</text>
<text x="444.64286" y="318.12121" font-size="13" fill="#50647a" text-anchor="middle" font-weight="500">切点 (x₀, f(x₀))</text>
<text x="150" y="482" font-size="15" fill="#172b42" text-anchor="start" font-weight="500">切线方程：y − y₀ = f′(x₀)(x − x₀)</text>
<text x="150" y="510" font-size="15" fill="#172b42" text-anchor="start" font-weight="500">法线方程：y − y₀ = −[1/f′(x₀)](x − x₀)　（f′(x₀) ≠ 0）</text>
<text x="150" y="538" font-size="14" fill="#50647a" text-anchor="start" font-weight="500">两条直线互相垂直，斜率乘积恒为 −1；法线的 −1/k 是最容易和切线弄混的一步。</text>
  <rect x="24" y="518" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="538" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">求“过某点的切线”要先设切点，再解方程；求“在某点的切线”可直接代点。</text>
</svg>

  <title id="title">三次函数：f(x) 与 f′(x) 的极值对应</title>
  <desc id="description">上方曲线的极大值与极小值，正好对齐下方导函数的两个过零点。。f′ &gt; 0 的区间函数递增，f′ &lt; 0 的区间函数递减；变号点才是极值点。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroEng" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <style>
      /* 单摆摆动动画 (3s 循环) */
      @keyframes pendulumSwing {
        0% { transform: rotate(-40deg); }
        50% { transform: rotate(40deg); }
        100% { transform: rotate(-40deg); }
      }
      /* 动能柱动态涨落 */
      @keyframes ekBarAnim {
        0%, 100% { width: 4px; }
        50% { width: 120px; }
      }
      /* 势能柱动态涨落 */
      @keyframes epBarAnim {
        0%, 100% { width: 120px; }
        50% { width: 4px; }
      }
      .anim-pendulum {
        transform-origin: 160px 40px;
        animation: pendulumSwing 2.6s ease-in-out infinite;
      }
      .bar-ek-pulse {
        animation: ekBarAnim 1.3s ease-in-out infinite;
      }
      .bar-ep-pulse {
        animation: epBarAnim 1.3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fffdf9"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroEng)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(245, 158, 11, 0.25)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#92400e" text-anchor="middle">
    ⚡ 机械能动态引导 · 动能与势能守恒互换
  </text>

  <!-- 左侧：单摆往复摆动模型 -->
  <g transform="translate(40, 10)">
    <!-- 悬挂天花板 -->
    <line x1="120" y1="40" x2="200" y2="40" stroke="#78716c" stroke-width="3"/>
    <!-- 悬点 -->
    <circle cx="160" cy="40" r="3.5" fill="#1e293b"/>

    <!-- 摆球轨迹圆弧虚线 -->
    <path d="M 85 130 Q 160 170, 235 130" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="160" y="172" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="middle">最低点 (动能最大，势能零)</text>

    <!-- 动态摆动组件 -->
    <g class="anim-pendulum">
      <line x1="160" y1="40" x2="160" y2="155" stroke="#475569" stroke-width="2"/>
      <circle cx="160" cy="155" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      <!-- 反光小弧 -->
      <path d="M 155 149 Q 158 146, 163 148" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- 右侧：能量动态实时互换柱 -->
  <g transform="translate(360, 40)">
    <rect width="250" height="135" rx="8" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#1e293b">
      【机械能总量守恒仪表】
    </text>

    <!-- 动能 Ek -->
    <g transform="translate(14, 35)">
      <text x="0" y="12" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">动能 Ek</text>
      <rect x="0" y="18" width="220" height="14" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect class="bar-ek-pulse" x="1" y="19" width="4" height="12" rx="3" fill="#ef4444"/>
    </g>

    <!-- 势能 Ep -->
    <g transform="translate(14, 75)">
      <text x="0" y="12" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#2563eb">重力势能 Ep</text>
      <rect x="0" y="18" width="220" height="14" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect class="bar-ep-pulse" x="1" y="19" width="120" height="12" rx="3" fill="#3b82f6"/>
    </g>

    <!-- 总能量守恒标 -->
    <g transform="translate(14, 115)">
      <text x="0" y="10" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#15803d">
        E机 = Ek + Ep = 恒量（只有重力做功）
      </text>
    </g>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#fef9c3" stroke="#fde047"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#854d0e" text-anchor="middle">
    功能关系：W合 = ΔEk（动能定理）｜ W重 = −ΔEp ｜ 只有重力做功，机械能严格守恒！
  </text>
</svg>

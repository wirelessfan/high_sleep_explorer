<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridWeightAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowWeightAnim" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 电梯升降循环 (6s 周期) */
      /* 0s~3s: 超重阶段 (加速上升 a向上, N增大) */
      /* 3s~6s: 失重阶段 (加速下降 a向下, N减小) */
      @keyframes elevatorMotion {
        0%, 10% { transform: translateY(15px); }
        45%, 55% { transform: translateY(-15px); }
        90%, 100% { transform: translateY(15px); }
      }
      /* 支持力箭头 N 动态伸缩 */
      @keyframes normalForceScale {
        0%, 10% { transform: scaleY(1.4); }
        45%, 55% { transform: scaleY(0.65); }
        90%, 100% { transform: scaleY(1.4); }
      }
      /* 超重阶段卡片高亮 */
      @keyframes cardOverweight {
        0%, 48% { background-color: #fee2e2; border-color: #ef4444; }
        49%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      /* 失重阶段卡片高亮 */
      @keyframes cardWeightless {
        0%, 48% { background-color: #ffffff; border-color: #e2e8f0; }
        49%, 98% { background-color: #eff6ff; border-color: #3b82f6; }
        99%, 100% { background-color: #ffffff; border-color: #e2e8f0; }
      }
      /* 动态示数跳变 */
      @keyframes scaleWeightText {
        0%, 48% { opacity: 1; }
        49%, 100% { opacity: 0; }
      }
      @keyframes scaleWeightText2 {
        0%, 48% { opacity: 0; }
        49%, 100% { opacity: 1; }
      }

      .anim-elevator { animation: elevatorMotion 6s ease-in-out infinite; }
      .anim-force-n { transform-origin: 0 0; animation: normalForceScale 6s ease-in-out infinite; }
      .hl-overweight { animation: cardOverweight 6s infinite; }
      .hl-weightless { animation: cardWeightless 6s infinite; }
      .weight-num-heavy { animation: scaleWeightText 6s infinite; }
      .weight-num-light { animation: scaleWeightText2 6s infinite; }
    </style>
  </defs>

  <rect width="640" height="380" rx="14" fill="#fdfbf7" filter="url(#shadowWeightAnim)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridWeightAnim)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(239, 68, 68, 0.25)" rx="3" transform="rotate(-0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1">
    ⚡ 动态模拟 · 电梯升降中的视重与超失重演练
  </text>

  <g transform="translate(30, 48)">
    <rect width="580" height="305" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 左侧：动态电梯物理模型区 -->
    <g transform="translate(15, 15)">
      <rect width="250" height="275" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="125" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#1e293b" text-anchor="middle">
        【电梯升降模拟舱】视重动态演变
      </text>

      <!-- 垂直电梯井导轨 -->
      <line x1="40" y1="35" x2="40" y2="235" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,2"/>
      <line x1="210" y1="35" x2="210" y2="235" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,2"/>

      <!-- 动态平移的电梯车厢 -->
      <g class="anim-elevator" transform="translate(60, 85)">
        <!-- 悬挂钢缆 -->
        <line x1="65" y1="-50" x2="65" y2="0" stroke="#64748b" stroke-width="2.5"/>
        <!-- 轿厢外壳 -->
        <rect x="10" y="0" width="110" height="125" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>

        <!-- 地板上的体重秤 -->
        <rect x="35" y="105" width="60" height="12" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
        <!-- 动态数字显示屏 -->
        <rect x="48" y="108" width="34" height="7" rx="1.5" fill="#0f172a"/>
        <text class="weight-num-heavy" x="65" y="114" font-family="'Courier New',monospace" font-size="7" font-weight="900" fill="#ef4444" text-anchor="middle">70 kg ▲</text>
        <text class="weight-num-light" x="65" y="114" font-family="'Courier New',monospace" font-size="7" font-weight="900" fill="#3b82f6" text-anchor="middle">30 kg ▼</text>

        <!-- 站在秤上的人 -->
        <g transform="translate(65, 45)">
          <circle cx="0" cy="0" r="10" fill="#fbbf24"/>
          <line x1="0" y1="10" x2="0" y2="38" stroke="#475569" stroke-width="3"/>
          <line x1="0" y1="38" x2="-12" y2="60" stroke="#475569" stroke-width="2.5"/>
          <line x1="0" y1="38" x2="12" y2="60" stroke="#475569" stroke-width="2.5"/>
          <line x1="-12" y1="22" x2="12" y2="22" stroke="#475569" stroke-width="2.5"/>

          <!-- 质心受力点 -->
          <circle cx="0" cy="24" r="3" fill="#dc2626"/>

          <!-- 恒定重力 G=mg (向下的红线) -->
          <line x1="0" y1="24" x2="0" y2="54" stroke="#dc2626" stroke-width="2.5"/>
          <path d="M -3 48 L 0 55 L 3 48 Z" fill="#dc2626"/>
          <text x="8" y="52" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="800" fill="#dc2626">G=50kg</text>

          <!-- 动态支持力 N (向上的绿线，随超失重动态拉伸收缩) -->
          <g class="anim-force-n" transform="translate(0, 24)">
            <line x1="0" y1="0" x2="0" y2="-26" stroke="#059669" stroke-width="2.8"/>
            <path d="M -3.5 -20 L 0 -28 L 3.5 -20 Z" fill="#059669"/>
            <text x="8" y="-18" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="900" fill="#059669">N (支持力)</text>
          </g>
        </g>
      </g>

      <!-- 底部提示 -->
      <rect x="15" y="242" width="220" height="22" rx="4" fill="#f1f5f9"/>
      <text x="125" y="257" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#475569" text-anchor="middle">
        视重 = 支持力 N = 体重计读数
      </text>
    </g>

    <!-- 右侧：超重与失重分阶段联动卡片 -->
    <g transform="translate(280, 15)">
      <!-- 阶段 1: 超重卡片 -->
      <g transform="translate(0, 0)">
        <rect width="285" height="105" rx="8" stroke="#e2e8f0" stroke-width="1.8" class="hl-overweight"/>
        <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#b91c1c">
          ▲ 超重阶段 (视重 N &gt; mg)
        </text>
        <text x="14" y="46" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
          • 运动状态：<tspan fill="#dc2626" font-weight="800">加速上升</tspan> 或 <tspan fill="#dc2626" font-weight="800">减速下降</tspan>
        </text>
        <text x="14" y="66" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
          • 本质特征：<tspan fill="#dc2626" font-weight="900">加速度 a 向上！</tspan>
        </text>
        <text x="14" y="86" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#b91c1c">
          列式：N − mg = ma ⇒ N = m(g + a) &gt; mg
        </text>
      </g>

      <!-- 阶段 2: 失重卡片 -->
      <g transform="translate(0, 118)">
        <rect width="285" height="105" rx="8" stroke="#e2e8f0" stroke-width="1.8" class="hl-weightless"/>
        <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#1d4ed8">
          ▼ 失重阶段 (视重 N &lt; mg)
        </text>
        <text x="14" y="46" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
          • 运动状态：<tspan fill="#2563eb" font-weight="800">加速下降</tspan> 或 <tspan fill="#2563eb" font-weight="800">减速上升</tspan>
        </text>
        <text x="14" y="66" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#334155">
          • 本质特征：<tspan fill="#2563eb" font-weight="900">加速度 a 向下！</tspan>
        </text>
        <text x="14" y="86" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#1d4ed8">
          列式：mg − N = ma ⇒ N = m(g − a) &lt; mg
        </text>
      </g>

      <!-- 底部黄金口诀 -->
      <g transform="translate(0, 235)">
        <rect width="285" height="40" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1.2"/>
        <text x="142" y="20" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#854d0e" text-anchor="middle">
          ★ 高考秒杀口诀：「上超下失」
        </text>
        <text x="142" y="34" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#a16207" text-anchor="middle">
          永远只看加速度 a 的方向，绝不看速度 v 的方向！
        </text>
      </g>
    </g>
  </g>
</svg>

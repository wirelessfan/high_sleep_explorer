<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fdfcf7" filter="url(#shadow2)"/>
  <rect width="640" height="380" rx="14" fill="url(#grid2)"/>

  <!-- 顶部标签胶带 -->
  <rect x="210" y="8" width="220" height="26" fill="rgba(59, 130, 246, 0.25)" rx="3" transform="rotate(0.8 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">
    ★ 状元破题卡 · 牛顿第二定律受力分解
  </text>

  <!-- 左侧：草稿手绘分解图 -->
  <g transform="translate(30, 55)">
    <rect width="260" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#1e40af">
      【考场草稿】斜面正交坐标轴构建
    </text>

    <!-- 斜面底座 (倾角 θ) -->
    <path d="M 25 210 L 225 210 L 225 100 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="55" y="202" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#475569">θ</text>

    <!-- 滑块（旋转斜向放置） -->
    <g transform="translate(130, 150) rotate(-28)">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="900" fill="#1e40af" text-anchor="middle">m</text>

      <!-- 沿斜面和垂直斜面坐标轴 (手写虚线) -->
      <!-- x 轴 (平行斜面向下) -->
      <line x1="-35" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3,2"/>
      <path d="M 58 -3 L 65 0 L 58 3 Z" fill="#dc2626"/>
      <text x="68" y="4" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">+x</text>

      <!-- y 轴 (垂直斜面向上) -->
      <line x1="0" y1="35" x2="0" y2="-60" stroke="#059669" stroke-width="1.8" stroke-dasharray="3,2"/>
      <path d="M -3 -58 L 0 -65 L 3 -58 Z" fill="#059669"/>
      <text x="6" y="-55" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669">+y</text>
    </g>

    <!-- 两个分力标注 -->
    <text x="140" y="235" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">下滑分力: mg sinθ</text>
    <text x="15" y="105" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669">正压力: mg cosθ</text>

    <!-- 底部便利贴提示 -->
    <rect x="15" y="250" width="230" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="130" y="271" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      考场铁律：沿加速度方向建 x 轴！
    </text>
  </g>

  <!-- 右侧：状元核心笔记 -->
  <g transform="translate(310, 55)">
    <rect width="300" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="18" y="28" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="900" fill="#0f172a">
      【连接体两步走 · 考场提速】
    </text>

    <!-- 步骤1 -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#e0e7ff"/>
      <text x="38" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#3730a3" text-anchor="middle">Step 1 整体法</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        若两物体加速度相同，视作单一质点：
      </text>
      <text x="0" y="56" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="800" fill="#4338ca">
        a = F合外 / (m₁ + m₂)
      </text>
      <text x="0" y="74" font-family="'PingFang SC',sans-serif" font-size="11" fill="#64748b">
        （瞬间避开内部弹力、绳拉力等内力计算）
      </text>
    </g>

    <line x1="18" y1="138" x2="282" y2="138" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 步骤2 -->
    <g transform="translate(18, 150)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#fef2f2"/>
      <text x="38" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Step 2 隔离法</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        要问谁的内力，就单独隔离谁：
      </text>
      <text x="0" y="56" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="800" fill="#b91c1c">
        F内 = m₁·a （由已知 a 反推内力）
      </text>
    </g>

    <!-- 底部口诀 -->
    <g transform="translate(18, 230)">
      <rect x="0" y="0" width="264" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
      <text x="132" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#15803d" text-anchor="middle">
        口诀：「先整体求 a，再隔离求 F」
      </text>
      <text x="132" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#166534" text-anchor="middle">
        全国卷大题至少节约 3 分钟列式时间！
      </text>
    </g>
  </g>
</svg>

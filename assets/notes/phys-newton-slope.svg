<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridSlope" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowSlope" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fdfcf7" filter="url(#shadowSlope)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridSlope)"/>

  <!-- 顶部标签胶带 -->
  <rect x="200" y="8" width="240" height="26" fill="rgba(59, 130, 246, 0.25)" rx="3" transform="rotate(0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">
    ★ 状元破题卡 · 斜面受力正交分解与连接体
  </text>

  <!-- 左侧：草稿手绘分解图 -->
  <g transform="translate(30, 55)">
    <rect width="265" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="800" fill="#1e40af">
      【考场草稿】斜面正交坐标轴与受力
    </text>

    <!-- 斜面底座 (倾角 30°，精确几何顶点) -->
    <!-- (25, 215) -> (235, 215) -> (235, 94) -> (25, 215) -->
    <path d="M 25 215 L 235 215 L 235 94 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 地基剖面阴影线 -->
    <line x1="20" y1="215" x2="245" y2="215" stroke="#475569" stroke-width="2"/>
    <text x="65" y="206" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#475569">θ = 30°</text>

    <!-- 
      斜边中点选取在 (130, 154.5)，倾角 30°。
      坐标系原点精准对准斜面表面，旋转 -30°：
      局部坐标系中：
        y = 0 严格为斜面表面！
        y < 0 严格为斜面上方空间（滑块所在区域）！
        y > 0 为斜面内部，绝不越雷池半步！
    -->
    <g transform="translate(130, 154.5) rotate(-30)">
      <!-- 物体 A (m1) 紧贴在斜面上，底边 y=0，高度 34 -->
      <rect x="-44" y="-34" width="40" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
      <text x="-24" y="-12" font-family="sans-serif" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">m₁</text>

      <!-- 物体 B (m2) 与 A 紧靠接触，底边 y=0，高度 34 -->
      <rect x="-2" y="-34" width="48" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
      <text x="22" y="-12" font-family="sans-serif" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">m₂</text>

      <!-- 沿斜面推力 F (箭头作用在 A 上表面) -->
      <line x1="-80" y1="-17" x2="-48" y2="-17" stroke="#dc2626" stroke-width="2.5"/>
      <path d="M -54 -21 L -46 -17 L -54 -13 Z" fill="#dc2626"/>
      <text x="-65" y="-23" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">推力 F</text>

      <!-- 接触面弹力 N_AB 标注 -->
      <line x1="-1" y1="-40" x2="-1" y2="-5" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="-1" y="-45" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="800" fill="#7c3aed" text-anchor="middle">接触面弹力 N</text>

      <!-- 正交坐标轴虚线 -->
      <!-- +x 轴 (平行斜面向下) -->
      <line x1="-60" y1="-17" x2="85" y2="-17" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M 80 -20 L 88 -17 L 80 -14 Z" fill="#dc2626"/>
      <text x="94" y="-13" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626">+x (沿斜面)</text>

      <!-- +y 轴 (垂直斜面向上) -->
      <line x1="22" y1="0" x2="22" y2="-75" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M 19 -70 L 22 -78 L 25 -70 Z" fill="#059669"/>
      <text x="28" y="-70" font-family="sans-serif" font-size="11" font-weight="900" fill="#059669">+y</text>
    </g>

    <!-- 分力说明文本 -->
    <text x="20" y="95" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669">垂直轴: N = mg cosθ</text>
    <text x="135" y="240" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">沿斜面: F合 = mg sinθ + F</text>

    <!-- 底部便利贴提示 -->
    <rect x="15" y="252" width="235" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="132" y="272" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      考场铁律：沿加速度方向建立 x 轴！
    </text>
  </g>

  <!-- 右侧：状元核心笔记 -->
  <g transform="translate(315, 55)">
    <rect width="295" height="295" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="18" y="28" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="900" fill="#0f172a">
      【连接体两步走 · 考场提速】
    </text>

    <!-- 步骤1 -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#e0e7ff"/>
      <text x="38" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#3730a3" text-anchor="middle">Step 1 整体法</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        若两物体加速度相同，视作单一质点：
      </text>
      <text x="0" y="58" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#4338ca">
        a = F合外 / (m₁ + m₂)
      </text>
      <text x="0" y="76" font-family="'PingFang SC',sans-serif" font-size="11" fill="#64748b">
        （瞬间避开内部弹力、摩擦力等内力计算）
      </text>
    </g>

    <line x1="18" y1="138" x2="277" y2="138" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 步骤2 -->
    <g transform="translate(18, 150)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#fef2f2"/>
      <text x="38" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Step 2 隔离法</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        要问谁的内力，就单独隔离谁：
      </text>
      <text x="0" y="58" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="900" fill="#b91c1c">
        N_AB = m₂·a - m₂g sinθ
      </text>
    </g>

    <!-- 底部口诀 -->
    <g transform="translate(18, 230)">
      <rect x="0" y="0" width="259" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
      <text x="129" y="22" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#15803d" text-anchor="middle">
        口诀：「先整体求 a，再隔离求 F」
      </text>
      <text x="129" y="38" font-family="'PingFang SC',sans-serif" font-size="11" fill="#166534" text-anchor="middle">
        全国卷大题至少节约 3 分钟列式时间！
      </text>
    </g>
  </g>
</svg>

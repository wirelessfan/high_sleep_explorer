<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 574" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">斜面受力 · 统一坐标与分力方向</title>
<desc id="desc">F 图示向上；重力沿斜面分量向下。接触面无摩擦，分力只用于计算。。动画与静态图使用相同物理模型；减少动态效果时显示静态示意。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style>
<g transform="scale(1.4)">
<rect x="0" y="0" width="640" height="410" rx="12" fill="#fdfcf7" stroke="#e7d8c4">
</rect>
<text x="24" y="28" fill="#1e293b" font-size="15" font-weight="800">斜面受力 · 统一坐标与分力方向</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#e7d8c4" stroke-width="1">
</line>
<rect x="370" y="55" width="246" height="307" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="384" y="77" fill="#475569" font-size="12" font-weight="600">取 +x 沿斜面向上，+y 垂直向外</text>
<text x="384" y="103" fill="#475569" font-size="12" font-weight="600">Gx = −mg sinθ（沿斜面向下）</text>
<text x="384" y="129" fill="#475569" font-size="12" font-weight="600">Gy = −mg cosθ（压向斜面）</text>
<text x="384" y="155" fill="#475569" font-size="12" font-weight="600">N = mg cosθ</text>
<text x="384" y="181" fill="#475569" font-size="12" font-weight="600">沿斜面：F − mg sinθ = ma</text>
<text x="384" y="207" fill="#475569" font-size="12" font-weight="600">连接体：M = m₁ + m₂</text>
<text x="384" y="233" fill="#475569" font-size="12" font-weight="600">a = [F − Mg sinθ] / M</text>
<text x="384" y="259" fill="#475569" font-size="12" font-weight="600">隔离 m₂：N₁₂ − m₂g sinθ = m</text>
<text x="384" y="277" fill="#475569" font-size="12" font-weight="600">₂a</text>
<path d="M 54.4263 277.5 L 305.5737 132.5 L 305.5737 277.5 Z" stroke="#475569" stroke-width="2" fill="#f1f5f9">
</path>
<text x="55" y="295" fill="#475569" font-size="12" font-weight="500">θ = 30°；光滑斜面</text>
<path d="M 117.5648 194.859 L 159.134 170.859 L 179.134 205.5 L 137.5648 229.5 Z" stroke="#d97706" stroke-width="1.6" fill="#fef3c7">
</path>
<path d="M 159.134 170.859 L 200.7032 146.859 L 220.7032 181.5 L 179.134 205.5 Z" stroke="#d97706" stroke-width="1.6" fill="#dbeafe">
</path>
<circle cx="170" cy="187.6795" r="3" fill="#dc2626">
</circle>
<path d="M 170 187.6795 L 170 247.6795 M 167 241.6795 L 170 247.6795 L 173 241.6795" stroke="#dc2626" stroke-width="2.3" fill="none">
</path>
<text x="175" y="247.6795" fill="#dc2626" font-size="12" font-weight="700">G = mg</text>
<path d="M 170 187.6795 L 144.0192 142.6795 M 149.6173 146.3756 L 144.0192 142.6795 L 144.4212 149.3756" stroke="#059669" stroke-width="2.3" fill="none">
</path>
<text x="149.0192" y="142.6795" fill="#059669" font-size="12" font-weight="700">N</text>
<path d="M 170 187.6795 L 211.5692 163.6795 M 207.8731 169.2776 L 211.5692 163.6795 L 204.8731 164.0814" stroke="#2563eb" stroke-width="2.3" fill="none">
</path>
<text x="216.5692" y="163.6795" fill="#2563eb" font-size="12" font-weight="700">F（沿斜面向上）</text>
<path d="M 170 187.6795 L 144.0192 202.6795 M 147.7154 197.0814 L 144.0192 202.6795 L 150.7154 202.2776" stroke="#dc2626" stroke-width="1.2" fill="none">
</path>
<text x="109.0192" y="214.6795" fill="#dc2626" font-size="12" font-weight="700">mg sinθ</text>
<path d="M 170 187.6795 L 195.9808 232.6795 M 190.3827 228.9833 L 195.9808 232.6795 L 195.5788 225.9833" stroke="#dc2626" stroke-width="1.2" fill="none">
</path>
<text x="160.9808" y="244.6795" fill="#dc2626" font-size="12" font-weight="700">mg cosθ</text>
<rect x="20" y="370" width="600" height="21" rx="5" fill="#eff6ff" stroke="#bfdbfe">
</rect>
<text x="320" y="383" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">F 图示向上；重力沿斜面分量向下。接触面无摩擦，分力只用于计算。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridCurveAnim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowCurve" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>

    <style>
      /* 小球沿抛物线轨迹运动动画 */
      @keyframes flyAlongTrajectory {
        0% {
          transform: translate(60px, 60px) rotate(0deg);
        }
        25% {
          transform: translate(110px, 75px) rotate(16deg);
        }
        50% {
          transform: translate(160px, 110px) rotate(32deg);
        }
        75% {
          transform: translate(210px, 165px) rotate(48deg);
        }
        100% {
          transform: translate(250px, 225px) rotate(60deg);
        }
      }

      /* 竖直分速度 vy 随时间拉长 */
      @keyframes vyGrow {
        0% { transform: scaleY(0.1); }
        50% { transform: scaleY(0.65); }
        100% { transform: scaleY(1.3); }
      }

      /* 脉冲红点提示 */
      @keyframes pulseCurve {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }

      .projectile-ball {
        animation: flyAlongTrajectory 3.2s cubic-bezier(0.3, 0, 0.7, 1) infinite;
      }
      .vy-vector {
        transform-origin: 0 0;
        animation: vyGrow 3.2s cubic-bezier(0.3, 0, 0.7, 1) infinite;
      }
      .pulse-tag {
        animation: pulseCurve 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- 背景信纸 -->
  <rect width="640" height="380" rx="14" fill="#fdfcf7" filter="url(#shadowCurve)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridCurveAnim)"/>

  <!-- 顶部标签胶带 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(59, 130, 246, 0.28)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">
    ★ 曲线运动动态模拟 · 平抛与切线速度偏转
  </text>

  <!-- 左侧：动态轨迹模拟区域 -->
  <g transform="translate(30, 50)">
    <rect width="280" height="300" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <!-- 顶部动态指示 -->
    <circle cx="25" cy="22" r="5" fill="#3b82f6" class="pulse-tag"/>
    <text x="36" y="26" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#1d4ed8">
      切线速度实时动态偏转中
    </text>

    <!-- 坐标系 -->
    <!-- y 轴向右、x 轴向下 (平抛坐标系) -->
    <line x1="55" y1="55" x2="265" y2="55" stroke="#64748b" stroke-width="2"/>
    <path d="M 260 52 L 268 55 L 260 58 Z" fill="#64748b"/>
    <text x="268" y="58" font-family="sans-serif" font-size="12" font-weight="800" fill="#334155">+x</text>

    <line x1="55" y1="55" x2="55" y2="245" stroke="#64748b" stroke-width="2"/>
    <path d="M 52 240 L 55 248 L 58 240 Z" fill="#64748b"/>
    <text x="46" y="255" font-family="sans-serif" font-size="12" font-weight="800" fill="#334155">+y</text>

    <!-- 抛物线轨迹 (二次曲线) -->
    <path d="M 60 60 Q 140 60, 180 125 T 255 235" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="145" y="100" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#60a5fa">抛物线轨迹</text>

    <!-- 动态飞行的带矢量小球组件 -->
    <g class="projectile-ball">
      <!-- 质点小球 -->
      <circle cx="0" cy="0" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

      <!-- 实时切线合速度矢量 v (红色箭头，随角度切向偏转) -->
      <line x1="0" y1="0" x2="36" y2="0" stroke="#dc2626" stroke-width="2.8"/>
      <path d="M 32 -4 L 40 0 L 32 4 Z" fill="#dc2626"/>
      <text x="42" y="4" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626">v (切线)</text>

      <!-- 水平分速度 vx (蓝色恒定虚线) -->
      <line x1="0" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="2,2"/>
      <!-- 竖直分速度 vy (绿色向下分力) -->
      <line x1="26" y1="0" x2="26" y2="18" stroke="#059669" stroke-width="1.6" stroke-dasharray="2,2"/>
    </g>

    <!-- 底部口诀说明卡 -->
    <rect x="15" y="255" width="250" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="140" y="275" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">
      ★ 切线定理：曲线运动速度永远沿切线方向！
    </text>
  </g>

  <!-- 右侧：运动分解与高考秒杀二级结论 -->
  <g transform="translate(325, 50)">
    <rect width="285" height="300" rx="10" fill="#ffffff" stroke="#e6d5be" stroke-width="1.5"/>

    <text x="18" y="28" font-family="'PingFang SC',sans-serif" font-size="13.5" font-weight="900" fill="#0f172a">
      【平抛运动 · 正交分解与秒杀】
    </text>

    <!-- 水平分解 -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#eff6ff"/>
      <text x="40" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">水平分运动</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        不受外力：<tspan fill="#2563eb" font-weight="800">匀速直线运动</tspan>
      </text>
      <text x="0" y="56" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#1d4ed8">
        vx = v₀ (恒定不变)　x = v₀·t
      </text>
    </g>

    <line x1="18" y1="120" x2="266" y2="120" stroke="#f1e5d4" stroke-width="1"/>

    <!-- 竖直分解 -->
    <g transform="translate(18, 130)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#fef2f2"/>
      <text x="40" y="14" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">竖直分运动</text>
      <text x="0" y="38" font-family="'PingFang SC',sans-serif" font-size="12" fill="#334155">
        只受重力：<tspan fill="#dc2626" font-weight="800">自由落体运动</tspan>
      </text>
      <text x="0" y="56" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#b91c1c">
        vy = g·t (均匀加速)　y = ½g·t²
      </text>
    </g>

    <!-- 底部高考秒杀二级结论 -->
    <g transform="translate(18, 208)">
      <rect x="0" y="0" width="248" height="74" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="1.2"/>
      <text x="124" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#854d0e" text-anchor="middle">
        ★ 高考双倍角秒杀推论：
      </text>
      <text x="124" y="44" font-family="'Courier New',sans-serif" font-size="13" font-weight="900" fill="#713f12" text-anchor="middle">
        tanθ = 2·tanα
      </text>
      <text x="124" y="62" font-family="'PingFang SC',sans-serif" font-size="11" fill="#854d0e" text-anchor="middle">
        （速度与水平夹角正切 = 2倍位移夹角正切）
      </text>
    </g>
  </g>
</svg>

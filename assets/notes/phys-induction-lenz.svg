<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 574" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">楞次定律 · 判断流程与适用条件</title>
<desc id="desc">“增缩减扩”不可泛用于所有磁通量变化；固定刚性线圈的面积不会因此改变。。动画与静态图使用相同物理模型；减少动态效果时显示静态示意。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style>
<g transform="scale(1.4)">
<rect x="0" y="0" width="640" height="410" rx="12" fill="#fdfcf7" stroke="#e7d8c4">
</rect>
<text x="24" y="28" fill="#1e293b" font-size="15" font-weight="800">楞次定律 · 判断流程与适用条件</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#e7d8c4" stroke-width="1">
</line>
<rect x="370" y="55" width="246" height="307" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="384" y="77" fill="#475569" font-size="12" font-weight="600">楞次定律阻碍的是磁通量变化</text>
<text x="384" y="103" fill="#475569" font-size="12" font-weight="600">并非总是阻碍原磁场</text>
<text x="384" y="129" fill="#475569" font-size="12" font-weight="600">ε = −N dΦ/dt</text>
<text x="384" y="155" fill="#475569" font-size="12" font-weight="600">闭合电阻回路：I = ε/R</text>
<text x="384" y="181" fill="#475569" font-size="12" font-weight="600">来拒去留：此类磁体与回路情景</text>
<text x="384" y="207" fill="#475569" font-size="12" font-weight="600">增缩减扩的使用条件：</text>
<text x="384" y="233" fill="#475569" font-size="12" font-weight="600">外磁场改变、回路可形变</text>
<text x="384" y="259" fill="#475569" font-size="12" font-weight="600">并需具体判断磁力的方向</text>
<rect x="35" y="70" width="310" height="48" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="50" y="89" fill="#2563eb" font-size="12" font-weight="700">1  原磁场</text>
<text x="50" y="107" fill="#475569" font-size="12" font-weight="500">明确原磁场和回路法线方向</text>
<rect x="35" y="130" width="310" height="48" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="50" y="149" fill="#d97706" font-size="12" font-weight="700">2  磁通量</text>
<text x="50" y="167" fill="#475569" font-size="12" font-weight="500">判断穿过回路的磁通量变化</text>
<rect x="35" y="190" width="310" height="48" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="50" y="209" fill="#dc2626" font-size="12" font-weight="700">3  感应磁场</text>
<text x="50" y="227" fill="#475569" font-size="12" font-weight="500">增反减同：阻碍变化</text>
<rect x="35" y="250" width="310" height="48" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="50" y="269" fill="#059669" font-size="12" font-weight="700">4  感应电流</text>
<text x="50" y="287" fill="#475569" font-size="12" font-weight="500">右手螺旋定则确定电流方向</text>
<rect x="20" y="370" width="600" height="21" rx="5" fill="#eff6ff" stroke="#bfdbfe">
</rect>
<text x="320" y="383" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">“增缩减扩”不可泛用于所有磁通量变化；固定刚性线圈的面积不会因此改变。</text>
</g>
</svg>

<text x="298" y="378" font-size="14" fill="#172b42" text-anchor="start" font-weight="700">仍单调递增（不变号）</text>
<circle cx="401" cy="300" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="401" y="322" font-size="13" fill="#50647a" text-anchor="middle" font-weight="500">0（不变号）</text>
<text x="298" y="408" font-size="14" fill="#dc2626" text-anchor="start" font-weight="500">符号：0</text>
<rect x="540" y="82" width="238" height="398" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="556" y="110" font-size="17" fill="#047857" text-anchor="start" font-weight="700">a &gt; 0</text>
<text x="556" y="134" font-size="13" fill="#50647a" text-anchor="start" font-weight="500">f′(x) = (x−1)(x+1)</text>
<line x1="564" y1="300" x2="754" y2="300" stroke="#50647a" stroke-width="1.8"/>
<line x1="659" y1="240" x2="659" y2="360" stroke="#50647a" stroke-width="1.8"/>
<path d="M 599.55 327.12158 L 601 328.03125 L 602.45 328.91846 L 603.9 329.7832 L 605.35 330.62549 L 606.8 331.44531 L 608.25 332.24268 L 609.7 333.01758 L 611.15 333.77002 L 612.6 334.5 L 614.05 335.20752 L 615.5 335.89258 L 616.95 336.55518 L 618.4 337.19531 L 619.85 337.81299 L 621.3 338.4082 L 622.75 338.98096 L 624.2 339.53125 L 625.65 340.05908 L 627.1 340.56445 L 628.55 341.04736 L 630 341.50781 L 631.45 341.9458 L 632.9 342.36133 L 634.35 342.75439 L 635.8 343.125 L 637.25 343.47314 L 638.7 343.79883 L 640.15 344.10205 L 641.6 344.38281 L 643.05 344.64111 L 644.5 344.87695 L 645.95 345.09033 L 647.4 345.28125 L 648.85 345.44971 L 650.3 345.5957 L 651.75 345.71924 L 653.2 345.82031 L 654.65 345.89893 L 656.1 345.95508 L 657.55 345.98877 L 659 346 L 660.45 345.98877 L 661.9 345.95508 L 663.35 345.89893 L 664.8 345.82031 L 666.25 345.71924 L 667.7 345.5957 L 669.15 345.44971 L 670.6 345.28125 L 672.05 345.09033 L 673.5 344.87695 L 674.95 344.64111 L 676.4 344.38281 L 677.85 344.10205 L 679.3 343.79883 L 680.75 343.47314 L 682.2 343.125 L 683.65 342.75439 L 685.1 342.36133 L 686.55 341.9458 L 688 341.50781 L 689.45 341.04736 L 690.9 340.56445 L 692.35 340.05908 L 693.8 339.53125 L 695.25 338.98096 L 696.7 338.4082 L 698.15 337.81299 L 699.6 337.19531 L 701.05 336.55518 L 702.5 335.89258 L 703.95 335.20752 L 705.4 334.5 L 706.85 333.77002 L 708.3 333.01758 L 709.75 332.24268 L 711.2 331.44531 L 712.65 330.62549 L 714.1 329.7832 L 715.55 328.91846 L 717 328.03125" fill="none" stroke="#dc2626" stroke-width="2.8" />
<text x="556" y="378" font-size="14" fill="#172b42" text-anchor="start" font-weight="700">增—减—增</text>
<circle cx="601" cy="300" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<circle cx="717" cy="300" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="601" y="322" font-size="13" fill="#50647a" text-anchor="middle" font-weight="500">−1</text>
<text x="717" y="322" font-size="13" fill="#50647a" text-anchor="middle" font-weight="500">+1</text>
<text x="556" y="408" font-size="14" fill="#dc2626" text-anchor="start" font-weight="500">符号：+−+</text>
<text x="24" y="510" font-size="14" fill="#50647a" text-anchor="start" font-weight="500">含参题的固定动作：先求 f′(x)，再令 f′(x)=0，最后按参数取值讨论根是否存在、是否落在定义域内。</text>
  <rect x="24" y="498" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="518" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">不要默认 f′(x)=0 一定有解；a&lt;0 时无解，函数在整个定义域上单调。</text>
</svg>

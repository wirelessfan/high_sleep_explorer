<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" role="img" aria-labelledby="title description">
  <title id="title">含参单调性：先讨论参数，再写区间</title>
  <desc id="description">同一道题里 a 的符号不同，导数的零点个数就不同，单调区间必须分类写出。。不要默认 f′(x)=0 一定有解；a&lt;0 时无解，函数在整个定义域上单调。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="560" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">含参单调性：先讨论参数，再写区间</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">同一道题里 a 的符号不同，导数的零点个数就不同，单调区间必须分类写出。</text>
  <rect x="24" y="82" width="238" height="398" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="40" y="110" font-size="17" fill="#047857" text-anchor="start" font-weight="700">a &lt; 0</text>
<text x="40" y="134" font-size="13" fill="#50647a" text-anchor="start" font-weight="500">f′(x) = x² − a &gt; 0 恒成立</text>
<line x1="48" y1="300" x2="238" y2="300" stroke="#50647a" stroke-width="1.8"/>
<line x1="143" y1="240" x2="143" y2="360" stroke="#50647a" stroke-width="1.8"/>

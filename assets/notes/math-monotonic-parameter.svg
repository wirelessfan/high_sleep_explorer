<text x="40" y="378" font-size="14" fill="#172b42" text-anchor="start" font-weight="700">在 R 上单调递增</text>
<text x="40" y="408" font-size="14" fill="#dc2626" text-anchor="start" font-weight="500">符号：+</text>
<rect x="282" y="82" width="238" height="398" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="298" y="110" font-size="17" fill="#047857" text-anchor="start" font-weight="700">a = 0</text>
<text x="298" y="134" font-size="13" fill="#50647a" text-anchor="start" font-weight="500">f′(x) = x² ≥ 0，仅 x=0 处为 0</text>
<line x1="306" y1="300" x2="496" y2="300" stroke="#50647a" stroke-width="1.8"/>
<line x1="401" y1="240" x2="401" y2="360" stroke="#50647a" stroke-width="1.8"/>

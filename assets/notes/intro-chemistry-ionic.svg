<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">离子反应：从溶液离子到沉淀</title>
  <desc id="description">粒子图只示意结合与沉降；不代表真实晶格或离子大小。。离子反应也包括难溶物与酸反应、氧化还原等；反应式须核对原子和电荷守恒。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">离子反应：从溶液离子到沉淀</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">粒子图只示意结合与沉降；不代表真实晶格或离子大小。</text>
  <rect x="24" y="82" width="352" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<rect x="396" y="82" width="380" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<path d="M 72 113 L 72 333 Q72 347 87 347 L 313 347 Q328 347 328 333 L328 113" fill="none" stroke="#50647a" stroke-width="2" />
<line x1="75" y1="145" x2="325" y2="145" stroke="#90b6dd" stroke-width="1" stroke-dasharray="5 4"/>
<g class="motion">
<g transform="translate(125 200)">
<g transform="translate(0 0)">
<animateTransform attributeName="transform" type="translate" values="0 0;62 13;62 40;62 111;0 0" keyTimes="0;0.35;0.55;0.8;1" dur="7s" calcMode="linear" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="22" fill="#f1f6fa" stroke="#dc2626" stroke-width="1.5"/>
<text x="0" y="5" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Ba²⁺</text>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.55;0.8;1" dur="7s" calcMode="linear" repeatCount="indefinite"/>
</g>
</g>
<g transform="translate(275 200)">
<g transform="translate(0 0)">
<animateTransform attributeName="transform" type="translate" values="0 0;-62 13;-62 40;-62 111;0 0" keyTimes="0;0.35;0.55;0.8;1" dur="7s" calcMode="linear" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="22" fill="#f1f6fa" stroke="#2563eb" stroke-width="1.5"/>
<text x="0" y="5" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">SO₄²⁻</text>
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.55;0.8;1" dur="7s" calcMode="linear" repeatCount="indefinite"/>
</g>
</g>
<g transform="translate(200 213)" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.55;0.8;1" dur="7s" calcMode="linear" repeatCount="indefinite"/>
<g transform="translate(0 0)">
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 27;0 107;0 0" keyTimes="0;0.35;0.55;0.8;1" dur="7s" repeatCount="indefinite"/>
<rect x="-55" y="-16" width="110" height="32" rx="10" fill="#fff" stroke="#aebdc5"/>
<text x="0" y="6" font-size="16" fill="#047857" text-anchor="middle" font-weight="700">BaSO₄(s)</text>
</g>
</g>
</g>
<g class="still">
<circle cx="125" cy="200" r="22" fill="#f1f6fa" stroke="#dc2626" stroke-width="1.5"/>
<text x="125" y="205" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="500">Ba²⁺</text>
<circle cx="275" cy="200" r="22" fill="#f1f6fa" stroke="#2563eb" stroke-width="1.5"/>
<text x="275" y="205" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="500">SO₄²⁻</text>
<rect x="147" y="310" width="106" height="30" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="200" y="331" font-size="16" fill="#047857" text-anchor="middle" font-weight="500">BaSO₄(s)</text>
</g>
<text x="200" y="375" font-size="15" fill="#50647a" text-anchor="middle" font-weight="500">离子结合后以难溶固体表示</text>
<text x="410" y="117" font-size="16" fill="#047857" text-anchor="start" font-weight="500">Ba²⁺ + SO₄²⁻ = BaSO₄↓</text>
<text x="410" y="163" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">反应前：离子在水溶液中</text>
<text x="410" y="203" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">反应后：形成白色难溶固体</text>
<text x="410" y="247" font-size="16" fill="#2563eb" text-anchor="start" font-weight="500">能拆：溶液中的易溶强电解质</text>
<text x="410" y="281" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">不拆：难溶物、弱电解质、气体</text>
<text x="410" y="328" font-size="16" fill="#047857" text-anchor="start" font-weight="500">澄清石灰水：Ca²⁺ + 2OH⁻</text>
<text x="410" y="366" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">石灰乳参与反应：保留 Ca(OH)₂</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">离子反应也包括难溶物与酸反应、氧化还原等；反应式须核对原子和电荷守恒。</text>
</svg>

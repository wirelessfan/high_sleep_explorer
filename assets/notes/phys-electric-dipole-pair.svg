<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <pattern id="gridPair" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowPair" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="380" rx="14" fill="#fdfbf7" filter="url(#shadowPair)"/>
  <rect width="640" height="380" rx="14" fill="url(#gridPair)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(14, 165, 233, 0.28)" rx="3" transform="rotate(-0.4 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">
    ★ 高考核心对比 · 等量异种 vs 等量同种电荷场
  </text>

  <g transform="translate(30, 48)">
    <rect width="580" height="305" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 左半区：等量异种电荷 (+Q 与 -Q) -->
    <g transform="translate(15, 12)">
      <rect width="265" height="235" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="132" y="22" font-family="'PingFang SC',sans-serif" font-size="12.5" font-weight="900" fill="#0284c7" text-anchor="middle">
        【模型 A】等量异种电荷 (+Q, −Q)
      </text>

      <!-- 异种电荷图形区 -->
      <g transform="translate(0, 10)">
        <!-- 中垂线零势面 -->
        <line x1="132" y1="30" x2="132" y2="150" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,2"/>
        <text x="132" y="25" font-family="sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">φ = 0 (零势面)</text>

        <!-- 电场线 (连线及上弧、下弧) -->
        <line x1="68" y1="90" x2="196" y2="90" stroke="#f59e0b" stroke-width="2"/>
        <path d="M 134 87 L 140 90 L 134 93 Z" fill="#f59e0b"/>

        <path d="M 64 80 C 80 45, 184 45, 200 80" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 129 55 L 135 56 L 131 60 Z" fill="#f59e0b"/>

        <path d="M 64 100 C 80 135, 184 135, 200 100" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 129 125 L 135 124 L 131 120 Z" fill="#f59e0b"/>

        <!-- 两电荷球 -->
        <circle cx="58" cy="90" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="58" y="95" font-family="sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>

        <circle cx="206" cy="90" r="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="206" y="95" font-family="sans-serif" font-size="14" font-weight="900" fill="#2563eb" text-anchor="middle">−</text>
      </g>

      <!-- 核心考点总结 -->
      <g transform="translate(14, 165)">
        <text x="0" y="12" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">• 连线中点：场强 E 最小但 E ≠ 0，φ = 0</text>
        <text x="0" y="30" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">• 中垂线上：处处 φ = 0，E 水平向右</text>
        <text x="0" y="48" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#dc2626">• 沿连线顺场线移动：电势由高到低持续下降</text>
      </g>
    </g>

    <!-- 右半区：等量同种电荷 (+Q 与 +Q) -->
    <g transform="translate(300, 12)">
      <rect width="265" height="235" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="132" y="22" font-family="'PingFang SC',sans-serif" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">
        【模型 B】等量同种电荷 (+Q, +Q)
      </text>

      <!-- 同种电荷图形区 -->
      <g transform="translate(0, 10)">
        <!-- 中垂线 -->
        <line x1="132" y1="30" x2="132" y2="150" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,2"/>
        <!-- 中点 E = 0 标记 -->
        <circle cx="132" cy="90" r="4" fill="#dc2626"/>
        <text x="132" y="105" font-family="sans-serif" font-size="10" font-weight="900" fill="#dc2626" text-anchor="middle">E中 = 0</text>

        <!-- 互相排斥的向外弯曲电场线 -->
        <!-- 左电荷向上弯曲 -->
        <path d="M 64 80 C 85 60, 110 50, 115 30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 112 40 L 115 32 L 117 40 Z" fill="#f59e0b"/>
        <!-- 右电荷向上弯曲 -->
        <path d="M 200 80 C 179 60, 154 50, 149 30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 152 40 L 149 32 L 147 40 Z" fill="#f59e0b"/>

        <!-- 向下弯曲对称电场线 -->
        <path d="M 64 100 C 85 120, 110 130, 115 150" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 112 140 L 115 148 L 117 140 Z" fill="#f59e0b"/>
        <path d="M 200 100 C 179 120, 154 130, 149 150" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <path d="M 152 140 L 149 148 L 147 140 Z" fill="#f59e0b"/>

        <!-- 两电荷球 (均为正) -->
        <circle cx="58" cy="90" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="58" y="95" font-family="sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>

        <circle cx="206" cy="90" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="206" y="95" font-family="sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>
      </g>

      <!-- 核心考点总结 -->
      <g transform="translate(14, 165)">
        <text x="0" y="12" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">• 连线中点：场强严格为零 (E = 0)，电势 φ &gt; 0</text>
        <text x="0" y="30" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">• 中垂线上：由中点向两侧，场强先增大后减小</text>
        <text x="0" y="48" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#b45309">• 电势特征：中点是中垂线最高点、连线最低点！</text>
      </g>
    </g>

    <!-- 底部口诀对照栏 -->
    <rect x="15" y="258" width="550" height="34" rx="6" fill="#fef9c3" stroke="#fde047"/>
    <text x="290" y="274" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#854d0e" text-anchor="middle">
      高考选择题秒杀口诀：异种电荷中垂面「电势为零」，同种电荷连线中点「场强为零」！
    </text>
    <text x="290" y="287" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#a16207" text-anchor="middle">
      做题先画中垂线与连线中点，牢记 E 与 φ 的两类对称性，5 秒排除干扰项！
    </text>
  </g>
</svg>

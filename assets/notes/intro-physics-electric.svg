<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroElec" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <style>
      /* 涟漪等势面呼吸动画 */
      @keyframes rippleWave {
        0% { r: 18px; opacity: 1; }
        100% { r: 68px; opacity: 0; }
      }
      @keyframes fieldPulse {
        0%, 100% { stroke-width: 2.5; opacity: 0.85; }
        50% { stroke-width: 1.5; opacity: 0.45; }
      }
      .anim-ripple {
        animation: rippleWave 3s ease-out infinite;
      }
      .anim-field-ray {
        animation: fieldPulse 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fffdf9"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroElec)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(14, 165, 233, 0.25)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#0369a1" text-anchor="middle">
    ⚡ 静电场动态引导 · 场强与等势涟漪面
  </text>

  <!-- 左侧：正负电荷动态场图模型 -->
  <g transform="translate(140, 105)">
    <!-- 动态呼吸的等势面涟漪波纹 -->
    <circle class="anim-ripple" cx="-65" cy="0" r="25" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="-65" cy="0" r="38" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- 电场线 (带箭头实线) -->
    <g class="anim-field-ray">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M 0 -3.5 L 7 0 L 0 3.5 Z" fill="#f59e0b"/>

      <path d="M -56 -10 C -30 -45, 30 -45, 56 -10" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 0 -38 L 7 -37 L 1 -33 Z" fill="#f59e0b"/>

      <path d="M -56 10 C -30 45, 30 45, 56 10" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 0 38 L 7 37 L 1 33 Z" fill="#f59e0b"/>
    </g>

    <!-- 中垂面 (零势面) -->
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#059669" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="-70" font-family="'PingFang SC',sans-serif" font-size="9.5" font-weight="800" fill="#047857" text-anchor="middle">中垂零势面 (φ = 0)</text>

    <!-- 正电荷 -->
    <circle cx="-65" cy="0" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
    <text x="-65" y="5" font-family="sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>

    <!-- 负电荷 -->
    <circle cx="65" cy="0" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="65" y="5" font-family="sans-serif" font-size="16" font-weight="900" fill="#2563eb" text-anchor="middle">−</text>
  </g>

  <!-- 右侧：静电场核心法则卡 -->
  <g transform="translate(340, 42)">
    <rect width="270" height="135" rx="8" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#0369a1">
      【静电场四大判断铁律】
    </text>

    <text x="14" y="48" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1e293b">
      ① 始于正电荷，终于负电荷（不闭合不相交）
    </text>
    <text x="14" y="70" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#dc2626">
      ② 顺着电场线方向，电势逐步降低！
    </text>
    <text x="14" y="92" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669">
      ③ 场线密处 E 大，场线与等势面处处垂直
    </text>
    <text x="14" y="116" font-family="'Courier New',sans-serif" font-size="11.5" font-weight="900" fill="#1d4ed8">
      定义式：E = F/q ｜ 匀强电场：E = U/d
    </text>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">
    电场力做功：W_AB = q·U_AB ＝ −ΔEp（电场力做正功，电势能一定减少！）
  </text>
</svg>

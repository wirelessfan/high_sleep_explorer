<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="title description">
  <title id="title">特殊角：一张表 + 一个圆</title>
  <desc id="description">单位圆上记坐标，表格里记数值；两组信息互相验证。。tan90° 不存在，因为 cos90°=0，分母为零。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="580" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">特殊角：一张表 + 一个圆</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">单位圆上记坐标，表格里记数值；两组信息互相验证。</text>
  <rect x="24" y="82" width="430" height="420" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="44" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">特殊角在单位圆上的坐标</text>
<line x1="64" y1="310" x2="414" y2="310" stroke="#50647a" stroke-width="1.6"/>
<line x1="239" y1="140" x2="239" y2="460" stroke="#50647a" stroke-width="1.6"/>
<circle cx="239" cy="310" r="150" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<line x1="239" y1="310" x2="389" y2="310" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="389" cy="310" r="4.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="405" y="315" font-size="12" fill="#172b42" text-anchor="start" font-weight="700">0°</text>
<line x1="239" y1="310" x2="368.90381" y2="235" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="368.90381" cy="235" r="4.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="382.76022" y="232" font-size="12" fill="#172b42" text-anchor="start" font-weight="700">30°</text>
<line x1="239" y1="310" x2="345.06602" y2="203.93398" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="345.06602" cy="203.93398" r="4.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="356.37973" y="197.62027" font-size="12" fill="#172b42" text-anchor="start" font-weight="700">45°</text>
<line x1="239" y1="310" x2="314" y2="180.09619" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="314" cy="180.09619" r="4.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="322" y="171.23978" font-size="12" fill="#172b42" text-anchor="start" font-weight="700">60°</text>
<line x1="239" y1="310" x2="239" y2="160" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="239" cy="160" r="4.5" fill="#dc2626" stroke="white" stroke-width="1.5"/>
<text x="239" y="149" font-size="12" fill="#172b42" text-anchor="middle" font-weight="700">90°</text>
<text x="239" y="336" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">O</text>
<text x="44" y="496" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">圆上点的坐标就是 (cosθ, sinθ)，与右侧表格一一对应。</text>
<rect x="474" y="82" width="302" height="420" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="494" y="112" font-size="16" fill="#047857" text-anchor="start" font-weight="700">0°—90° 取值表</text>
<text x="500" y="148" font-size="13" fill="#50647a" text-anchor="start" font-weight="700">角</text>
<text x="570" y="148" font-size="13" fill="#50647a" text-anchor="start" font-weight="700">sin</text>
<text x="650" y="148" font-size="13" fill="#50647a" text-anchor="start" font-weight="700">cos</text>
<text x="725" y="148" font-size="13" fill="#50647a" text-anchor="start" font-weight="700">tan</text>
<line x1="494" y1="198" x2="756" y2="198" stroke="#eef2f7" stroke-width="1"/>
<text x="500" y="184" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">0°</text>
<text x="570" y="184" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">0</text>
<text x="650" y="184" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">1</text>
<text x="725" y="184" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">0</text>
<line x1="494" y1="244" x2="756" y2="244" stroke="#eef2f7" stroke-width="1"/>
<text x="500" y="230" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">30°</text>
<text x="570" y="230" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">1/2</text>
<text x="650" y="230" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√3/2</text>
<text x="725" y="230" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√3/3</text>
<line x1="494" y1="290" x2="756" y2="290" stroke="#eef2f7" stroke-width="1"/>
<text x="500" y="276" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">45°</text>
<text x="570" y="276" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√2/2</text>
<text x="650" y="276" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√2/2</text>
<text x="725" y="276" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">1</text>
<line x1="494" y1="336" x2="756" y2="336" stroke="#eef2f7" stroke-width="1"/>
<text x="500" y="322" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">60°</text>
<text x="570" y="322" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√3/2</text>
<text x="650" y="322" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">1/2</text>
<text x="725" y="322" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">√3</text>
<line x1="494" y1="382" x2="756" y2="382" stroke="#eef2f7" stroke-width="1"/>
<text x="500" y="368" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">90°</text>
<text x="570" y="368" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">1</text>
<text x="650" y="368" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">0</text>
<text x="725" y="368" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">不存在</text>
<text x="494" y="448" font-size="12" fill="#dc2626" text-anchor="start" font-weight="500">记法：sin 0,1,2,3,4 开根除 2；cos 倒过来</text>
<text x="494" y="472" font-size="12" fill="#50647a" text-anchor="start" font-weight="500">30°、45°、60° 是最高频的三个角</text>
  <rect x="24" y="518" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="538" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">tan90° 不存在，因为 cos90°=0，分母为零。</text>
</svg>

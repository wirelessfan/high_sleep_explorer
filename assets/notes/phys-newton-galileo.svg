<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridGal2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowGal2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="320" rx="14" fill="#fdfbf7" filter="url(#shadowGal2)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridGal2)"/>

  <!-- 顶部标题标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(245, 158, 11, 0.25)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#92400e" text-anchor="middle" letter-spacing="1">
    ★ 物理思想实验 · 伽利略理想斜面实验
  </text>

  <!-- 主绘图区域 -->
  <g transform="translate(40, 50)">
    <!-- 白色底板 -->
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#ebd9c3" stroke-width="1.5"/>

    <!-- 地基剖面 -->
    <line x1="30" y1="180" x2="530" y2="180" stroke="#78716c" stroke-width="2.5"/>

    <!-- 等高 h 虚线 (y = 70) -->
    <line x1="40" y1="70" x2="520" y2="70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="490" y="65" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#d97706">等高 h 虚线</text>

    <!-- 左侧固定 45° 斜面: 从 (50, 70) 到 (160, 180) -->
    <path d="M 50 70 L 160 180" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

    <!-- 起点小球 (r=10，球心精准相切于斜面) -->
    <!-- 切点位于 (65, 85)，球心为 (65-7.07, 85-7.07) = (57.9, 77.9) -->
    <circle cx="58" cy="78" r="10" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <text x="58" y="58" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">静止释放</text>

    <!-- 右侧斜面 1 (陡斜面 45°，精准对称): 从 (160, 180) 到 (270, 70) -->
    <path d="M 160 180 L 270 70" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 小球 1 (r=8，精准切于斜面 1，切点 (258, 82)，球心 (263.7, 76.3)) -->
    <circle cx="264" cy="76" r="8" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
    <text x="272" y="62" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#475569">① 达等高 h</text>

    <!-- 右侧斜面 2 (缓斜面，长 220 高 110): 从 (160, 180) 到 (380, 70) -->
    <path d="M 160 180 L 380 70" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
    <!-- 小球 2 (r=8，精准切于缓斜面，切点 (360, 80)，球心 (363.6, 72.8)) -->
    <circle cx="364" cy="73" r="8" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
    <text x="368" y="62" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#475569">② 倾角减小，路程更长</text>

    <!-- 右侧水平段 (完全水平极限，小球永远匀速运动) -->
    <path d="M 160 180 L 520 180" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 515 176 L 525 180 L 515 184 Z" fill="#dc2626"/>

    <!-- 水平段小球 (r=8，球心严格在 y=172，底缘切于 y=180 地面，无缝贴合) -->
    <circle cx="430" cy="172" r="8" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <!-- 速度矢量箭头 -->
    <line x1="438" y1="172" x2="475" y2="172" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M 470 169 L 477 172 L 470 175 Z" fill="#dc2626"/>
    <text x="475" y="164" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626">v 恒定</text>
    <text x="360" y="202" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#b91c1c">
      ③ 水平放置：小球将以恒定速度永远滚下去！
    </text>

    <!-- 底部结论便签 -->
    <rect x="25" y="210" width="510" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="280" y="228" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">
      ★ 核心推论：力不是维持物体运动的原因，而是改变物体运动状态的原因！
    </text>
  </g>
</svg>

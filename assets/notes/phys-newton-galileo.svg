<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 574" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">伽利略斜面 · 等高与水平极限</title>
<desc id="desc">动画循环是重新释放，不在谷底停车或瞬间反向；斜面运动与水平匀速分情景展示。。动画与静态图使用相同物理模型；减少动态效果时显示静态示意。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style>
<g transform="scale(1.4)">
<rect x="0" y="0" width="640" height="410" rx="12" fill="#fdfcf7" stroke="#e7d8c4">
</rect>
<text x="24" y="28" fill="#1e293b" font-size="15" font-weight="800">伽利略斜面 · 等高与水平极限</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#e7d8c4" stroke-width="1">
</line>
<rect x="370" y="55" width="246" height="307" rx="5" fill="#fff" stroke="#e2e8f0">
</rect>
<text x="384" y="77" fill="#475569" font-size="12" font-weight="600">理想条件：无耗散，机械能守恒</text>
<text x="384" y="103" fill="#475569" font-size="12" font-weight="600">右侧两条斜面代表不同实验</text>
<text x="384" y="129" fill="#475569" font-size="12" font-weight="600">比较的是同一小球的球心高度</text>
<text x="384" y="155" fill="#475569" font-size="12" font-weight="600">上升到等高处时速度为零</text>
<text x="384" y="181" fill="#475569" font-size="12" font-weight="600">动画只演示左坡从静止下滑</text>
<text x="384" y="207" fill="#475569" font-size="12" font-weight="600">沿斜面速度逐渐增加</text>
<text x="384" y="233" fill="#475569" font-size="12" font-weight="600">水平面：合力为零，速度恒定</text>
<text x="384" y="259" fill="#475569" font-size="12" font-weight="600">圆球与各自轨道保持相切</text>
<path d="M 50 110 L 155 235 L 260 110" stroke="#475569" stroke-width="2.5" fill="none">
</path>
<path d="M 155 235 L 340 110" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
</path>
<line x1="35" y1="104.8545" x2="350" y2="104.8545" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3">
</line>
<text x="55" y="85" fill="#d97706" font-size="12" font-weight="500">相同球心高度 h</text>
<circle cx="253.8744" cy="104.8545" r="8" fill="#fca5a5" stroke="#dc2626">
</circle>
<circle cx="333.326" cy="104.8545" r="8" fill="#fca5a5" stroke="#dc2626">
</circle>
<text x="265" y="145" fill="#475569" font-size="12" font-weight="500">倾角越小</text>
<text x="265" y="162" fill="#475569" font-size="12" font-weight="500">上升路程越长</text>
<circle cx="56.1256" cy="104.8545" r="8" fill="#dc2626">
</circle>
<path d="M 56.1256 104.8545 L 56.1256 104.8545 M 56.1256 104.8545 L 56.1256 104.8545 L 56.1256 104.8545" stroke="#dc2626" fill="none" stroke-width="2">
</path>
<line x1="55" y1="300" x2="345" y2="300" stroke="#2563eb" stroke-width="2">
</line>
<text x="55" y="280" fill="#2563eb" font-size="12" font-weight="500">独立情景：水平面，无阻力</text>
<circle cx="65" cy="292" r="8" fill="#2563eb">
</circle>
<rect x="20" y="370" width="600" height="21" rx="5" fill="#eff6ff" stroke="#bfdbfe">
</rect>
<text x="320" y="383" fill="#1e40af" font-size="12" font-weight="600" text-anchor="middle">动画循环是重新释放，不在谷底停车或瞬间反向；斜面运动与水平匀速分情景展示。</text>
</g>
</svg>

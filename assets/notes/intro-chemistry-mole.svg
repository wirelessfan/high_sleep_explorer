<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroMole" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <style>
      /* 粒子光流向中心枢纽汇聚流动 */
      @keyframes flowToHub {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-flow-hub {
        stroke-dasharray: 6,4;
        animation: flowToHub 1.4s linear infinite;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fafdfb"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroMole)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(16, 185, 129, 0.28)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#065f46" text-anchor="middle">
    ⚡ 物质的量动态引导 · 微观与宏观换乘枢纽
  </text>

  <!-- 左侧：中心枢纽与三座桥梁动态流动模型 -->
  <g transform="translate(145, 105)">
    <!-- 中心枢纽容器 n -->
    <rect x="-35" y="-30" width="70" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
    <text x="0" y="-8" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="900" fill="#065f46" text-anchor="middle">万能枢纽</text>
    <text x="0" y="18" font-family="'Courier New',sans-serif" font-size="24" font-weight="900" fill="#047857" text-anchor="middle">n</text>

    <!-- 粒子数 N 桥梁 (左) -->
    <rect x="-125" y="-18" width="60" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="-95" y="4" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">粒子数 N</text>
    <line class="anim-flow-hub" x1="-65" y1="0" x2="-35" y2="0" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 宏观质量 m 桥梁 (顶) -->
    <rect x="-35" y="-80" width="70" height="32" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="0" y="-60" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">质量 m (g)</text>
    <line class="anim-flow-hub" x1="0" y1="-48" x2="0" y2="-30" stroke="#d97706" stroke-width="2.5"/>

    <!-- 气体体积 V 桥梁 (右) -->
    <rect x="65" y="-18" width="60" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="95" y="4" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">体积 V (L)</text>
    <line class="anim-flow-hub" x1="65" y1="0" x2="35" y2="0" stroke="#dc2626" stroke-width="2.5"/>
  </g>

  <!-- 右侧：三大换算定律卡 -->
  <g transform="translate(340, 42)">
    <rect width="270" height="135" rx="8" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <text x="14" y="24" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#065f46">
      【三大计算公式网络】
    </text>

    <text x="14" y="50" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#2563eb">
      • n = N / NA ｜ 数粒子找阿伏加德罗
    </text>
    <text x="14" y="74" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#d97706">
      • n = m / M  ｜ 称质量除以摩尔质量
    </text>
    <text x="14" y="98" font-family="'Courier New',sans-serif" font-size="12" font-weight="900" fill="#dc2626">
      • n = V / Vm ｜ 标况气体除以 22.4 L/mol
    </text>
    <text x="14" y="120" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#047857">
      稀释前后：c₁V₁ = c₂V₂（溶质 n 恒定不变）
    </text>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#15803d" text-anchor="middle">
    铁律：所有题目不管是质量、体积还是微粒数，第一时间全部换算成 n，题目迎刃而解！
  </text>
</svg>

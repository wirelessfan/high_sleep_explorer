<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" role="img" aria-labelledby="title description">
  <title id="title">同角三角函数：六边形一张图</title>
  <desc id="description">对角线互倒数、相邻相乘得下一个、阴影三角形是平方关系。。忘了公式就看图：三条对角线是倒数关系，三个阴影三角形是勾股关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="580" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">同角三角函数：六边形一张图</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">对角线互倒数、相邻相乘得下一个、阴影三角形是平方关系。</text>
  <rect x="24" y="82" width="752" height="430" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="44" y="112" font-size="15" fill="#047857" text-anchor="start" font-weight="700">六边形记忆法：对角线互倒数，相邻相乘得下一个</text>
<line x1="380" y1="140" x2="500" y2="185" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="500" y1="185" x2="560" y2="270" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="560" y1="270" x2="500" y2="355" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="500" y1="355" x2="380" y2="400" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="380" y1="400" x2="260" y2="355" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="260" y1="355" x2="380" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="380" y1="140" x2="500" y2="355" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="500" y1="185" x2="380" y2="400" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="560" y1="270" x2="260" y2="355" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="380" cy="270" r="18" fill="#fef9c3" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="275" font-size="16" fill="#b45309" text-anchor="middle" font-weight="800">1</text>
<circle cx="380" cy="140" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="145" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="800">sin</text>
<circle cx="500" cy="185" r="22" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
<text x="500" y="190" font-size="14" fill="#047857" text-anchor="middle" font-weight="800">cos</text>
<circle cx="560" cy="270" r="22" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="560" y="275" font-size="14" fill="#b45309" text-anchor="middle" font-weight="800">tan</text>
<circle cx="500" cy="355" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="500" y="360" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="800">cot</text>
<circle cx="380" cy="400" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="380" y="405" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="800">sec</text>
<circle cx="260" cy="355" r="22" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
<text x="260" y="360" font-size="14" fill="#0ea5e9" text-anchor="middle" font-weight="800">csc</text>
<text x="44" y="470" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">对角线：sin ↔ csc　cos ↔ sec　tan ↔ cot（互为倒数）</text>
<text x="44" y="496" font-size="13" fill="#172b42" text-anchor="start" font-weight="500">相邻乘：sin·tan = cos　cos·cot = sin　（沿顺时针）</text>
<text x="44" y="522" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">阴影三角形：sin² + cos² = 1　1 + tan² = sec²　1 + cot² = csc²</text>
  <rect x="24" y="518" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="538" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">忘了公式就看图：三条对角线是倒数关系，三个阴影三角形是勾股关系。</text>
</svg>

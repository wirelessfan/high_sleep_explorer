<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">氧化还原：得失电子与化合价</title>
  <desc id="description">以钠与氯气反应为例；图中 Cl 表示氯气中的一个氯原子。。氧化还原的本质是电子转移，也可表现为共用电子对偏移；图中不表示电子经典轨道。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">氧化还原：得失电子与化合价</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">以钠与氯气反应为例；图中 Cl 表示氯气中的一个氯原子。</text>
  <rect x="24" y="82" width="752" height="307" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<rect x="55" y="154" width="150" height="96" rx="10" fill="#edf4ff" stroke="#aac6ef"/>
<text x="130" y="190" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="700">Na → Na⁺</text>
<text x="130" y="224" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="500">失电子，被氧化</text>
<rect x="350" y="154" width="150" height="96" rx="10" fill="#fff0ed" stroke="#efb6ad"/>
<text x="425" y="190" font-size="21" fill="#dc2626" text-anchor="middle" font-weight="700">Cl → Cl⁻</text>
<text x="425" y="224" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="500">得电子，被还原</text>
<path d="M 180 148 Q 275 67 370 148" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<g class="motion">

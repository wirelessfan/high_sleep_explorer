<text x="276" y="93" font-size="15" fill="#b45309" text-anchor="middle" font-weight="500">e⁻ 转移方向</text>
<text x="276" y="286" font-size="22" fill="#172b42" text-anchor="middle" font-weight="700">2Na + Cl₂ = 2NaCl</text>
<text x="276" y="321" font-size="16" fill="#50647a" text-anchor="middle" font-weight="500">每个 Na 失 1e⁻，每个 Cl 得 1e⁻</text>
<text x="276" y="355" font-size="14" fill="#50647a" text-anchor="middle" font-weight="500">箭头示意电子转移，不表示实际飞行轨迹</text>
<line x1="535" y1="110" x2="535" y2="366" stroke="#cbdcd5" stroke-width="1"/>
<text x="558" y="137" font-size="18" fill="#2563eb" text-anchor="start" font-weight="500">还原剂：Na</text>
<text x="558" y="177" font-size="18" fill="#2563eb" text-anchor="start" font-weight="500">升价、失电子</text>
<text x="558" y="217" font-size="18" fill="#dc2626" text-anchor="start" font-weight="500">氧化剂：Cl₂</text>
<text x="558" y="257" font-size="18" fill="#dc2626" text-anchor="start" font-weight="500">降价、得电子</text>
<text x="558" y="307" font-size="18" fill="#047857" text-anchor="start" font-weight="500">得失电子总数</text>
<text x="558" y="340" font-size="18" fill="#047857" text-anchor="start" font-weight="500">均为 2e⁻</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">氧化还原的本质是电子转移，也可表现为共用电子对偏移；图中不表示电子经典轨道。</text>
</svg>

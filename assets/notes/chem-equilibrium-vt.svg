<path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
</marker>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f7fbf9"/>
  <text x="30" y="35" font-size="23" fill="#047857" text-anchor="start" font-weight="800">化学平衡：浓度扰动后的速率变化</text>
  <text x="30" y="62" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">以恒温恒容、正逆反应均为一级的 A ⇌ B 为例。</text>

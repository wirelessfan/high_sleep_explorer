<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img" aria-labelledby="title description">
  <title id="title">化学平衡：浓度扰动后的速率变化</title>
  <desc id="description">以恒温恒容、正逆反应均为一级的 A ⇌ B 为例。。升温通常使正逆速率同时突变；催化剂不会使平衡移动，压强效应需结合气体反应条件。</desc>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <pattern id="gridEq" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8f3ee" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowEq" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="14" fill="#fafdfb" filter="url(#shadowEq)"/>
  <rect width="640" height="320" rx="14" fill="url(#gridEq)"/>

  <!-- 顶部标签 -->
  <rect x="180" y="8" width="280" height="26" fill="rgba(16, 185, 129, 0.25)" rx="3" transform="rotate(-0.5 320 21)"/>
  <text x="320" y="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="1">
    ★ 化学平衡图像 · 速率-时间 (v-t) 移动规律
  </text>

  <g transform="translate(40, 50)">
    <rect width="560" height="245" rx="10" fill="#ffffff" stroke="#cde4d9" stroke-width="1.5"/>

    <!-- 坐标系 -->
    <!-- y 轴 (反应速率 v) -->
    <line x1="60" y1="210" x2="60" y2="35" stroke="#475569" stroke-width="2.5"/>
    <path d="M 56 40 L 60 30 L 64 40 Z" fill="#475569"/>
    <text x="45" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#1e293b">v</text>

    <!-- x 轴 (时间 t) -->
    <line x1="60" y1="210" x2="520" y2="210" stroke="#475569" stroke-width="2.5"/>
    <path d="M 515 206 L 525 210 L 515 214 Z" fill="#475569"/>
    <text x="525" y="215" font-family="sans-serif" font-size="13" font-weight="800" fill="#1e293b">t</text>

    <!-- t1 扰动时刻虚线 -->
    <line x1="220" y1="40" x2="220" y2="210" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="220" y="226" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" text-anchor="middle">t₁ (改变条件)</text>

    <!-- 平衡段 1 (0 -> t1) -->
    <line x1="60" y1="130" x2="220" y2="130" stroke="#059669" stroke-width="3"/>
    <text x="140" y="120" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">v正 = v逆 (平衡态Ⅰ)</text>

    <!-- 扰动：假设为升高温度(吸热反应)或增大反应物浓度 -->
    <!-- v正 瞬间突增 -->
    <line x1="220" y1="65" x2="250" y2="65" stroke="#dc2626" stroke-width="3"/>
    <!-- v正 随后随消耗下降 -->
    <path d="M 250 65 Q 320 85, 420 95 L 500 95" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="310" y="60" font-family="sans-serif" font-size="12" font-weight="800" fill="#dc2626">v'正 (正向变快)</text>

    <!-- v逆 瞬间不变或逐渐上升至新平衡 -->
    <path d="M 220 130 Q 300 115, 420 95 L 500 95" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="310" y="135" font-family="sans-serif" font-size="12" font-weight="800" fill="#2563eb">v'逆 (逐渐增大)</text>

    <!-- 新平衡态 2 (t2 之后) -->
    <line x1="420" y1="40" x2="420" y2="210" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="420" y="226" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" text-anchor="middle">t₂ (新平衡)</text>
    <text x="460" y="85" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#047857">新平衡态Ⅱ (v'正 = v'逆)</text>

    <!-- 右上角判别法则卡片 -->
    <g transform="translate(360, 15)">
      <rect width="180" height="60" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="90" y="20" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="900" fill="#166534" text-anchor="middle">勒夏特列法则：</text>
      <text x="90" y="38" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">改变条件，平衡必定朝向</text>
      <text x="90" y="52" font-family="'PingFang SC',sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">「减弱这种改变」的方向移动！</text>
    </g>
  </g>
</svg>

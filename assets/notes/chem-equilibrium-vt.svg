<text x="198" y="113" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">v正</text>
<text x="205" y="220" font-size="16" fill="#2563eb" text-anchor="start" font-weight="500">v逆</text>
<text x="118" y="176" font-size="15" fill="#047857" text-anchor="middle" font-weight="500">旧平衡</text>
<text x="190" y="326" font-size="16" fill="#50647a" text-anchor="middle" font-weight="500">t₁</text>
<text x="345" y="146" font-size="15" fill="#047857" text-anchor="start" font-weight="500">接近新平衡</text>
<text x="252" y="355" font-size="17" fill="#172b42" text-anchor="middle" font-weight="500">A ⇌ B（恒温、恒容）</text>
<rect x="470" y="104" width="288" height="264" rx="10" fill="#ffffff" stroke="#cbdcd5"/>
<text x="485" y="133" font-size="16" fill="#047857" text-anchor="start" font-weight="500">t₁：只增大 A 的浓度</text>
<text x="485" y="170" font-size="16" fill="#dc2626" text-anchor="start" font-weight="500">正反应速率瞬时增大</text>
<text x="485" y="206" font-size="16" fill="#2563eb" text-anchor="start" font-weight="500">逆反应速率瞬时不变</text>
<text x="485" y="242" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">随后 A 减少，B 增加</text>
<text x="485" y="278" font-size="16" fill="#172b42" text-anchor="start" font-weight="500">正逆速率逐渐接近</text>
<text x="485" y="314" font-size="16" fill="#047857" text-anchor="start" font-weight="500">新平衡：v正 = v逆 ≠ 0</text>
<text x="485" y="347" font-size="15" fill="#50647a" text-anchor="start" font-weight="500">并非反应停止或浓度相等</text>
  <rect x="24" y="398" width="752" height="49" rx="6" fill="#eaf5ef" stroke="#c6dfd1"/>
  <text x="400" y="418" font-size="14" fill="#047857" text-anchor="middle" font-weight="600">升温通常使正逆速率同时突变；催化剂不会使平衡移动，压强效应需结合气体反应条件。</text>
</svg>

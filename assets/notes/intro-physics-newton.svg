<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%">
  <defs>
    <pattern id="gridIntroNewt" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1e5d4" stroke-width="0.8"/>
    </pattern>
    <style>
      @keyframes blockSlide {
        0% { transform: translateX(40px); }
        100% { transform: translateX(380px); }
      }
      @keyframes pulseA {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      .anim-slider {
        animation: blockSlide 2.8s cubic-bezier(0.4, 0, 1, 1) infinite;
      }
      .pulse-acc {
        transform-origin: 520px 100px;
        animation: pulseA 1.6s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="640" height="240" rx="12" fill="#fffdf9"/>
  <rect width="640" height="240" rx="12" fill="url(#gridIntroNewt)"/>

  <!-- 顶部轻便签 -->
  <rect x="20" y="10" width="220" height="22" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
  <text x="130" y="25" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#1e40af" text-anchor="middle">
    ⚡ 牛顿定律动态引导 · F=ma 与受力分析
  </text>

  <!-- 左侧：运动滑块与动态受力 -->
  <g transform="translate(10, 30)">
    <!-- 水平导轨 -->
    <line x1="20" y1="120" x2="430" y2="120" stroke="#78716c" stroke-width="2.5"/>

    <!-- 动态滑块及其受力系统 -->
    <g class="anim-slider">
      <!-- 滑块实体 (严格贴合导轨表面 y=120) -->
      <rect x="0" y="80" width="48" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="24" y="105" font-family="sans-serif" font-size="14" font-weight="900" fill="#92400e" text-anchor="middle">m</text>
      <!-- 质心受力点 -->
      <circle cx="24" cy="100" r="3" fill="#dc2626"/>

      <!-- 推力 F (向右) -->
      <line x1="24" y1="100" x2="62" y2="100" stroke="#dc2626" stroke-width="2.6"/>
      <path d="M 56 96 L 64 100 L 56 104 Z" fill="#dc2626"/>
      <text x="56" y="92" font-family="sans-serif" font-size="11" font-weight="900" fill="#dc2626">F</text>

      <!-- 摩擦力 f (向左阻力) -->
      <line x1="24" y1="100" x2="-6" y2="100" stroke="#f59e0b" stroke-width="2"/>
      <path d="M -2 97 L -8 100 L -2 103 Z" fill="#f59e0b"/>
      <text x="-12" y="92" font-family="sans-serif" font-size="10" font-weight="800" fill="#d97706">f</text>

      <!-- 支持力 FN (向上) -->
      <line x1="24" y1="100" x2="24" y2="60" stroke="#059669" stroke-width="2"/>
      <path d="M 21 66 L 24 58 L 27 66 Z" fill="#059669"/>
      <text x="28" y="66" font-family="sans-serif" font-size="10" font-weight="900" fill="#059669">FN</text>

      <!-- 重力 G (向下) -->
      <line x1="24" y1="100" x2="24" y2="128" stroke="#475569" stroke-width="2"/>
      <path d="M 21 122 L 24 130 L 27 122 Z" fill="#475569"/>
    </g>
  </g>

  <!-- 右侧：牛二定律核心推论 -->
  <g class="pulse-acc" transform="translate(460, 48)">
    <rect width="160" height="120" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="80" y="30" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">合外力与加速度</text>
    <text x="80" y="65" font-family="'Courier New',sans-serif" font-size="22" font-weight="900" fill="#dc2626" text-anchor="middle">F合 = m·a</text>
    <text x="80" y="92" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">加速度与合外力同向</text>
    <text x="80" y="108" font-family="'PingFang SC',sans-serif" font-size="10" fill="#64748b" text-anchor="middle">力是改变状态的原因</text>
  </g>

  <!-- 底部核心结论条 -->
  <rect x="20" y="198" width="600" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
  <text x="320" y="215" font-family="'PingFang SC',sans-serif" font-size="11.5" font-weight="900" fill="#991b1b" text-anchor="middle">
    做题心法：先画重力支持力，再定摩擦与外力，求出合外力即得加速度 a！
  </text>
</svg>

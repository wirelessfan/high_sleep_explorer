<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="cLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cLiq2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#cBg)"/>

  <!-- 烧瓶 -->
  <g>
    <path d="M52 26h16v10l16 30a12 12 0 0 1-10.8 17.4H46.8A12 12 0 0 1 36 66l16-30z"
          fill="#fff" stroke="#0f766e" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 液体（倾斜表示平衡） -->
    <path d="M41.5 60h37l7.4 14a12 12 0 0 1-10.7 17.4H46.8A12 12 0 0 1 36 74z" fill="url(#cLiq)"/>
    <path d="M44 60h12l-6 14-9.4-6z" fill="url(#cLiq2)" opacity=".9"/>
    <!-- 液面波纹 -->
    <path d="M42 60q10-4 20 0t16 0" stroke="#a7f3d0" stroke-width="2" fill="none" opacity=".8"/>
    <!-- 瓶颈 -->
    <rect x="52" y="24" width="16" height="4" rx="2" fill="#0f766e"/>
  </g>

  <!-- 气泡 -->
  <g fill="#ecfdf5">
    <circle cx="56" cy="78" r="3.4"/>
    <circle cx="66" cy="84" r="2.6"/>
    <circle cx="62" cy="70" r="2.2"/>
    <circle cx="72" cy="74" r="1.8"/>
  </g>

  <!-- 平衡双向箭头 -->
  <g stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M22 52h18"/><path d="M26 47l-5 5 5 5"/>
    <path d="M80 52h18"/><path d="M94 47l5 5-5 5"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="20" cy="40" r="2.4" opacity=".7"/>
    <circle cx="100" cy="40" r="2.4" opacity=".7"/>
  </g>

  <!-- 温度计 -->
  <g transform="translate(96 78)">
    <rect x="-3.4" y="-16" width="6.8" height="24" rx="3.4" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
    <circle cy="10" r="5.4" fill="#ef4444"/>
    <rect x="-1.6" y="-2" width="3.2" height="12" rx="1.6" fill="#ef4444"/>
  </g>
</svg>

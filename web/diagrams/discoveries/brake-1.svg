<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">刹车与反应距离 · 情境图</title><desc id="desc">题目情境示意：汽车以20 m/s行驶，刹车加速度为−5 m/s²。刹车后6 s内的路程为： 速度在4秒降至零，4到6秒保持零；绿色三角形面积是路程。停车后不能延长直线算出“倒着走”。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="80" y1="265" x2="558" y2="265" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(558 265) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><line x1="95" y1="285" x2="95" y2="75" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(95 75) rotate(-90.0)" fill="none" stroke="#30483f" stroke-width="3"/><text x="575" y="273" fill="#30483f" font-size="15" text-anchor="middle">t/s</text><text x="140" y="78" fill="#30483f" font-size="15" text-anchor="middle">v/(m/s)</text><text x="95" y="290" fill="#30483f" font-size="15" text-anchor="middle">0</text><text x="383" y="290" fill="#30483f" font-size="15" text-anchor="middle">4</text><text x="527" y="290" fill="#30483f" font-size="15" text-anchor="middle">6</text><path d="M 95 265 V 109.0 L 383 265 Z" fill="#d9efe4" stroke="#28866b" stroke-width="1" stroke-linejoin="round"/><path d="M 95 109.0 L 383 265 H 527" fill="none" stroke="#3977ae" stroke-width="4" stroke-linejoin="round"/><text x="73" y="114.0" fill="#30483f" font-size="15" text-anchor="middle">20</text><text x="220" y="241" fill="#30483f" font-size="17" text-anchor="middle">路程 = 三角形面积</text><text x="460" y="239" fill="#3977ae" font-size="17" text-anchor="middle">已停住</text><text x="320" y="335" fill="#30483f" font-size="18" text-anchor="middle">同一辆车：4 s 停车，随后保持 v = 0</text></g></svg>

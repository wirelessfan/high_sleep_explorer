<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">刹车与反应距离 · 情境图</title><desc id="desc">题目情境示意：前车初速10 m/s，立即以2 m/s²减速；后车初速20 m/s，反应1 s后以5 m/s²减速，直至两车停下。若全程不接触，初距至少应大于多少？ 蓝线为后车，橙线为前车。绿色差面积是接近量；后车全程不慢于前车，故两车都停下时接近量最大。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="80" y1="265" x2="558" y2="265" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(558 265) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><line x1="95" y1="285" x2="95" y2="75" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(95 75) rotate(-90.0)" fill="none" stroke="#30483f" stroke-width="3"/><text x="575" y="273" fill="#30483f" font-size="15" text-anchor="middle">t/s</text><text x="140" y="78" fill="#30483f" font-size="15" text-anchor="middle">v/(m/s)</text><text x="95" y="290" fill="#30483f" font-size="15" text-anchor="middle">0</text><text x="167" y="290" fill="#30483f" font-size="15" text-anchor="middle">1</text><text x="455" y="290" fill="#30483f" font-size="15" text-anchor="middle">5</text><path d="M 95 109.0 H 167 L 455 265 L 95 187.0 Z" fill="#d9efe4" stroke="#28866b" stroke-width="1" stroke-linejoin="round"/><path d="M 95 109.0 H 167 L 455 265" fill="none" stroke="#3977ae" stroke-width="4" stroke-linejoin="round"/><path d="M 95 187.0 L 455 265" fill="none" stroke="#b96829" stroke-width="4" stroke-linejoin="round"/><text x="70" y="114.0" fill="#30483f" font-size="15" text-anchor="middle">20</text><text x="70" y="192.0" fill="#30483f" font-size="15" text-anchor="middle">10</text><text x="299" y="103" fill="#3977ae" font-size="17" text-anchor="middle">后车：先反应 1 s</text><text x="410" y="218" fill="#b96829" font-size="17" text-anchor="middle">前车：立即刹车</text><text x="320" y="322" fill="#30483f" font-size="17" text-anchor="middle">两曲线间面积 = 后车比前车多走的距离</text><text x="320" y="347" fill="#30483f" font-size="16" text-anchor="middle">后车始终更快或一样快：最近时刻在两车停下时</text></g></svg>

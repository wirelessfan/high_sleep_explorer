<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">刹车与反应距离 · 情境图</title><desc id="desc">题目情境示意：前车初速10 m/s，立即以2 m/s²减速；后车初速20 m/s，反应1 s后以5 m/s²减速，直至两车停下。若全程不接触，初距至少应大于多少？</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="105" y="165" width="100" height="38" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><path d="M 122 165 L 137 141 H 174 L 192 165" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><circle cx="129" cy="205" r="9" fill="#fff" stroke="#3977ae" stroke-width="2"/><circle cx="183" cy="205" r="9" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="155" y="245" fill="#30483f" font-size="17" text-anchor="middle">后车：20 m/s</text><rect x="435" y="165" width="100" height="38" rx="12" fill="#f9eadb" stroke="#a1beb0" stroke-width="2"/><path d="M 452 165 L 467 141 H 504 L 522 165" fill="none" stroke="#b96829" stroke-width="3" stroke-linejoin="round"/><circle cx="459" cy="205" r="9" fill="#fff" stroke="#b96829" stroke-width="2"/><circle cx="513" cy="205" r="9" fill="#fff" stroke="#b96829" stroke-width="2"/><text x="485" y="245" fill="#30483f" font-size="17" text-anchor="middle">前车：10 m/s</text><line x1="75" y1="215" x2="565" y2="215" stroke="#30483f" stroke-width="3"/><line x1="215" y1="250" x2="435" y2="250" stroke="#30483f" stroke-width="2" stroke-dasharray="7 6"/><text x="325" y="279" fill="#30483f" font-size="17" text-anchor="middle">起初相隔多远才不会碰到？</text><text x="168" y="103" fill="#3977ae" font-size="17" text-anchor="middle">先反应 1 s，再刹车</text><text x="480" y="103" fill="#b96829" font-size="17" text-anchor="middle">立即刹车</text><text x="320" y="320" fill="#30483f" font-size="17" text-anchor="middle">两辆车分别分段，再比较相对位置</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">等电子粒子 · 情境图</title><desc id="desc">题目情境示意：X⁺与Ne等电子，X的一种同位素质量数为23。元素及中子数为： X⁺有10个电子，所以中性X有11个电子、11个质子。质量数减质子数得到中子数，失电子不改变原子核。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><circle cx="170" cy="171" r="65" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="170" y="165" fill="#3977ae" font-size="23" text-anchor="middle">X⁺：10 e⁻</text><text x="170" y="198" fill="#30483f" font-size="17" text-anchor="middle">和 Ne 等电子</text><line x1="245" y1="171" x2="335" y2="171" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(335 171) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><rect x="355" y="118" width="215" height="105" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="462" y="155" fill="#30483f" font-size="18" text-anchor="middle">原子比 X⁺ 多 1 e⁻</text><text x="462" y="194" fill="#3977ae" font-size="23" text-anchor="middle">Z = 10 + 1</text><text x="320" y="281" fill="#30483f" font-size="21" text-anchor="middle">质量数 A = 质子数 Z + 中子数 N</text><text x="320" y="332" fill="#30483f" font-size="19" text-anchor="middle">失去电子改变电荷，不改变原子核</text></g></svg>

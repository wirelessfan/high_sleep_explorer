<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">等电子粒子 · 情境图</title><desc id="desc">题目情境示意：X⁺与Ne等电子，X的一种同位素质量数为23。元素及中子数为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><circle cx="210" cy="190" r="65" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="210" y="195" fill="#3977ae" font-size="28" text-anchor="middle">X⁺</text><circle cx="440" cy="190" r="65" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="440" y="195" fill="#3977ae" font-size="28" text-anchor="middle">Ne</text><text x="325" y="90" fill="#30483f" font-size="19" text-anchor="middle">“等电子”是一条线索</text><text x="325" y="295" fill="#30483f" font-size="19" text-anchor="middle">电子数 → 原子序数 → 中子数</text></g></svg>

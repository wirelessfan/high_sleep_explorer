<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">三角函数 · 情境图</title><desc id="desc">题目情境示意：sinα=3/5，α位于第二象限，则cosα与tanα分别为： 单位圆上的点位于第二象限：纵坐标sinα为正，横坐标cosα为负。先定符号再开平方。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="150" y1="195" x2="475" y2="195" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(475 195) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><line x1="300" y1="310" x2="300" y2="65" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(300 65) rotate(-90.0)" fill="none" stroke="#30483f" stroke-width="3"/><circle cx="300" cy="195" r="105" fill="none" stroke="#a5bbb1" stroke-width="2"/><text x="490" y="203" fill="#30483f" font-size="16" text-anchor="middle">x</text><text x="313" y="66" fill="#30483f" font-size="16" text-anchor="middle">y</text><line x1="300" y1="195" x2="216.0" y2="132.0" stroke="#3977ae" stroke-width="3"/><line x1="216.0" y1="132.0" x2="216.0" y2="195" stroke="#b96829" stroke-width="2" stroke-dasharray="7 6"/><line x1="216.0" y1="132.0" x2="300" y2="132.0" stroke="#28866b" stroke-width="2" stroke-dasharray="7 6"/><circle cx="216.0" cy="132.0" r="5" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="156" y="113" fill="#30483f" font-size="19" text-anchor="middle">第二象限</text><text x="166" y="151" fill="#28866b" font-size="17" text-anchor="middle">y = 3/5 &gt; 0</text><text x="199" y="222" fill="#b96829" font-size="18" text-anchor="middle">x &lt; 0</text><text x="320" y="338" fill="#30483f" font-size="19" text-anchor="middle">单位圆：横坐标是 cos，纵坐标是 sin</text></g></svg>

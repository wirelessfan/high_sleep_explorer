<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">动滑轮 · 情境图</title><desc id="desc">题目情境示意：同一结构改吊6 kg物体并以2 m/s²向上加速，g=10。拉力和自由端向上加速度是： 两股张力共同提起整体，还要提供向上的加速度；不能把加速装置当成平衡装置。箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="100" y1="75" x2="175" y2="75" stroke="#30483f" stroke-width="3"/><path d="M 140 75 V 195 A 40 40 0 0 0 220 195 V 95" fill="none" stroke="#b96829" stroke-width="5" stroke-linejoin="round"/><circle cx="180" cy="195" r="32" fill="#fff" stroke="#28866b" stroke-width="2"/><line x1="180" y1="227" x2="180" y2="250" stroke="#30483f" stroke-width="3"/><rect x="140" y="250" width="80" height="45" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="180.0" y="278.5" fill="#30483f" font-size="18" text-anchor="middle">6 kg</text><line x1="220" y1="110" x2="220" y2="70" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(220 70) rotate(-90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="286" y="87" fill="#3977ae" font-size="16" text-anchor="middle">自由端 ↑</text><text x="180" y="324" fill="#30483f" font-size="17" text-anchor="middle">一端固定，另一端自由</text><text x="455" y="80" fill="#30483f" font-size="18" text-anchor="middle">负载 + 轻滑轮整体</text><rect x="402" y="164" width="106" height="62" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="455.0" y="201.0" fill="#30483f" font-size="18" text-anchor="middle">整体</text><line x1="420" y1="164" x2="420" y2="105" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(420 105) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="400" y="125" fill="#28866b" font-size="18" text-anchor="middle">T</text><line x1="490" y1="164" x2="490" y2="105" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(490 105) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="514" y="125" fill="#28866b" font-size="18" text-anchor="middle">T</text><line x1="455" y1="226" x2="455" y2="295" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(455 295) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="520" y="280" fill="#b96829" font-size="16" text-anchor="middle">mg = 60 N</text><text x="455" y="323" fill="#3977ae" font-size="19" text-anchor="middle">a = 2 m/s² ↑</text><text x="320" y="350" fill="#30483f" font-size="16" text-anchor="middle">滑轮升高 Δh → 两段各缩短 Δh → 自由端上移 2Δh</text></g></svg>

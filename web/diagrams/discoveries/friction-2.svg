<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">静摩擦 · 情境图</title><desc id="desc">题目情境示意：2 kg物块放在水平加速的板上，μs=0.4、g=10。板向右加速时，关于物块与板保持相对静止的判断正确的是： 左图仅画物块的水平受力，竖直方向支持力与重力平衡。右图是“不滑所需”的摩擦，上限8N；10N不是实际静摩擦。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="173" y="85" fill="#30483f" font-size="16" text-anchor="middle">只画物块水平方向的受力</text><rect x="100" y="130" width="140" height="75" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="170.0" y="173.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><rect x="65" y="205" width="230" height="23" rx="12" fill="#f8e6cd" stroke="#a1beb0" stroke-width="2"/><line x1="240" y1="165" x2="310" y2="165" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(310 165) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="282" y="143" fill="#b96829" font-size="18" text-anchor="middle">f →</text><line x1="115" y1="266" x2="270" y2="266" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(270 266) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="185" y="297" fill="#3977ae" font-size="17" text-anchor="middle">板向右加速</text><text x="464" y="90" fill="#30483f" font-size="18" text-anchor="middle">假设不滑：需 f = ma</text><text x="360" y="125" fill="#3977ae" font-size="16" text-anchor="start">a=3：需 6 N</text><line x1="360" y1="148" x2="462" y2="148" stroke="#3977ae" stroke-width="13"/><text x="360" y="209" fill="#3977ae" font-size="16" text-anchor="start">a=5：需 10 N</text><line x1="360" y1="232" x2="530" y2="232" stroke="#3977ae" stroke-width="13"/><line x1="496" y1="132" x2="496" y2="245" stroke="#b96829" stroke-width="2" stroke-dasharray="7 6"/><text x="444" y="278" fill="#b96829" font-size="17" text-anchor="middle">上限 μsN = 8 N</text><text x="320" y="346" fill="#30483f" font-size="18" text-anchor="middle">摩擦可向右：它阻碍的是相对滑动趋势</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">静摩擦 · 情境图</title><desc id="desc">题目情境示意：2 kg物块放在水平加速的板上，μs=0.4、g=10。板向右加速时，关于物块与板保持相对静止的判断正确的是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="90" y1="265" x2="550" y2="265" stroke="#30483f" stroke-width="3"/><rect x="250" y="165" width="130" height="85" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="315.0" y="213.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><rect x="150" y="250" width="350" height="26" rx="12" fill="#f8e6cd" stroke="#a1beb0" stroke-width="2"/><line x1="410" y1="220" x2="535" y2="220" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(535 220) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="473" y="193" fill="#3977ae" font-size="17" text-anchor="middle">板向右加速</text><text x="320" y="310" fill="#30483f" font-size="17" text-anchor="middle">留意物块和板是否一起运动</text></g></svg>

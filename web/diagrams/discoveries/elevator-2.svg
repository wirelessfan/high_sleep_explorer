<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">超失重 · 情境图</title><desc id="desc">题目情境示意：60 kg乘客随电梯向下运动并以2 m/s²减速，g=10。正确判断是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="180" y="70" width="280" height="230" rx="12" fill="#f5f8f4" stroke="#a1beb0" stroke-width="2"/><rect x="275" y="258" width="90" height="20" rx="12" fill="#d6e6dd" stroke="#a1beb0" stroke-width="2"/><circle cx="320" cy="145" r="17" fill="#f9e3ca" stroke="#b96829" stroke-width="2"/><line x1="320" y1="163" x2="320" y2="218" stroke="#30483f" stroke-width="3"/><line x1="320" y1="180" x2="290" y2="200" stroke="#30483f" stroke-width="3"/><line x1="320" y1="180" x2="350" y2="200" stroke="#30483f" stroke-width="3"/><line x1="320" y1="218" x2="299" y2="255" stroke="#30483f" stroke-width="3"/><line x1="320" y1="218" x2="341" y2="255" stroke="#30483f" stroke-width="3"/><line x1="130" y1="115" x2="130" y2="215" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(130 215) rotate(90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="83" y="170" fill="#3977ae" font-size="18" text-anchor="middle">v</text><line x1="510" y1="215" x2="510" y2="115" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(510 115) rotate(-90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="554" y="170" fill="#b96829" font-size="18" text-anchor="middle">a</text><text x="320" y="105" fill="#30483f" font-size="18" text-anchor="middle">60 kg</text><text x="320" y="326" fill="#30483f" font-size="17" text-anchor="middle">示数看加速度，别只看运动方向</text></g></svg>

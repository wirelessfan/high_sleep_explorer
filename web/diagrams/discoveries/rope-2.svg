<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">轻绳等张力 · 情境图</title><desc id="desc">题目情境示意：一根质量 1 kg 的均匀绳竖直静止，上端固定，下端吊 2 kg 物体，g=10 m/s²。如何检查“同根绳张力处处相等”？</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="240" y1="65" x2="400" y2="65" stroke="#30483f" stroke-width="3"/><path d="M 320 65 V 215" fill="none" stroke="#b96829" stroke-width="12" stroke-linejoin="round"/><rect x="272" y="215" width="96" height="65" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="320.0" y="253.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><text x="445" y="145" fill="#30483f" font-size="17" text-anchor="middle">绳本身有质量：1 kg</text><line x1="260" y1="115" x2="260" y2="72" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(260 72) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="211" y="104" fill="#30483f" font-size="18" text-anchor="middle">T上</text><line x1="260" y1="185" x2="260" y2="226" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(260 226) rotate(90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="205" y="211" fill="#30483f" font-size="18" text-anchor="middle">T下</text><text x="340" y="305" fill="#30483f" font-size="17" text-anchor="middle">把绳子也当作一个研究对象</text></g></svg>

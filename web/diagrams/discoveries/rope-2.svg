<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">轻绳等张力 · 情境图</title><desc id="desc">题目情境示意：一根质量 1 kg 的均匀绳竖直静止，上端固定，下端吊 2 kg 物体，g=10 m/s²。如何检查“同根绳张力处处相等”？ 右图只研究绳子：上端力向上，下端拉力与绳自重向下。T下是物体对绳的力。箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="180" y="80" fill="#30483f" font-size="19" text-anchor="middle">实际装置</text><line x1="110" y1="100" x2="250" y2="100" stroke="#30483f" stroke-width="3"/><line x1="180" y1="100" x2="180" y2="210" stroke="#b96829" stroke-width="12"/><rect x="140" y="210" width="80" height="55" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="180.0" y="243.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><text x="180" y="298" fill="#30483f" font-size="17" text-anchor="middle">绳也有 1 kg 质量</text><text x="450" y="80" fill="#30483f" font-size="19" text-anchor="middle">只研究绳子</text><rect x="418" y="140" width="64" height="75" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="450.0" y="183.5" fill="#30483f" font-size="18" text-anchor="middle">绳</text><line x1="450" y1="140" x2="450" y2="100" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(450 100) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="522" y="112" fill="#28866b" font-size="18" text-anchor="middle">T上 ↑</text><line x1="435" y1="215" x2="435" y2="280" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(435 280) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="369" y="267" fill="#b96829" font-size="16" text-anchor="middle">自重 10 N</text><line x1="470" y1="215" x2="470" y2="250" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(470 250) rotate(90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="545" y="235" fill="#3977ae" font-size="16" text-anchor="middle">T下 = 20 N</text><text x="320" y="336" fill="#30483f" font-size="20" text-anchor="middle">静止：T上 = T下 + 绳的自重</text></g></svg>

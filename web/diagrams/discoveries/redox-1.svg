<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">氧化还原 · 情境图</title><desc id="desc">题目情境示意：Cl₂+2OH⁻→Cl⁻+ClO⁻+H₂O中，1 mol Cl₂参与反应时转移电子的物质的量是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="255" y="80" width="130" height="60" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><text x="320.0" y="116.0" fill="#30483f" font-size="18" text-anchor="middle">Cl₂：0 价</text><line x1="255" y1="125" x2="175" y2="195" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(175 195) rotate(138.81407483429035)" fill="none" stroke="#3977ae" stroke-width="3"/><line x1="385" y1="125" x2="465" y2="195" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(465 195) rotate(41.18592516570965)" fill="none" stroke="#b96829" stroke-width="3"/><rect x="80" y="210" width="180" height="65" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><text x="170.0" y="248.5" fill="#30483f" font-size="18" text-anchor="middle">Cl⁻：−1 价</text><rect x="380" y="210" width="180" height="65" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="470.0" y="248.5" fill="#30483f" font-size="18" text-anchor="middle">ClO⁻：+1 价</text><line x1="370" y1="240" x2="270" y2="240" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(270 240) rotate(180.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="219" fill="#b96829" font-size="22" text-anchor="middle">e⁻</text><text x="170" y="302" fill="#3977ae" font-size="18" text-anchor="middle">得电子</text><text x="470" y="302" fill="#b96829" font-size="18" text-anchor="middle">失电子</text><text x="320" y="339" fill="#30483f" font-size="17" text-anchor="middle">同一种元素，也能同时扮演两个角色</text></g></sv
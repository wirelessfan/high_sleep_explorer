<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">氧化还原 · 情境图</title><desc id="desc">题目情境示意：Cl₂+2OH⁻→Cl⁻+ClO⁻+H₂O中，1 mol Cl₂参与反应时转移电子的物质的量是： 左右按化合价变化记账：1mol氯原子得电子，1mol失电子。得与失是同一笔转移的两端，不能相加；图不是反应机理。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="83" fill="#30483f" font-size="20" text-anchor="middle">1 mol Cl₂ = 2 mol Cl 原子（按化合价记账）</text><rect x="65" y="125" width="210" height="100" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="170" y="161" fill="#3977ae" font-size="20" text-anchor="middle">1 mol Cl：0 → −1</text><text x="170" y="197" fill="#30483f" font-size="19" text-anchor="middle">得 1 mol 电子</text><rect x="365" y="125" width="210" height="100" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="470" y="161" fill="#b96829" font-size="20" text-anchor="middle">1 mol Cl：0 → +1</text><text x="470" y="197" fill="#30483f" font-size="19" text-anchor="middle">失 1 mol 电子</text><line x1="360" y1="255" x2="280" y2="255" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(280 255) rotate(180.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="292" fill="#30483f" font-size="20" text-anchor="middle">同一笔转移：不把得与失相加</text><text x="320" y="337" fill="#30483f" font-size="18" text-anchor="middle">这是电子守恒账本，不表示微观反应路径</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">超失重 · 情境图</title><desc id="desc">题目情境示意：50 kg乘客随电梯向上运动，但加速度为竖直向下2 m/s²。g=10，体重计示数为： 蓝色v向上、a向下；右图只研究乘客，N向上、mg向下。体重计示数是N，失重时mg不变。力的箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="110" y="102" width="200" height="190" rx="12" fill="#edf4fa" stroke="#a1beb0" stroke-width="2"/><circle cx="210" cy="153" r="17" fill="#f9e3ca" stroke="#b96829" stroke-width="2"/><line x1="210" y1="170" x2="210" y2="225" stroke="#30483f" stroke-width="3"/><line x1="210" y1="184" x2="184" y2="207" stroke="#30483f" stroke-width="3"/><line x1="210" y1="184" x2="236" y2="207" stroke="#30483f" stroke-width="3"/><line x1="210" y1="225" x2="190" y2="260" stroke="#30483f" stroke-width="3"/><line x1="210" y1="225" x2="230" y2="260" stroke="#30483f" stroke-width="3"/><rect x="165" y="262" width="90" height="16" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="210" y="123" fill="#30483f" font-size="17" text-anchor="middle">50 kg</text><line x1="68" y1="236" x2="68" y2="144" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(68 144) rotate(-90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="68" y="275" fill="#3977ae" font-size="18" text-anchor="middle">v</text><line x1="345" y1="144" x2="345" y2="236" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(345 236) rotate(90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="345" y="275" fill="#3977ae" font-size="18" text-anchor="middle">a</text><text x="490" y="82" fill="#30483f" font-size="18" text-anchor="middle">只研究乘客</text><rect x="453" y="165" width="74" height="60" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="490.0" y="201.0" fill="#30483f" font-size="18" text-anchor="middle">乘客</text><line x1="490" y1="165" x2="490" y2="105" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(490 105) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="550" y="125" fill="#28866b" font-size="18" text-anchor="middle">N ↑</text><line x1="490" y1="225" x2="490" y2="295" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(490 295) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="559" y="281" fill="#b96829" font-size="17" text-anchor="middle">mg ↓</text><text x="210" y="321" fill="#3977ae" font-size="19" text-anchor="middle">向上减速</text><text x="320" y="349" fill="#30483f" font-size="18" text-anchor="middle">体重计读的是支持力 N；重力 mg 没有改变</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">三角函数 · 情境图</title><desc id="desc">题目情境示意：α为锐角，sin(π/2+α)cos(π+α)等于： 三条射线分别为α、π/2+α、π+α。角度只作示意；后两个角分别在第二、第三象限，乘积应为负。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="150" y1="195" x2="475" y2="195" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(475 195) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><line x1="300" y1="310" x2="300" y2="65" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(300 65) rotate(-90.0)" fill="none" stroke="#30483f" stroke-width="3"/><circle cx="300" cy="195" r="105" fill="none" stroke="#a5bbb1" stroke-width="2"/><text x="490" y="203" fill="#30483f" font-size="16" text-anchor="middle">x</text><text x="313" y="66" fill="#30483f" font-size="16" text-anchor="middle">y</text><line x1="300" y1="195" x2="386.01" y2="134.77" stroke="#3977ae" stroke-width="3"/><circle cx="386.01" cy="134.77" r="5" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="470" y="139" fill="#3977ae" font-size="17" text-anchor="middle">α（锐角）</text><line x1="300" y1="195" x2="239.77" y2="108.99" stroke="#28866b" stroke-width="3"/><circle cx="239.77" cy="108.99" r="5" fill="#fff" stroke="#28866b" stroke-width="2"/><text x="166" y="89" fill="#28866b" font-size="17" text-anchor="middle">β = π/2 + α</text><line x1="300" y1="195" x2="213.99" y2="255.23" stroke="#b96829" stroke-width="3"/><circle cx="213.99" cy="255.23" r="5" fill="#fff" stroke="#b96829" stroke-width="2"/><text x="151" y="283" fill="#b96829" font-size="17" text-anchor="middle">γ = π + α</text><text x="470" y="252" fill="#28866b" font-size="18" text-anchor="middle">sinβ &gt; 0</text><text x="470" y="283" fill="#b96829" font-size="18" text-anchor="middle">cosγ &lt; 0</text><text x="320" y="341" fill="#30483f" font-size="18" text-anchor="middle">角度仅作示意；先判符号，再用诱导公式</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">22.4 · 情境图</title><desc id="desc">题目情境示意：标准状况下4.48 L O₂/O₃混合气体，O₂体积分数25%，忽略非理想性。含氧原子总数为： 蓝色双球是O₂，绿色三球是O₃。图只表达分子数1:3的比例；总物质的量算出后，再按每分子2或3个原子加权。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="75" y="100" width="490" height="175" rx="12" fill="#f4f8fb" stroke="#a1beb0" stroke-width="2"/><circle cx="142" cy="160" r="12" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="168" cy="160" r="12" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><text x="155" y="235" fill="#3977ae" font-size="18" text-anchor="middle">O₂ × 1</text><circle cx="270" cy="161" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="285" cy="143" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="300" cy="161" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="400" cy="161" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="415" cy="143" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="430" cy="161" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="475" cy="226" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="490" cy="208" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><circle cx="505" cy="226" r="12" fill="#e4f0e8" stroke="#28866b" stroke-width="2"/><text x="355" y="245" fill="#28866b" font-size="18" text-anchor="middle">O₃ × 3</text><text x="320" y="84" fill="#30483f" font-size="20" text-anchor="middle">相同温压：体积比 = 分子数比</text><text x="320" y="310" fill="#30483f" font-size="17" text-anchor="middle">这里只表示 1 : 3 的比例，不是实际只有 4 个分子</text><text x="320" y="341" fill="#30483f" font-size="18" text-anchor="middle">一个 O₂ 有 2 个氧原子；一个 O₃ 有 3 个</text></g></svg>

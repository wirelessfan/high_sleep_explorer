<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">v-t图像 · 情境图</title><desc id="desc">题目情境示意：质点在0≤t≤3 s内满足v=−2+2t（m/s）。位移和路程分别为： 轴下橙色表示负位移，轴上绿色表示正位移；t=1秒变向。线斜率为正，负速度不表示负加速度。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="105" y1="190" x2="555" y2="190" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(555 190) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><line x1="120" y1="305" x2="120" y2="65" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(120 65) rotate(-90.0)" fill="none" stroke="#30483f" stroke-width="3"/><text x="576" y="198" fill="#30483f" font-size="15" text-anchor="middle">t/s</text><text x="194" y="72" fill="#30483f" font-size="15" text-anchor="middle">v/(m/s)</text><path d="M 120 190 L 120 240 L 220 190 L 220 190 Z" fill="#fae6d0" stroke="#b96829" stroke-width="1" stroke-linejoin="round"/><path d="M 220 190 L 220 190 L 420 90 L 420 190 Z" fill="#d9efe4" stroke="#28866b" stroke-width="1" stroke-linejoin="round"/><line x1="120" y1="190" x2="120" y2="240" stroke="#30483f" stroke-width="1" stroke-dasharray="7 6"/><circle cx="120" cy="240" r="4" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="120" y="213" fill="#30483f" font-size="15" text-anchor="middle">0</text><text x="96" y="245" fill="#30483f" font-size="15" text-anchor="middle">-2</text><line x1="220" y1="190" x2="220" y2="190" stroke="#30483f" stroke-width="1" stroke-dasharray="7 6"/><circle cx="220" cy="190" r="4" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="220" y="213" fill="#30483f" font-size="15" text-anchor="middle">1</text><line x1="420" y1="190" x2="420" y2="90" stroke="#30483f" stroke-width="1" stroke-dasharray="7 6"/><circle cx="420" cy="90" r="4" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="420" y="213" fill="#30483f" font-size="15" text-anchor="middle">3</text><text x="96" y="95" fill="#30483f" font-size="15" text-anchor="middle">4</text><path d="M 120 240 L 220 190 L 420 90" fill="none" stroke="#3977ae" stroke-width="4" stroke-linejoin="round"/><text x="345" y="90" fill="#30483f" font-size="17" text-anchor="middle">轴上 +，轴下 −</text><text x="320" y="333" fill="#30483f" font-size="18" text-anchor="middle">位移：带符号相加；路程：面积绝对值相加</text></g></svg>

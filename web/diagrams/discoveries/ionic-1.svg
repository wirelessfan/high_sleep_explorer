<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">离子式 · 情境图</title><desc id="desc">题目情境示意：大理石中的CaCO₃与稀盐酸反应，净离子方程式应采用： 烧杯底部示意CaCO₃固体，不能拆成游离离子；反应后有CO₂气体，Cl⁻是旁观离子。粒子图不表示数量比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><path d="M 90 123 V 223 Q 90 235 102 235 H 168 Q 180 235 180 223 V 123" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="93" y="165" width="84" height="66" rx="8" fill="#dceefa"/><text x="135" y="268" fill="#30483f" font-size="16" text-anchor="middle">固体保留化学式</text><rect x="110" y="201" width="50" height="28" rx="12" fill="#eee4d4" stroke="#a1beb0" stroke-width="2"/><text x="310" y="95" fill="#3977ae" font-size="24" text-anchor="middle">CaCO₃(s) + 2H⁺</text><line x1="315" y1="125" x2="315" y2="175" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(315 175) rotate(90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="420" y="218" fill="#30483f" font-size="23" text-anchor="middle">Ca²⁺ + CO₂↑ + H₂O</text><circle cx="400" cy="159" r="8" fill="none" stroke="#3977ae" stroke-width="2"/><circle cx="430" cy="136" r="6" fill="none" stroke="#3977ae" stroke-width="2"/><text x="415" y="269" fill="#30483f" font-size="18" text-anchor="middle">Cl⁻ 是旁观离子，可约去</text><text x="320" y="332" fill="#30483f" font-size="18" text-anchor="middle">核对：两侧净电荷都是 +2；各元素原子数相等</text></g></svg>

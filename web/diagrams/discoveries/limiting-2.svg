<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">限量试剂 · 情境图</title><desc id="desc">题目情境示意：0.1 mol Mg、0.1 mol Al混合，与0.4 mol HCl充分反应，假设仅生成相应氯化物和H₂。正确结论是： 两种金属全反应共需0.5mol酸，现只有0.4mol。总氢气由酸量决定，金属各自剩余量还缺分配条件。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="65" y="100" width="220" height="75" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="175.0" y="143.5" fill="#30483f" font-size="18" text-anchor="middle">Mg 需 HCl 0.2 mol</text><rect x="355" y="100" width="220" height="75" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="465.0" y="143.5" fill="#30483f" font-size="18" text-anchor="middle">Al 需 HCl 0.3 mol</text><line x1="180" y1="183" x2="270" y2="218" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(270 218) rotate(21.25050550713324)" fill="none" stroke="#28866b" stroke-width="3"/><line x1="460" y1="183" x2="370" y2="218" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(370 218) rotate(158.74949449286677)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="255" fill="#30483f" font-size="21" text-anchor="middle">全部反应需 0.5 mol，实际只有 0.4 mol</text><text x="320" y="300" fill="#3977ae" font-size="20" text-anchor="middle">总产氢量：用 2 H⁺ → H₂ 计量</text><text x="320" y="341" fill="#30483f" font-size="18" text-anchor="middle">知道酸用完，不等于知道哪种金属先用完</text></g></svg>

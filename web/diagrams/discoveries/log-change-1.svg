<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">换底与同值设等 · 情境图</title><desc id="desc">题目情境示意：已知log₂3=a，log₆4等于： 换底时分子分母必须用同一个底数；6=2×3，把分母拆成log₂2+log₂3。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="88" fill="#30483f" font-size="20" text-anchor="middle">把不同底数，翻译成同一种语言</text><text x="105" y="185" fill="#3977ae" font-size="27" text-anchor="middle">log₆ 4</text><line x1="177" y1="176" x2="245" y2="176" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(245 176) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="400" y="150" fill="#3977ae" font-size="29" text-anchor="middle">log₂ 4</text><line x1="290" y1="175" x2="515" y2="175" stroke="#30483f" stroke-width="3"/><text x="400" y="215" fill="#3977ae" font-size="29" text-anchor="middle">log₂ 6</text><text x="400" y="267" fill="#b96829" font-size="21" text-anchor="middle">6 = 2 × 3</text><text x="320" y="328" fill="#30483f" font-size="19" text-anchor="middle">分子看 4 = 2²；分母用乘积的对数法则</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">静摩擦 · 情境图</title><desc id="desc">题目情境示意：2 kg箱子在水平地面上，μs=0.5、μk=0.4，g=10，受6 N水平推力仍静止。摩擦力是： 箱子有推力、摩擦力、支持力和重力。10N是静摩擦上限，实际摩擦由静止所需决定。箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="65" y1="265" x2="360" y2="265" stroke="#30483f" stroke-width="3"/><rect x="150" y="175" width="120" height="90" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="210.0" y="226.0" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><line x1="150" y1="211" x2="77" y2="211" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(77 211) rotate(180.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="83" y="190" fill="#b96829" font-size="17" text-anchor="middle">f ?</text><line x1="270" y1="211" x2="350" y2="211" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(350 211) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="313" y="190" fill="#3977ae" font-size="16" text-anchor="middle">推力 6 N</text><line x1="210" y1="175" x2="210" y2="105" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(210 105) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="239" y="118" fill="#28866b" font-size="18" text-anchor="middle">N</text><line x1="210" y1="265" x2="210" y2="316" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(210 316) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="251" y="307" fill="#b96829" font-size="18" text-anchor="middle">mg</text><text x="480" y="115" fill="#30483f" font-size="17" text-anchor="middle">静摩擦的“本领上限”</text><rect x="395" y="140" width="170" height="55" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="480.0" y="173.5" fill="#30483f" font-size="18" text-anchor="middle">μsN = 10 N</text><text x="480" y="233" fill="#3977ae" font-size="17" text-anchor="middle">实际需要：抵住 6 N</text><text x="480" y="272" fill="#30483f" font-size="17" text-anchor="middle">没滑动 ≠ 没有摩擦</text><text x="320" y="349" fill="#30483f" font-size="19" text-anchor="middle">先算需要多少，再看上限够不够</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">静摩擦 · 情境图</title><desc id="desc">题目情境示意：2 kg箱子在水平地面上，μs=0.5、μk=0.4，g=10，受6 N水平推力仍静止。摩擦力是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="90" y1="265" x2="550" y2="265" stroke="#30483f" stroke-width="3"/><rect x="250" y="180" width="130" height="85" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="315.0" y="228.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><line x1="130" y1="207" x2="242" y2="207" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(242 207) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="171" y="181" fill="#3977ae" font-size="17" text-anchor="middle">推力 6 N</text><line x1="375" y1="248" x2="300" y2="248" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(300 248) rotate(180.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="447" y="243" fill="#b96829" font-size="17" text-anchor="middle">摩擦力？</text><text x="320" y="298" fill="#30483f" font-size="17" text-anchor="middle">箱子没有滑动</text></g></svg>

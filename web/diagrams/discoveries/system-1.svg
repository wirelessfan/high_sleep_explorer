<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">整体求加速度，隔离求内力 · 情境图</title><desc id="desc">题目情境示意：光滑水平面上，A为2 kg、B为3 kg，两物体相接，10 N水平力推A，B在A前方。加速度与A对B的推力为： 整体图用外力求共同加速度；右图只画B的水平受力，用B的质量求接触力。竖直方向受力平衡，箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="185" y="83" fill="#30483f" font-size="18" text-anchor="middle">先看整体：外力 10 N</text><line x1="50" y1="250" x2="330" y2="250" stroke="#30483f" stroke-width="3"/><rect x="115" y="170" width="75" height="80" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="152.5" y="216.0" fill="#30483f" font-size="18" text-anchor="middle">A 2kg</text><rect x="190" y="170" width="105" height="80" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="242.5" y="216.0" fill="#30483f" font-size="18" text-anchor="middle">B 3kg</text><line x1="45" y1="205" x2="108" y2="205" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(108 205) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="75" y="181" fill="#3977ae" font-size="16" text-anchor="middle">10 N</text><text x="185" y="295" fill="#30483f" font-size="18" text-anchor="middle">a = 外力 / 总质量</text><text x="475" y="83" fill="#30483f" font-size="16" text-anchor="middle">再隔离 B（只画水平方向）</text><rect x="431" y="170" width="95" height="80" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="478.5" y="216.0" fill="#30483f" font-size="18" text-anchor="middle">B 3kg</text><line x1="353" y1="210" x2="423" y2="210" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(423 210) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="388" y="188" fill="#b96829" font-size="16" text-anchor="middle">A推B</text><text x="478" y="295" fill="#30483f" font-size="18" text-anchor="middle">接触力 = mB a</text><text x="320" y="345" fill="#30483f" font-size="18" text-anchor="middle">内力在整体方程中抵消，但并没有消失</text></g></svg>

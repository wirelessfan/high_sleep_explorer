<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">限量试剂 · 情境图</title><desc id="desc">题目情境示意：0.1 mol Al和0.2 mol HCl按2Al+6HCl→2AlCl₃+3H₂完全反应。限量试剂与H₂量为： 条形比较的是n除以化学计量系数后的配方份数，不是直接比较原料的mol数。HCl可供的份数更少。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="88" fill="#30483f" font-size="22" text-anchor="middle">配方：2 Al + 6 HCl → 2 AlCl₃ + 3 H₂</text><rect x="70" y="120" width="220" height="105" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="180" y="157" fill="#3977ae" font-size="22" text-anchor="middle">Al：0.1 ÷ 2</text><text x="180" y="195" fill="#30483f" font-size="17" text-anchor="middle">可供 0.05 份反应</text><rect x="350" y="120" width="220" height="105" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="460" y="157" fill="#b96829" font-size="22" text-anchor="middle">HCl：0.2 ÷ 6</text><text x="460" y="195" fill="#30483f" font-size="17" text-anchor="middle">只能供约 0.033 份</text><line x1="85" y1="261" x2="285" y2="261" stroke="#3977ae" stroke-width="14"/><line x1="355" y1="261" x2="488.3" y2="261" stroke="#b96829" stroke-width="14"/><text x="320" y="327" fill="#30483f" font-size="19" text-anchor="middle">统一成“配方份数”再比；谁先用完，谁限量</text></g></svg>

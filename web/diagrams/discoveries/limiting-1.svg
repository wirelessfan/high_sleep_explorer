<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">限量试剂 · 情境图</title><desc id="desc">题目情境示意：0.1 mol Al和0.2 mol HCl按2Al+6HCl→2AlCl₃+3H₂完全反应。限量试剂与H₂量为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="70" y="100" width="210" height="100" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><text x="175.0" y="156.0" fill="#30483f" font-size="18" text-anchor="middle">Al + HCl</text><rect x="360" y="100" width="210" height="100" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="465.0" y="156.0" fill="#30483f" font-size="18" text-anchor="middle">谁先用完？</text><line x1="290" y1="150" x2="350" y2="150" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(350 150) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="320" y="248" fill="#30483f" font-size="18" text-anchor="middle">把“原料份数”和“配方比例”放在一起看</text><text x="320" y="292" fill="#30483f" font-size="17" text-anchor="middle">就像配套餐：少的那一份会限制总量</text></g></svg>

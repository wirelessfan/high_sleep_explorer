<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">换底与同值设等 · 情境图</title><desc id="desc">题目情境示意：若2ˣ=3ʸ=6，则1/x+1/y为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="55" y="125" width="205" height="95" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><text x="157.5" y="178.5" fill="#30483f" font-size="18" text-anchor="middle">2ˣ = 6</text><rect x="380" y="125" width="205" height="95" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="482.5" y="178.5" fill="#30483f" font-size="18" text-anchor="middle">3ʸ = 6</text><line x1="270" y1="170" x2="368" y2="170" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(368 170) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="320" y="140" fill="#30483f" font-size="16" text-anchor="middle">搭座桥</text><text x="320" y="268" fill="#30483f" font-size="18" text-anchor="middle">不同的底数，也能用同一种语言表达</text><text x="320" y="305" fill="#30483f" font-size="17" text-anchor="middle">试着用换底公式连接左右两边</text></g></svg>

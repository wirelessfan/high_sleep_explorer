<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">换底与同值设等 · 情境图</title><desc id="desc">题目情境示意：若2ˣ=3ʸ=6，则1/x+1/y为： 先把指数写成对数，再取倒数，统一为以6为底的对数相加。x、y都非零。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="60" y="95" width="215" height="65" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="167.5" y="133.5" fill="#30483f" font-size="18" text-anchor="middle">2ˣ = 6</text><rect x="365" y="95" width="215" height="65" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="472.5" y="133.5" fill="#30483f" font-size="18" text-anchor="middle">3ʸ = 6</text><line x1="168" y1="169" x2="168" y2="202" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(168 202) rotate(90.0)" fill="none" stroke="#28866b" stroke-width="3"/><line x1="473" y1="169" x2="473" y2="202" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(473 202) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="168" y="240" fill="#3977ae" font-size="23" text-anchor="middle">1/x = log₆ 2</text><text x="473" y="240" fill="#b96829" font-size="23" text-anchor="middle">1/y = log₆ 3</text><path d="M 168 261 V 281 H 473 V 261" fill="none" stroke="#28866b" stroke-width="3" stroke-linejoin="round"/><text x="320" y="327" fill="#30483f" font-size="20" text-anchor="middle">同底相加：log₆ 2 + log₆ 3 = log₆(2 × 3)</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">氧化还原 · 情境图</title><desc id="desc">题目情境示意：0.1 mol Fe²⁺溶液中通入0.03 mol Cl₂，按2Fe²⁺+Cl₂→2Fe³⁺+2Cl⁻定量反应。Fe³⁺和剩余Fe²⁺量为： Fe²⁺每mol失1mol电子，Cl₂每mol得2mol电子；先匹配电子量，再核对铁元素总量与剩余。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="60" y="105" width="220" height="105" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="170" y="141" fill="#3977ae" font-size="21" text-anchor="middle">Fe²⁺ → Fe³⁺ + e⁻</text><text x="170" y="183" fill="#30483f" font-size="17" text-anchor="middle">每 mol 失 1 mol 电子</text><rect x="360" y="105" width="220" height="105" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="470" y="141" fill="#b96829" font-size="21" text-anchor="middle">Cl₂ + 2e⁻ → 2Cl⁻</text><text x="470" y="183" fill="#30483f" font-size="17" text-anchor="middle">每 mol 得 2 mol 电子</text><line x1="280" y1="239" x2="360" y2="239" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(360 239) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="284" fill="#30483f" font-size="21" text-anchor="middle">0.03 mol Cl₂ 只接收 0.06 mol 电子</text><text x="320" y="335" fill="#30483f" font-size="18" text-anchor="middle">电子账配平后，再算 Fe³⁺ 生成量与 Fe²⁺ 剩余量</text></g></svg>

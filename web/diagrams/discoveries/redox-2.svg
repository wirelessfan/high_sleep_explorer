<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">氧化还原 · 情境图</title><desc id="desc">题目情境示意：0.1 mol Fe²⁺溶液中通入0.03 mol Cl₂，按2Fe²⁺+Cl₂→2Fe³⁺+2Cl⁻定量反应。Fe³⁺和剩余Fe²⁺量为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="75" y="120" width="190" height="105" rx="12" fill="#e5f0f9" stroke="#a1beb0" stroke-width="2"/><text x="170.0" y="178.5" fill="#30483f" font-size="18" text-anchor="middle">Fe²⁺</text><rect x="375" y="120" width="190" height="105" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="470.0" y="178.5" fill="#30483f" font-size="18" text-anchor="middle">Cl₂</text><line x1="276" y1="170" x2="363" y2="170" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(363 170) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="145" fill="#b96829" font-size="22" text-anchor="middle">e⁻</text><text x="320" y="270" fill="#30483f" font-size="19" text-anchor="middle">电子从哪里来，又到哪里去？</text><text x="320" y="310" fill="#30483f" font-size="18" text-anchor="middle">先标化合价，再把电子的账算平</text></g></svg>

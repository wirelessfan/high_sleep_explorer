<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">离子式 · 情境图</title><desc id="desc">题目情境示意：0.1 mol NaHSO₄和0.075 mol Ba(OH)₂在水溶液中混合，忽略水电离和沉淀溶解。沉淀量与剩余OH⁻量分别为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><path d="M 90 135 V 235 Q 90 247 102 247 H 168 Q 180 247 180 235 V 135" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="93" y="177" width="84" height="66" rx="8" fill="#dceefa"/><text x="135" y="280" fill="#30483f" font-size="16" text-anchor="middle">NaHSO₄ 溶液</text><line x1="212" y1="185" x2="328" y2="185" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(328 185) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><path d="M 390 135 V 235 Q 390 247 402 247 H 468 Q 480 247 480 235 V 135" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="393" y="177" width="84" height="66" rx="8" fill="#dceefa"/><text x="435" y="280" fill="#30483f" font-size="16" text-anchor="middle">加入 Ba(OH)₂</text><text x="320" y="110" fill="#30483f" font-size="18" text-anchor="middle">沉淀与中和，可以分两条线观察</text><text x="320" y="323" fill="#30483f" font-size="17" text-anchor="middle">保留物态，再检查原子和电荷是否守恒</text></g></svg>

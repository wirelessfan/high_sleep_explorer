<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">离子式 · 情境图</title><desc id="desc">题目情境示意：0.1 mol NaHSO₄和0.075 mol Ba(OH)₂在水溶液中混合，忽略水电离和沉淀溶解。沉淀量与剩余OH⁻量分别为： 上面按Ba²⁺与SO₄²⁻的1:1关系算沉淀，下面按H⁺与OH⁻的1:1关系算中和。两条线各自判断限量。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="84" fill="#30483f" font-size="22" text-anchor="middle">一杯溶液，两本计量账</text><rect x="50" y="112" width="540" height="85" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="320" y="145" fill="#3977ae" font-size="19" text-anchor="middle">沉淀线：Ba²⁺ 0.075 mol + SO₄²⁻ 0.1 mol</text><text x="320" y="177" fill="#30483f" font-size="18" text-anchor="middle">按 1 : 1 配对 → BaSO₄↓</text><rect x="50" y="217" width="540" height="85" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="320" y="250" fill="#b96829" font-size="20" text-anchor="middle">中和线：H⁺ 0.1 mol + OH⁻ 0.15 mol</text><text x="320" y="282" fill="#30483f" font-size="18" text-anchor="middle">按 1 : 1 配对 → H₂O，留意剩余 OH⁻</text><text x="320" y="342" fill="#30483f" font-size="18" text-anchor="middle">先拆出实际离子量；沉淀与中和分别检查限量</text></g></svg>

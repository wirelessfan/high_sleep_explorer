<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">对数的通行证 · 情境图</title><desc id="desc">题目情境示意：解log₂(x−1)+log₂(3−x)≥0，最快且严谨的结果为： 两条真数为正的区间取交集，得到1&lt;x&lt;3；空心圆表示不包含端点，再在这个范围内解不等式。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="85" fill="#30483f" font-size="20" text-anchor="middle">先让两个真数都为正</text><line x1="85" y1="205" x2="560" y2="205" stroke="#30483f" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(560 205) rotate(0.0)" fill="none" stroke="#30483f" stroke-width="3"/><text x="190" y="235" fill="#30483f" font-size="17" text-anchor="middle">1</text><text x="320" y="235" fill="#30483f" font-size="17" text-anchor="middle">2</text><text x="450" y="235" fill="#30483f" font-size="17" text-anchor="middle">3</text><line x1="194" y1="140" x2="550" y2="140" stroke="#28866b" stroke-width="5"/><circle cx="190" cy="140" r="5" fill="#fff" stroke="#28866b" stroke-width="2"/><text x="306" y="120" fill="#28866b" font-size="18" text-anchor="middle">x − 1 &gt; 0</text><line x1="90" y1="181" x2="446" y2="181" stroke="#b96829" stroke-width="5"/><circle cx="450" cy="181" r="5" fill="#fff" stroke="#b96829" stroke-width="2"/><text x="306" y="167" fill="#b96829" font-size="18" text-anchor="middle">3 − x &gt; 0</text><line x1="196" y1="205" x2="444" y2="205" stroke="#3977ae" stroke-width="6"/><circle cx="190" cy="205" r="6" fill="#fff" stroke="#3977ae" stroke-width="2"/><circle cx="450" cy="205" r="6" fill="#fff" stroke="#3977ae" stroke-width="2"/><text x="320" y="280" fill="#3977ae" font-size="18" text-anchor="middle">交集：1 &lt; x &lt; 3（两端都不含）</text><text x="320" y="329" fill="#30483f" font-size="19" text-anchor="middle">再看乘积：(x − 1)(3 − x) = 1 − (x − 2)²</text></g></svg>

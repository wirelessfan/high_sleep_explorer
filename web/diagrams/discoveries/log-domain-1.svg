<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">对数的通行证 · 情境图</title><desc id="desc">题目情境示意：y=log_(a−1)(x−2)在实数范围有意义，a和x应满足： 底数是整个a−1，必须大于0且不等于1；真数是整个x−2，必须大于0。两组条件同时成立。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="104" fill="#3977ae" font-size="29" text-anchor="middle">y = log₍ₐ₋₁₎(x − 2)</text><line x1="260" y1="125" x2="180" y2="170" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(180 170) rotate(150.64224645720873)" fill="none" stroke="#28866b" stroke-width="3"/><line x1="400" y1="125" x2="465" y2="170" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(465 170) rotate(34.69515353123397)" fill="none" stroke="#b96829" stroke-width="3"/><rect x="65" y="185" width="230" height="100" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="180" y="216" fill="#28866b" font-size="19" text-anchor="middle">完整底数是 a − 1</text><text x="180" y="252" fill="#30483f" font-size="17" text-anchor="middle">a − 1 &gt; 0 且 a − 1 ≠ 1</text><rect x="340" y="185" width="230" height="100" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="455" y="216" fill="#b96829" font-size="19" text-anchor="middle">完整真数是 x − 2</text><text x="455" y="252" fill="#30483f" font-size="19" text-anchor="middle">x − 2 &gt; 0</text><text x="320" y="335" fill="#30483f" font-size="19" text-anchor="middle">像过两道门：底数合法，真数为正</text></g></svg>

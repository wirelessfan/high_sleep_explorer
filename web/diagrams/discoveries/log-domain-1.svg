<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">对数的通行证 · 情境图</title><desc id="desc">题目情境示意：y=log_(a−1)(x−2)在实数范围有意义，a和x应满足：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="75" y="105" width="490" height="90" rx="12" fill="#eef4fa" stroke="#a1beb0" stroke-width="2"/><text x="320" y="160" fill="#3977ae" font-size="26" text-anchor="middle">y = log₍ₐ₋₁₎(x − 2)</text><line x1="200" y1="205" x2="200" y2="235" stroke="#28866b" stroke-width="3"/><line x1="440" y1="205" x2="440" y2="235" stroke="#b96829" stroke-width="3"/><rect x="85" y="235" width="225" height="65" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="197.5" y="273.5" fill="#30483f" font-size="18" text-anchor="middle">底数：合法的通行证</text><rect x="330" y="235" width="225" height="65" rx="12" fill="#faeddf" stroke="#a1beb0" stroke-width="2"/><text x="442.5" y="273.5" fill="#30483f" font-size="18" text-anchor="middle">真数：正数才能进入</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">等电子粒子 · 情境图</title><desc id="desc">题目情境示意：O²⁻、F⁻、Na⁺、Mg²⁺均有10个电子，其半径由大到小排列为： 同为10电子的前提下，Z从8增至12，半径依次减小。圆大小仅示意趋势，不是等比例实测值。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><text x="320" y="85" fill="#30483f" font-size="21" text-anchor="middle">前提：四种离子都是 10 个电子</text><circle cx="110" cy="180" r="59" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="110" y="187" fill="#3977ae" font-size="23" text-anchor="middle">O²⁻</text><text x="110" y="267" fill="#30483f" font-size="19" text-anchor="middle">Z = 8</text><circle cx="250" cy="180" r="51" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="250" y="187" fill="#3977ae" font-size="23" text-anchor="middle">F⁻</text><text x="250" y="267" fill="#30483f" font-size="19" text-anchor="middle">Z = 9</text><circle cx="390" cy="180" r="41" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="390" y="187" fill="#3977ae" font-size="23" text-anchor="middle">Na⁺</text><text x="390" y="267" fill="#30483f" font-size="19" text-anchor="middle">Z = 11</text><circle cx="530" cy="180" r="34" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="530" y="187" fill="#3977ae" font-size="23" text-anchor="middle">Mg²⁺</text><text x="530" y="267" fill="#30483f" font-size="19" text-anchor="middle">Z = 12</text><line x1="110" y1="294" x2="530" y2="294" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(530 294) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="320" y="324" fill="#30483f" font-size="17" text-anchor="middle">核电荷增大 → 对同数电子吸引增强 → 半径减小</text><text x="320" y="350" fill="#30483f" font-size="16" text-anchor="middle">圆的大小只示意趋势，不是等比例的真实半径</text></g></svg>

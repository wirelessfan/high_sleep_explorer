<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">等电子粒子 · 情境图</title><desc id="desc">题目情境示意：O²⁻、F⁻、Na⁺、Mg²⁺均有10个电子，其半径由大到小排列为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><circle cx="110" cy="175" r="45" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="110" y="182" fill="#3977ae" font-size="23" text-anchor="middle">O²⁻</text><circle cx="250" cy="175" r="45" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="250" y="182" fill="#3977ae" font-size="23" text-anchor="middle">F⁻</text><circle cx="390" cy="175" r="45" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="390" y="182" fill="#3977ae" font-size="23" text-anchor="middle">Na⁺</text><circle cx="530" cy="175" r="45" fill="#eef4fa" stroke="#3977ae" stroke-width="2"/><text x="530" y="182" fill="#3977ae" font-size="23" text-anchor="middle">Mg²⁺</text><text x="320" y="95" fill="#30483f" font-size="21" text-anchor="middle">四个粒子都有 10 个电子</text><text x="320" y="276" fill="#30483f" font-size="17" text-anchor="middle">图中圆圈只是符号，不代表真实半径</text><text x="320" y="310" fill="#30483f" font-size="18" text-anchor="middle">谁对外层电子的吸引更强？</text></g></svg>

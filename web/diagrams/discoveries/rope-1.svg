<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">轻绳等张力 · 情境图</title><desc id="desc">题目情境示意：两物体 2 kg、3 kg 经同一根不可伸长的轻绳跨过理想定滑轮，由静止释放。g=10 m/s²。正确的快速处理及张力为：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="160" y1="65" x2="480" y2="65" stroke="#30483f" stroke-width="3"/><line x1="320" y1="65" x2="320" y2="94" stroke="#30483f" stroke-width="3"/><circle cx="320" cy="120" r="27" fill="#fff" stroke="#28866b" stroke-width="2"/><path d="M 290 213 V 120 A 30 30 0 0 1 350 120 V 245" fill="none" stroke="#b96829" stroke-width="5" stroke-linejoin="round"/><rect x="252" y="210" width="76" height="55" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="290.0" y="243.5" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><rect x="312" y="245" width="76" height="55" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="350.0" y="278.5" fill="#30483f" font-size="18" text-anchor="middle">3 kg</text><line x1="250" y1="200" x2="250" y2="145" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(250 145) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="227" y="150" fill="#30483f" font-size="18" text-anchor="middle">T</text><line x1="400" y1="232" x2="400" y2="172" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(400 172) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="423" y="177" fill="#30483f" font-size="18" text-anchor="middle">T</text><text x="476" y="130" fill="#30483f" font-size="17" text-anchor="middle">同一根轻绳</text><text x="476" y="158" fill="#30483f" font-size="17" text-anchor="middle">理想定滑轮</text></g></svg>

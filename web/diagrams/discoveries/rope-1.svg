<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">轻绳等张力 · 情境图</title><desc id="desc">题目情境示意：两物体 2 kg、3 kg 经同一根不可伸长的轻绳跨过理想定滑轮，由静止释放。g=10 m/s²。正确的快速处理及张力为： 绿色为相同张力T，橙色为20N和30N重力，蓝色为加速度。初速度为零不代表受力平衡。箭头不按比例。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="130" y1="65" x2="430" y2="65" stroke="#30483f" stroke-width="3"/><line x1="280" y1="65" x2="280" y2="84" stroke="#30483f" stroke-width="3"/><circle cx="280" cy="130" r="46" fill="#fff" stroke="#28866b" stroke-width="2"/><path d="M 230 210 V 130 A 50 50 0 0 1 330 130 V 230" fill="none" stroke="#b96829" stroke-width="5" stroke-linejoin="round"/><rect x="190" y="210" width="80" height="52" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="230.0" y="242.0" fill="#30483f" font-size="18" text-anchor="middle">2 kg</text><rect x="290" y="230" width="80" height="52" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="330.0" y="262.0" fill="#30483f" font-size="18" text-anchor="middle">3 kg</text><line x1="230" y1="210" x2="230" y2="155" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(230 155) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="207" y="171" fill="#28866b" font-size="18" text-anchor="middle">T</text><line x1="330" y1="230" x2="330" y2="175" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(330 175) rotate(-90.0)" fill="none" stroke="#28866b" stroke-width="3"/><text x="351" y="190" fill="#28866b" font-size="18" text-anchor="middle">T</text><line x1="230" y1="262" x2="230" y2="307" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(230 307) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="184" y="298" fill="#b96829" font-size="18" text-anchor="middle">20 N</text><line x1="330" y1="282" x2="330" y2="327" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(330 327) rotate(90.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="373" y="317" fill="#b96829" font-size="18" text-anchor="middle">30 N</text><line x1="145" y1="254" x2="145" y2="195" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(145 195) rotate(-90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="101" y="217" fill="#3977ae" font-size="16" text-anchor="middle">加速度</text><text x="101" y="241" fill="#3977ae" font-size="16" text-anchor="middle">向上</text><line x1="420" y1="220" x2="420" y2="279" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(420 279) rotate(90.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="486" y="242" fill="#3977ae" font-size="16" text-anchor="middle">加速度</text><text x="486" y="266" fill="#3977ae" font-size="16" text-anchor="middle">向下</text><text x="488" y="112" fill="#30483f" font-size="17" text-anchor="middle">同一根轻绳</text><text x="488" y="140" fill="#30483f" font-size="17" text-anchor="middle">理想定滑轮</text><text x="320" y="349" fill="#30483f" font-size="18" text-anchor="middle">张力相等 ≠ 各自受力平衡</text></g></svg>

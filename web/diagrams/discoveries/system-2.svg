<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">整体求加速度，隔离求内力 · 情境图</title><desc id="desc">题目情境示意：上层A=2 kg，下层B=3 kg，地面光滑，层间μs=0.4，g=10。仅拉B。下列判断正确的是： 左图强调水平力：A受层间摩擦向右，B受外拉力向右、A的摩擦向左。右图6N、10N均为“不滑假设”下的需求，超过8N假设失效。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><rect x="80" y="218" width="220" height="50" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="244" y="250" fill="#30483f" font-size="18" text-anchor="middle">B 3 kg</text><rect x="130" y="148" width="120" height="70" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="190.0" y="189.0" fill="#30483f" font-size="18" text-anchor="middle">A 2 kg</text><line x1="50" y1="270" x2="330" y2="270" stroke="#30483f" stroke-width="3"/><line x1="253" y1="182" x2="321" y2="182" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(321 182) rotate(0.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="291" y="158" fill="#b96829" font-size="16" text-anchor="middle">A受 f →</text><line x1="302" y1="244" x2="352" y2="244" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(352 244) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="338" y="222" fill="#3977ae" font-size="17" text-anchor="middle">F →</text><line x1="178" y1="246" x2="107" y2="246" stroke="#b96829" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(107 246) rotate(180.0)" fill="none" stroke="#b96829" stroke-width="3"/><text x="141" y="239" fill="#b96829" font-size="16" text-anchor="middle">f ←</text><text x="181" y="310" fill="#30483f" font-size="16" text-anchor="middle">地面光滑，层间有摩擦</text><text x="465" y="85" fill="#30483f" font-size="18" text-anchor="middle">先假设共同加速</text><text x="365" y="125" fill="#3977ae" font-size="16" text-anchor="start">F=15：需 6 N</text><line x1="365" y1="148" x2="467" y2="148" stroke="#3977ae" stroke-width="13"/><text x="365" y="209" fill="#3977ae" font-size="16" text-anchor="start">F=25：需 10 N</text><line x1="365" y1="232" x2="535" y2="232" stroke="#3977ae" stroke-width="13"/><line x1="501" y1="132" x2="501" y2="245" stroke="#b96829" stroke-width="2" stroke-dasharray="7 6"/><text x="449" y="278" fill="#b96829" font-size="17" text-anchor="middle">上限 μsN = 8 N</text><text x="320" y="349" fill="#30483f" font-size="17" text-anchor="middle">超过上限就会滑；共同加速度的假设随之失效</text></g></svg>

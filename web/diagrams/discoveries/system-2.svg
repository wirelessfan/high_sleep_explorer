<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">整体求加速度，隔离求内力 · 情境图</title><desc id="desc">题目情境示意：上层A=2 kg，下层B=3 kg，地面光滑，层间μs=0.4，g=10。仅拉B。下列判断正确的是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><line x1="80" y1="280" x2="560" y2="280" stroke="#30483f" stroke-width="3"/><rect x="220" y="230" width="220" height="50" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="330.0" y="261.0" fill="#30483f" font-size="18" text-anchor="middle">B 3 kg</text><rect x="270" y="160" width="120" height="70" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="330.0" y="201.0" fill="#30483f" font-size="18" text-anchor="middle">A 2 kg</text><line x1="448" y1="255" x2="550" y2="255" stroke="#3977ae" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(550 255) rotate(0.0)" fill="none" stroke="#3977ae" stroke-width="3"/><text x="505" y="226" fill="#3977ae" font-size="18" text-anchor="middle">只拉 B</text><text x="315" y="125" fill="#30483f" font-size="17" text-anchor="middle">层间可能发生相对滑动</text></g></svg>

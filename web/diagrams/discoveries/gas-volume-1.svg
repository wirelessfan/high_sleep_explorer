<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">22.4 · 情境图</title><desc id="desc">题目情境示意：标准状况下，把22.4 L水和22.4 L氧气都判作1 mol，错误点在： 标准状况还不够，还必须是气体。水不是水蒸气，不能套气体摩尔体积；氧气的分子数与原子数要区分。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><path d="M 120 120 V 220 Q 120 232 132 232 H 198 Q 210 232 210 220 V 120" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="123" y="162" width="84" height="66" rx="8" fill="#dceefa"/><text x="165" y="265" fill="#30483f" font-size="16" text-anchor="middle">水：不是气态</text><rect x="375" y="115" width="135" height="125" rx="12" fill="#edf4fa" stroke="#a1beb0" stroke-width="2"/><circle cx="400" cy="138" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="480" cy="155" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="435" cy="181" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="405" cy="210" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="481" cy="214" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><circle cx="463" cy="133" r="6" fill="#dfedf7" stroke="#3977ae" stroke-width="2"/><text x="443" y="265" fill="#30483f" font-size="16" text-anchor="middle">氧气：气态</text><text x="320" y="85" fill="#30483f" font-size="19" text-anchor="middle">同样是 22.4 L，能一概而论吗？</text><text x="320" y="320" fill="#30483f" font-size="19" text-anchor="middle">22.4 L/mol 的门票：标准状况 + 气体</text></g></svg>

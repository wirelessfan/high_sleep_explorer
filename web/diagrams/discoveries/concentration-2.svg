<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">浓度分母 · 情境图</title><desc id="desc">题目情境示意：100 mL 1 mol/L NaCl与200 mL 0.5 mol/L CaCl₂混合，体积可加且无反应。c(Cl⁻)是： 两种输入分别含0.1mol盐，但每个CaCl₂贡献两个Cl⁻。本题明确体积可加，最终体积为0.3L。液面不作定量刻度。</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><path d="M 85 100 V 200 Q 85 212 97 212 H 163 Q 175 212 175 200 V 100" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="88" y="142" width="84" height="66" rx="8" fill="#dceefa"/><text x="130" y="245" fill="#30483f" font-size="16" text-anchor="middle">NaCl：0.1 mol</text><path d="M 465 100 V 200 Q 465 212 477 212 H 543 Q 555 212 555 200 V 100" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="468" y="142" width="84" height="66" rx="8" fill="#dceefa"/><text x="510" y="245" fill="#30483f" font-size="16" text-anchor="middle">CaCl₂：0.1 mol</text><text x="130" y="80" fill="#30483f" font-size="16" text-anchor="middle">100 mL × 1 mol/L</text><text x="510" y="80" fill="#30483f" font-size="16" text-anchor="middle">200 mL × 0.5 mol/L</text><line x1="188" y1="180" x2="265" y2="230" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(265 230) rotate(32.99770510121629)" fill="none" stroke="#28866b" stroke-width="3"/><line x1="452" y1="180" x2="375" y2="230" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(375 230) rotate(147.0022948987837)" fill="none" stroke="#28866b" stroke-width="3"/><rect x="210" y="242" width="220" height="60" rx="12" fill="#e2f1e9" stroke="#a1beb0" stroke-width="2"/><text x="320.0" y="278.0" fill="#30483f" font-size="18" text-anchor="middle">最终溶液 0.3 L</text><text x="320" y="130" fill="#30483f" font-size="18" text-anchor="middle">各贡献多少 Cl⁻？</text><text x="320" y="177" fill="#3977ae" font-size="23" text-anchor="middle">1 倍 + 2 倍</text><text x="320" y="337" fill="#30483f" font-size="18" text-anchor="middle">先数离子，再除最终体积；本题已知体积可加</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">浓度分母 · 情境图</title><desc id="desc">题目情境示意：100 mL 1 mol/L NaCl与200 mL 0.5 mol/L CaCl₂混合，体积可加且无反应。c(Cl⁻)是：</desc><rect width="640" height="360" rx="20" fill="#f5faf7"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="36" fill="#28866b" font-size="17" text-anchor="start">一起看图找线索</text><path d="M 100 130 V 230 Q 100 242 112 242 H 178 Q 190 242 190 230 V 130" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="103" y="172" width="84" height="66" rx="8" fill="#dceefa"/><text x="145" y="275" fill="#30483f" font-size="16" text-anchor="middle">100 mL NaCl 溶液</text><line x1="215" y1="185" x2="325" y2="185" stroke="#28866b" stroke-width="3"/><path d="M -10 -5 L 0 0 L -10 5" transform="translate(325 185) rotate(0.0)" fill="none" stroke="#28866b" stroke-width="3"/><path d="M 385 130 V 230 Q 385 242 397 242 H 463 Q 475 242 475 230 V 130" fill="none" stroke="#3977ae" stroke-width="3" stroke-linejoin="round"/><rect x="388" y="172" width="84" height="66" rx="8" fill="#dceefa"/><text x="430" y="275" fill="#30483f" font-size="16" text-anchor="middle">混合后的溶液</text><text x="320" y="94" fill="#30483f" font-size="18" text-anchor="middle">再加入 200 mL CaCl₂ 溶液</text><text x="320" y="321" fill="#30483f" font-size="18" text-anchor="middle">浓度里的 V，要找最终溶液的体积</text></g></svg>

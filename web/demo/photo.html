<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题拍照录入</title>
<style>
*{box-sizing:border-box}body{max-width:800px;margin:auto;padding:20px;font:14px/1.7 system-ui;background:#fbf6ee;color:#3b2f2a}section,article{background:#fffdf9;border:1px solid #eadfd0;border-radius:12px;padding:16px;margin:12px 0}button{padding:10px 15px;border:0;border-radius:8px;background:#087f75;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:not-allowed}textarea,select,input[type=text]{width:100%;padding:8px;margin:5px 0;font:inherit;border:1px solid #d9ccbc;border-radius:6px}textarea{min-height:100px}img{max-width:100%;max-height:650px;object-fit:contain}small,.hint{color:#78685f}.notice{background:#fff3cf;padding:10px;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#message{position:sticky;top:0;background:#e2f3ed;padding:10px;z-index:2}label{display:block}h1{font-size:23px}summary{cursor:pointer}
</style>
</head>
<body>
<h1>错题拍照录入</h1>
<p>GLM 初步识图 → GPT 对照原图确认。完全一致则服务器自动录入；有修订则逐题人工复核后勾选保存；失败、不确定或截断均待处理，可重试。确认仅指转录一致，不代表答案正确，不会自动求解或编造答案。</p>
<div id="message" role="status">请选择清晰图片，上传前请遮蔽姓名、学号等个人信息。</div>
<section><input id="file" type="file" accept="image/*"><button id="recognize">识图并确认</button><button id="recover">恢复最近任务</button><div class="hint">保留最长边 2400px；原图按账号鉴权保存，失败任务也可恢复。</div><img id="preview" alt="试卷原图" hidden></section>
<section id="review" hidden><h2>识别与确认结果</h2><div id="meta"></div><div id="warnings" class="notice"></div><details><summary>GLM 原始转录（保留不覆盖）</summary><pre id="original"></pre></details><div id="questions"></div><button id="save">人工复核后保存已勾选题目</button><button id="retry">重试待处理任务</button></section>
<script>
const $=id=>document.getElementById(id);let state={image:'',job:null,busy:false};
function message(text){$('message').textContent=text}
async function token(){let t=localStorage.getItem('learn.token');if(t)return t;const r=await fetch('/api/v1/session',{method:'POST'});if(!r.ok)throw Error('请先登录主站');const d=await r.json();localStorage.setItem('learn.token',d.token);return d.token}
async function request(path,body){const t=await token();const r=await fetch('/api/v1'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:d.error?.message||`请求失败 ${r.status}`);return d}
async function run(fn){if(state.busy)return;state.busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message+'；可恢复任务后重试，重复请求不会重复录入。')}finally{state.busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(state.job)updateButtons()}}
function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);const k=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.92))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('图片读取失败'))};img.src=url})}
function field(card,label,node){const l=document.createElement('label');l.textContent=label;l.appendChild(node);card.appendChild(l)}
function updateButtons(){$('save').disabled=state.job.state!=='manual_review';$('retry').disabled=['saved','manual_review'].includes(state.job.state)}
function paint(out){state.job=out;state.questions=(out.questions||[]).map((q,i)=>({...q,item_index:i,selected:false}));$('review').hidden=false;const names={saved:out.save_mode==='human'?'人工复核录入成功':'自动录入成功',manual_review:'GPT 已修订，待人工审核',pending:'待处理，可重试',processing:'处理中'};$('meta').textContent=`GLM：${out.model||'尚未返回'} / ${out.channel||'-'}；GPT：${out.review?.model||'gpt-6.1-sol（尚未成功）'} / ${out.review?.channel||'review91 → reviewugq'}；${names[out.state]||out.state}；共 ${state.questions.length} 题`;$('warnings').textContent=[out.error,...(out.warnings||[]),...(out.review?.reasons||[])].filter(Boolean).join('\n')||'转录确认不等于答案正确；无标准答案时保留空白。';$('original').textContent=JSON.stringify(out.original?.questions||[],null,2);$('questions').replaceChildren();state.questions.forEach((q,i)=>{const card=document.createElement('article'),cb=document.createElement('input');cb.type='checkbox';cb.disabled=out.state!=='manual_review';cb.onchange=()=>q.selected=cb.checked;const label=document.createElement('label');label.append(cb,document.createTextNode(`第 ${q.question_no||i+1} 题 · ${q.statusText||names[out.state]||'待处理'}`));card.appendChild(label);const stem=document.createElement('textarea');stem.value=q.stem;stem.readOnly=out.state!=='manual_review';stem.oninput=()=>q.stem=stem.value;field(card,'题干（含共享材料）',stem);const type=document.createElement('select');[['choice','选择题'],['fill','填空题'],['solution','解答题']].forEach(([value,text])=>{const o=document.createElement('option');o.value=value;o.textContent=text;type.appendChild(o)});type.value=q.qtype;type.disabled=out.state!=='manual_review';type.onchange=()=>q.qtype=type.value;field(card,'题型',type);const opts=document.createElement('textarea');opts.value=(q.options||[]).join('\n');opts.readOnly=out.state!=='manual_review';opts.oninput=()=>q.options=opts.value.split('\n').map(x=>x.trim()).filter(Boolean);field(card,'选项（每行一个，非选择题留空）',opts);const answer=document.createElement('input');answer.type='text';answer.value=q.answer_text||'';answer.readOnly=out.state!=='manual_review';answer.oninput=()=>q.answer_text=answer.value;field(card,'原图已有答案转录（可留空，未验证正确性）',answer);if(q.needs_image||q.uncertain?.length){const n=document.createElement('div');n.className='notice';n.textContent=[q.image_hint,...(q.uncertain||[])].filter(Boolean).join('；')||'含图形，请对照原图';card.appendChild(n)}$('questions').appendChild(card)});updateButtons();message(names[out.state]||'任务结果已恢复')}
$('file').onchange=()=>run(async()=>{const f=$('file').files?.[0];if(!f)return;state.image=await compress(f);state.job=null;$('review').hidden=true;$('preview').src=state.image;$('preview').hidden=false;message('图片已准备，请点击识图并确认')});
$('recognize').onclick=()=>run(async()=>{if(!state.image)throw Error('请先选择图片');message('GLM 初录与 GPT 原图确认中，请勿重复提交');paint((await request('/wrongbook/photo/recognize',{image:state.image})).result)});
$('retry').onclick=()=>run(async()=>{message('重试原图确认中');paint((await request('/wrongbook/photo/retry/'+state.job.job_id,{})).result)});
$('recover').onclick=()=>run(async()=>{const d=await request('/wrongbook/photo/jobs');if(!d.jobs.length)throw Error('当前账号暂无任务');const jobs=d.jobs;const j=jobs.find(x=>x.state!=='saved')||jobs[0];paint({...j.result,job_id:j.job_id,state:j.state});const t=await token(),r=await fetch('/api/v1/wrongbook/photo/image/'+j.job_id,{headers:{Authorization:`Bearer ${t}`}});if(r.ok){const url=URL.createObjectURL(await r.blob());$('preview').src=url;$('preview').onload=()=>URL.revokeObjectURL(url);$('preview').hidden=false}});
$('save').onclick=()=>run(async()=>{const selected=state.questions.filter(q=>q.selected);if(!selected.length)throw Error('请逐题核对原图后勾选');const items=selected.map(q=>({...q,job_id:state.job.job_id,picked:-1,answer:-1,image_path:'',options:q.qtype==='choice'?q.options:[]}));const d=await request('/wrongbook/photo/save-batch',{items});d.results.forEach((r,i)=>{if(['saved','duplicate'].includes(r.status)){selected[i].selected=false;selected[i].statusText='人工复核录入成功'}else selected[i].statusText=r.error});const qs=state.questions;paint({...state.job,questions:qs});message(d.results.map((r,i)=>`第 ${selected[i].question_no||i+1} 题：${r.status==='failed'?r.error:'已录入（重复提交不重复生成）'}`).join('；'))});
</script>
</body>
</html>
